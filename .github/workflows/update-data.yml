name: Update results data

# Rebuilds data/*.json (the website reads these first) from the Google Sheets and TAS Exchange.
# Schedules only run on the default branch, so on a feature branch use "Run workflow" by hand.
on:
  schedule:
    # Off the hour on purpose: GitHub delays runs scheduled exactly on the hour.
    - cron: '17 21 * * 6'  # Saturday 21:17 UTC, right after the edition (it ends 21:00 Lisbon in winter, 20:00 UTC in summer)
    - cron: '47 22 * * 6'  # Saturday 22:47 UTC, in case the times were revealed a bit later
    - cron: '17 12 * * 0'  # Sunday 12:17 UTC, last try for the weekend
  workflow_dispatch:
    inputs:
      sheets_only:
        description: 'Only refresh the Google Sheets (skip TAS Exchange)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the parsers
        run: node scripts/update-data.mjs --selftest
      - name: Fetch sheets and events
        run: node scripts/update-data.mjs ${{ inputs.sheets_only && '--sheets' || '' }}
      - name: Commit changed data
        run: |
          git config user.name "speedtas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          # updated.json changes on every run; only commit when results actually changed
          if git diff --cached --quiet -- data ':!data/updated.json'; then
            echo "No result changes."
          else
            git commit -m "data: refresh $(date -u +'%F %H:%M') UTC"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
