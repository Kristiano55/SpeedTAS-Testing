<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeedTAS Stats</title>
  <meta name="color-scheme" content="dark">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    :root {
      --accent: #e9fb59;
      --accent-rgb: 233,251,89;
      --on-accent: #0a0a0c;
      --bg: #0a0a0c;
      --bg2: #121216;
      --card: #17171c;
      --card-hover: #1e1e25;
      --border: #26262e;
      --text: #f2f2f0;
      --muted: #8a8a94;
      --gold: #ffd700;
      --silver: #c8c8d0;
      --bronze: #cd7f32;
      --radius: 16px;
      --radius-sm: 10px;
      --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --fs-xs: 12px;
      --fs-sm: 13px;
      --fs-md: 14px;
      --fs-lg: 18px;
      --fs-xl: 24px;
      --fs-2xl: 34px;
      --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    }

    /* Keyboard focus: one consistent ring everywhere (mouse clicks don't show it) */
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .sr-only { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
      #particles { display: none; }
    }

    body.game-tm20 { --accent: #59d6fb; --accent-rgb: 89,214,251; }
    .game-switch { display:inline-flex; gap:4px; padding:3px; border:1px solid var(--border); border-radius:999px; background:var(--card); }
    .game-switch a { display:inline-flex; align-items:center; min-height:28px; padding:0 12px; border-radius:999px; font-size:13px; font-weight:700; color:var(--muted); text-decoration:none; letter-spacing:.3px; }
    .game-switch a:hover { color:var(--text); }
    .game-switch a.active { background:var(--accent); color:var(--on-accent); }
    /* TM2020 is a single running season: hide every Season 1 / Season 2 / Both picker and the TMNF-only pages */
    body.game-tm20 [data-tmnf-only], body.game-tm20 #statusBanner,
    body.game-tm20 .profile-season-tabs,
    body.game-tm20 .filters:has([data-directory-season]), body.game-tm20 .filters:has([data-history-season]),
    body.game-tm20 .season-picker:has([data-record-season]), body.game-tm20 .toolbar-label:has(+ .season-picker [data-record-season]),
    body.game-tm20 .season-picker:has([data-rival-season]), body.game-tm20 .toolbar-label:has(+ .season-picker [data-rival-season]),
    body.game-tm20 .season-picker:has([data-h2h-season]), body.game-tm20 .toolbar-label:has(+ .season-picker [data-h2h-season])
    { display:none !important; }

    .record-card.shared { border-color: rgba(var(--accent-rgb),.38); }
    .record-card.shared:hover { transform:none; }
    .record-shared-badge { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:.3px; color:var(--accent); background:rgba(var(--accent-rgb),.12); border:1px solid rgba(var(--accent-rgb),.3); margin-bottom:11px; }
    .record-holders { display:flex; flex-wrap:wrap; gap:6px; }
    .record-chip { display:inline-flex; align-items:center; gap:7px; padding:3px 11px 3px 3px; border-radius:999px; background:var(--bg2); border:1px solid var(--border); font-size:13px; font-weight:700; color:var(--text); text-decoration:none; }
    .record-chip:hover { border-color:var(--accent); }
    .record-chip.more { padding:5px 11px; color:var(--muted); }
    .ext-link { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--accent); cursor:pointer; padding:3px 10px; border-radius:999px; border:1px solid rgba(var(--accent-rgb),.35); background:rgba(var(--accent-rgb),.08); text-decoration:none; }
    .ext-link:hover { background:rgba(var(--accent-rgb),.2); }
    .history-event { margin:2px 0 8px; min-height:0; }
    .results-table.no-times .time-th, .results-table.no-times .time-cell { display:none; }
    .time-cell { font-variant-numeric:tabular-nums; font-weight:700; }
    .time-cell small { color:var(--muted); font-weight:600; margin-left:6px; }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: .5;
    }

    /* Header: brand | nav | tools on wide screens; nav drops to its own scrollable row below 1100px */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(10, 10, 12, .92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-areas: "brand nav tools";
      align-items: center;
      column-gap: 24px;
    }

    .brand { grid-area: brand; display: flex; align-items: center; gap: 14px; padding: 10px 0; }
    .tools { grid-area: tools; display: flex; align-items: center; gap: 10px; padding: 10px 0; }

    .logo {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 22px;
      line-height: 1;
      letter-spacing: .5px;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(var(--accent-rgb), .4);
    }

    .discord-icon-link {
      color: #7983f5;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .2s;
      flex: 0 0 32px;
      line-height: 0;
      padding: 3px;
    }

    .discord-icon-link svg {
      display: block;
      width: 24px;
      height: 24px;
      aspect-ratio: 1/1;
      flex: none;
    }

    .discord-icon-link:hover {
      color: #a3abff;
    }

    nav {
      grid-area: nav;
      display: flex;
      gap: 2px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    nav::-webkit-scrollbar { display: none; }

    nav a {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 52px;
      padding: 0 13px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--muted);
      transition: color .15s;
    }

    nav a::after {
      content: '';
      position: absolute;
      left: 13px;
      right: 13px;
      bottom: 0;
      height: 3px;
      border-radius: 3px 3px 0 0;
      background: var(--accent);
      transform: scaleX(0);
      transition: transform .2s;
    }

    nav a:hover { color: var(--text); }

    nav a.active { color: var(--text); }

    nav a.active::after { transform: scaleX(1); }

    /* Nine nav links plus search no longer fit one row below ~1500px, so nav gets its own row there */
    @media (max-width: 1500px) {
      header { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "brand tools" "nav nav"; column-gap: 12px; }
      nav { margin: 0 -20px; padding: 0 12px; border-top: 1px solid var(--border); }
    }

    /* Records & rivalry hub */
    .compact-page-heading { margin:0 0 20px; }.compact-page-heading h1 { font-size:30px; line-height:1.1; font-weight:800; margin:0; letter-spacing:-1px; }.compact-page-heading p { color:var(--muted); font-size:var(--fs-md); margin:8px 0 0; max-width:62ch; line-height:1.5; }
    .history-header { display:flex; align-items:end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px; }.history-count{color:var(--muted);font-size:12px;padding:7px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:999px}.history-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.history-card{height:100%;position:relative;overflow:hidden;padding:17px;border:1px solid var(--border);border-radius:16px;background:var(--card);transition:.2s}.history-card:hover{transform:translateY(-3px);border-color:rgba(var(--accent-rgb),.45);box-shadow:0 14px 28px rgba(0,0,0,.25)}.history-card::after{content:'';position:absolute;width:130px;height:130px;border-radius:50%;right:-62px;top:-72px;background:radial-gradient(circle,rgba(var(--accent-rgb),.1),transparent 68%)}.history-card-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.8px}.history-edition{font-size:23px;font-weight:900;color:var(--text);letter-spacing:-.5px;margin:16px 0 14px}.history-winner{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--border);border-radius:12px;background:rgba(10,10,12,.3)}.history-winner-label{color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800;letter-spacing:.7px}.history-winner-name{font-size:13px;font-weight:800;margin-top:2px}.history-stats{display:flex;gap:16px;margin-top:15px;color:var(--muted);font-size:11px}.history-stats b{color:var(--text);font-size:14px;display:block;margin-top:3px}.history-open{position:absolute;right:17px;bottom:16px;color:var(--accent);font-size:12px;font-weight:800}
    .race-header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}.race-heading{display:flex;align-items:center;gap:13px}.race-edition-mark{width:45px;height:45px;border-radius:13px;display:grid;place-items:center;background:rgba(var(--accent-rgb),.12);border:1px solid rgba(var(--accent-rgb),.28);color:var(--accent);font-weight:900;font-size:16px}.race-heading h1{font-size:22px;margin:0;letter-spacing:-.5px}.race-heading p{color:var(--muted);font-size:12px;margin:4px 0 0}.race-podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.race-podium-place{position:relative;overflow:hidden;min-height:132px;padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--card)}.race-podium-place.gold{border-color:rgba(255,215,0,.45);background:linear-gradient(145deg,rgba(255,215,0,.13),var(--card) 68%)}.race-podium-place.silver{border-color:rgba(200,200,208,.3)}.race-podium-place.bronze{border-color:rgba(205,127,50,.32)}.race-place-label{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.75px}.race-podium-player{display:flex;align-items:center;gap:10px;margin-top:15px;font-weight:900}.race-podium-points{color:var(--accent);font-size:12px;font-weight:800;margin-top:10px}.results-panel{padding:12px 20px 8px}.results-panel-head{display:flex;justify-content:space-between;align-items:center;padding:4px 0 12px}.results-panel-head b{font-size:14px}.results-panel-head span{color:var(--muted);font-size:12px}.results-table tr:first-child td{background:rgba(255,215,0,.04)}.results-table td:first-child{font-weight:800}.results-table td:last-child{color:var(--accent);font-weight:800}
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 22px; }
    .toolbar-label { color:var(--muted); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; margin-right:2px; }
    .season-picker { display:flex; gap:6px; padding:4px; background:var(--bg2); border:1px solid var(--border); border-radius:12px; }
    .season-picker button { border:0; background:transparent; color:var(--muted); padding:7px 13px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; }
    .season-picker button.active { color:#10110c; background:var(--accent); }
    .record-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(235px,1fr)); gap:14px; }
    .record-card { position:relative; overflow:hidden; min-height:178px; padding:18px; background:var(--card); border:1px solid var(--border); border-radius:16px; transition:.2s; }
    .record-card:hover { transform:translateY(-3px); border-color:rgba(var(--accent-rgb),.45); box-shadow:0 14px 30px rgba(0,0,0,.25); }
    .record-icon { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:rgba(var(--accent-rgb),.1); font-size:17px; margin-bottom:14px; }
    .record-label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.7px; font-weight:800; }
    .record-value { color:var(--accent); font-size:30px; line-height:1.05; font-weight:900; margin:6px 0 9px; font-variant-numeric:tabular-nums; }
    .record-holder { display:flex; align-items:center; gap:9px; font-weight:800; font-size:14px; }
    .record-holder img,.record-holder .avatar { width:28px!important; height:28px!important; font-size:10px!important; }
    .record-note { color:var(--muted); font-size:12px; margin-top:9px; }
    .rivalry-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:14px; }
    .rivalry-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; transition:.2s; }
    .rivalry-card:hover { border-color:rgba(var(--accent-rgb),.42); transform:translateY(-2px); }
    .rivalry-names { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; font-weight:800; font-size:13px; }
    .rivalry-names .right { text-align:right; }
    .rivalry-score { font-size:21px; font-weight:900; color:var(--accent); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .rivalry-meter { display:flex; height:5px; overflow:hidden; border-radius:99px; background:var(--bg2); margin:14px 0 10px; }
    .rivalry-meter span:first-child { background:linear-gradient(90deg,#59d6fb,var(--accent)); }
    .rivalry-meter span:last-child { background:#a059fb; }
    .rivalry-meta { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; }
    .rivalry-link { display:block; margin-top:13px; color:var(--accent); font-size:12px; font-weight:800; text-align:right; }
    .empty-state { padding:35px; border:1px dashed var(--border); border-radius:16px; color:var(--muted); text-align:center; }
    /* ---- Home: latest result hero, stat strip, timing-board leaderboard ---- */
    .hero-grid { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); gap:14px; margin-bottom:14px; }
    .hero-grid.solo { grid-template-columns:1fr; }
    .result-hero { position:relative; overflow:hidden; padding:26px; background:linear-gradient(135deg,rgba(var(--accent-rgb),.17),rgba(var(--accent-rgb),.04) 48%,var(--card)); border:1px solid rgba(var(--accent-rgb),.5); border-radius:20px; display:flex; flex-direction:column; gap:20px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
    .result-hero::after { content:'🏆'; position:absolute; right:22px; bottom:-26px; font-size:130px; opacity:.08; pointer-events:none; transform:rotate(-8deg); }
    .result-hero > * { position:relative; z-index:1; }
    .result-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; color:var(--muted); font-size:var(--fs-sm); }
    .result-head b { color:var(--accent); font-size:var(--fs-lg); font-weight:800; padding:4px 12px; border-radius:999px; background:rgba(var(--accent-rgb),.12); border:1px solid rgba(var(--accent-rgb),.3); }
    .result-main { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:22px; align-items:center; }
    .result-winner { display:flex; align-items:center; gap:16px; min-width:0; }
    .result-winner .avatar, .result-winner img { box-shadow:0 0 0 3px var(--gold), 0 0 28px rgba(255,215,0,.35); }
    .result-name { font-size:32px; line-height:1.05; font-weight:800; letter-spacing:-1px; overflow-wrap:anywhere; }
    .result-pts { margin-top:6px; color:var(--accent); font-size:var(--fs-sm); font-weight:700; }
    .result-podium { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
    .result-podium li { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; background:rgba(10,10,12,.4); border:1px solid var(--border); font-weight:700; font-size:var(--fs-md); min-width:0; }
    .result-podium li:nth-child(1) { border-color:rgba(200,200,208,.35); }
    .result-podium li:nth-child(2) { border-color:rgba(205,127,50,.4); }
    .result-podium .place { width:30px; color:var(--muted); font-size:var(--fs-sm); font-weight:800; }
    .result-link { align-self:flex-start; color:var(--accent); font-weight:700; font-size:var(--fs-sm); }
    .result-link:hover { text-decoration:underline; }
    /* Countdown keeps its original look: centred, radial glow, big numerals */
    .next-up { padding:22px; background:var(--card); border:1px solid var(--border); border-radius:20px; display:flex; flex-direction:column; justify-content:center; }
    .next-up .countdown-title { text-align:center; margin-bottom:12px; }
    .next-up .countdown .num { text-shadow:0 0 24px rgba(var(--accent-rgb),.35); }
    .recap-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-bottom:14px; }
    .recap-card { position:relative; overflow:hidden; background:linear-gradient(145deg,var(--card),#141419); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; }
    .recap-card::after { content:''; position:absolute; width:130px; height:130px; border-radius:50%; right:-60px; bottom:-70px; background:radial-gradient(circle,rgba(89,214,251,.13),transparent 68%); pointer-events:none; }
    .recap-card > * { position:relative; z-index:1; }
    .recap-kicker { color:var(--muted); font-size:var(--fs-sm); margin-bottom:8px; }
    .recap-title { font-size:var(--fs-lg); font-weight:700; line-height:1.2; }
    .recap-detail { color:var(--muted); font-size:var(--fs-xs); margin-top:6px; line-height:1.45; }
    .recap-move { display:flex; align-items:baseline; gap:8px; }
    .recap-move strong { font-size:28px; color:#59fba0; font-weight:800; letter-spacing:-1px; }
    .recap-move span { font-size:var(--fs-sm); color:var(--muted); }
    .recap-debuts { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .stat-strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:34px; }
    .stat-strip .stat { position:relative; overflow:hidden; padding:18px; min-width:0; background:linear-gradient(145deg,rgba(var(--accent-rgb),.07),var(--card) 60%); border:1px solid var(--border); border-radius:var(--radius); transition:.25s; }
    .stat-strip .stat::after { content:''; position:absolute; width:90px; height:90px; border-radius:50%; right:-40px; top:-46px; background:radial-gradient(circle,rgba(var(--accent-rgb),.14),transparent 68%); pointer-events:none; }
    .stat-strip .stat:hover { transform:translateY(-3px); border-color:rgba(var(--accent-rgb),.35); box-shadow:0 8px 30px rgba(0,0,0,.4); }
    .stat-strip .label { color:var(--muted); font-size:var(--fs-sm); margin-bottom:4px; }
    .stat-strip .value { font-size:28px; line-height:1.1; font-weight:800; color:var(--accent); text-shadow:0 0 22px rgba(var(--accent-rgb),.25); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
    .stat-strip .value.text { font-size:var(--fs-lg); line-height:1.25; color:var(--text); font-weight:700; }
    .stat-strip .sub { color:var(--muted); font-size:var(--fs-xs); margin-top:3px; }
    .lb-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
    .lb-toolbar .filters { margin:0; }
    .lb-toolbar .table-actions { margin:0; }
    .lb-panel { padding:0; overflow:hidden; }
    .lb-scroll { overflow-x:auto; }
    #leaderboardTable { border-collapse:separate; border-spacing:0; }
    #leaderboardTable th { background:var(--bg2); border-bottom:1px solid var(--border); padding:12px; }
    #leaderboardTable td { padding:11px 12px; }
    #leaderboardTable tbody tr:first-child td { border-top:0; }
    #leaderboardTable .rank-cell { font-size:var(--fs-lg); font-weight:800; width:60px; min-width:60px; }
    #leaderboardTable .pts { font-size:var(--fs-lg); font-weight:800; color:var(--accent); }
    #leaderboardTable .player-cell b { font-weight:700; }
    #leaderboardTable .player-cell a, #leaderboardTable td a { display:block; }
    #leaderboardTable tr.p1 td:first-child { box-shadow:inset 3px 0 var(--gold); }
    #leaderboardTable tr.p2 td:first-child { box-shadow:inset 3px 0 var(--silver); }
    #leaderboardTable tr.p3 td:first-child { box-shadow:inset 3px 0 var(--bronze); }
    #leaderboardTable tr.p1 .player-cell b { color:var(--gold); }
    .move-inline { display:none; font-size:var(--fs-xs); margin-left:6px; }
    th[aria-sort="ascending"]::after { content:' \2191'; }
    th[aria-sort="descending"]::after { content:' \2193'; }
    @media (max-width:900px) { .hero-grid { grid-template-columns:1fr; } .result-main { grid-template-columns:1fr; gap:16px; } .result-podium { padding:14px 0 0; border-left:0; border-top:1px solid var(--border); } }
    @media (max-width:640px) {
      .recap-grid { grid-template-columns:1fr; }
      .stat-strip { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      /* Phones: the movement column folds into the player cell; rank + player stay pinned while the numbers scroll */
      #leaderboardTable th[data-key="move"], #leaderboardTable td.col-move { display:none; }
      .move-inline { display:inline; }

    .search-wrap {
      position: relative;
      width: 240px;
      min-width: 0;
    }

    .search-wrap input {
      width: 100%;
      min-height: 40px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      color: var(--text);
      font-size: 14px;
      transition: border-color .15s;
    }

    .search-wrap input::placeholder { color: var(--muted); }

    .search-wrap input:focus {
      border-color: var(--accent);
    }

    .search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      min-width: 240px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      max-height: 300px;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
      z-index: 30;
    }

    .search-results a {
      display: block;
      padding: 12px 14px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }

    .search-results a:last-child {
      border-bottom: none;
    }

    .search-results a:hover,
    .search-results a:focus-visible {
      background: var(--card-hover);
      color: var(--accent);
      outline-offset: -2px;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .cards {
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      margin-bottom: 28px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }

    .card .label {
      font-size: var(--fs-sm);
      color: var(--muted);
      margin-bottom: 6px;
    }

    .card:hover { transform: translateY(-3px); border-color: rgba(var(--accent-rgb), .3); box-shadow: 0 8px 30px rgba(0, 0, 0, .4); }
    .card { transition: .25s; }

    .card .value {
      font-size: 26px;
      line-height: 1.1;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .card .sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pop {
      0% {
        transform: scale(.9);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    h1, h2, h3 { font-family: var(--font-display); }

    h2.section-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 16px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h2.section-title::before {
      content: '';
      width: 4px;
      height: 20px;
      background: var(--accent);
      border-radius: 2px;
      box-shadow: 0 0 14px rgba(var(--accent-rgb), .55);
      display: inline-block;
    }

    /* One quiet entrance for the whole page instead of every card animating on its own */
    main > * { animation: pageIn .25s ease both; }
    @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }

    section {
      margin-bottom: 34px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    table {
      width: 100%;

      font-size: 14px;
    }

    th {

    th[data-key] {

    td {

      grid-template-columns: 1fr 2fr 1fr;

      gap: 10px;
      padding: 13px 8px;
      border-top: 1px solid var(--border);
    }

    .h2h-row:first-child {
      border-top: none;
    }

    .h2h-row .h2h-val {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .h2h-row .h2h-val.side-left {
      text-align: right;
    }

    .h2h-row .h2h-val.side-right {
      text-align: left;
    }

    .h2h-row .h2h-label {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .h2h-pill {
      display: inline-block;
      min-width: 44px;
      padding: 5px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 14px;
      color: #0a0a0c;
    }

    .h2h-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border-top: 1px solid var(--border);
    }

    .h2h-summary-item {
      background: var(--bg2);
      padding: 13px 10px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .h2h-summary-item b {
      display: block;
      color: var(--text);
      font-size: 16px;
      margin-top: 3px;
    }

    .h2h-swap {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 12px;
      cursor: pointer;
      transition: .2s;
    }

    .h2h-swap:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .h2h-matchups {
      border-top: 1px solid var(--border);
      padding: 18px;
    }

    .h2h-matchups-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;

    .h2h-matchups-head b {
      font-size: 13px;
      color: var(--text);
    }

    .h2h-matchups-head span {
      font-size: 12px;
      color: var(--muted);
    }

    .h2h-matchups table {
      font-size: 12px;
    }

    .h2h-matchups th,
    .h2h-matchups td {
      padding: 8px 10px;
    }

    .season-intro {
      background: linear-gradient(120deg, rgba(var(--accent-rgb), .09), rgba(89, 214, 251, .06) 54%, transparent);
      border: 1px solid rgba(var(--accent-rgb), .2);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
    }

    .season-intro p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .compare-table-wrap {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: auto;
      background: var(--bg2);
    }

    .compare-table-wrap table {
      min-width: 760px;
    }

    .compare-table-wrap th {
      position: sticky;
      top: 0;
      background: var(--card);
      z-index: 1;
      transition: color .15s, background .15s;
    }

    .compare-table-wrap th::after {
      content: '↕';
      font-size: 11px;
      margin-left: 6px;
      opacity: .35;
    }

    .compare-table-wrap th.sorted::after {
      content: attr(data-arrow);
      opacity: 1;
      color: var(--accent);
    }

    .compare-table-wrap td {
      font-variant-numeric: tabular-nums;
    }

    .compare-table-wrap .player-name {
      color: var(--text);
    }

    .compare-hint {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 12px;
    }

    .compare-spotlight {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 12px;
      margin: 0 0 18px;
    }

    .compare-spotlight-card {
      background: linear-gradient(135deg, rgba(var(--accent-rgb), .13), rgba(23, 23, 28, .9));
      border: 1px solid rgba(var(--accent-rgb), .23);
      border-radius: 14px;
      padding: 16px;

    .compare-spotlight-card .kicker {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .7px;
      color: var(--muted);
    }

    .compare-spotlight-card b {
      display: block;
      margin-top: 6px;
      font-size: 19px;
      color: var(--text);
    }

    .compare-spotlight-card strong {
      color: var(--accent);

    }

    .compare-spotlight-card.compact b {

      color: var(--accent);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 60px;
      color: var(--muted);
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .refresh-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .refresh-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .export-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .export-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .table-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 10px;
    }

    @media (max-width:640px) {
      /* Three stacked header rows would eat ~160px of every phone screen, so the header scrolls away here */
      header {
        position: static;
        padding: 0 14px;
      }

      nav {
        margin: 0 -14px;
      }

      .tools {
        padding-top: 0;
      }

      header {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "brand" "tools" "nav";
      }

      .search-wrap {
        flex: 1;
        width: auto;
      }

      .countdown .num {

      }

      .h2h-row {
        grid-template-columns: 0.7fr 1.6fr 0.7fr;

      }

      .h2h-avatar-big {
        width: 48px;
        height: 48px;
        font-size: 16px;
      }

      .h2h-header {
        padding: 18px 10px;
        gap: 8px;
      }

      .h2h-summary-item {
        padding: 10px 4px;
        font-size: 11px;
      }

      .h2h-summary-item b {
        font-size: 14px;
      }

      .compare-spotlight {
        grid-template-columns: 1fr;
      }
    }

</head>

    let SEASON_1 = null, season1Promise = null;
    async function loadSeason1Snapshot() {
      const bytes = Uint8Array.from(atob(SEASON_1_SNAPSHOT_GZIP), c => c.charCodeAt(0));
      if (!window.DecompressionStream) throw new Error('Season 1 live data could not be reached, and this browser cannot read its saved snapshot.');
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return parseDelimitedText(await new Response(stream).text());

    function loadSeason1() {
      if (SEASON_1) return Promise.resolve(SEASON_1);
      if (!season1Promise) {
        const proxyUrl = (SPEEDTAS_API_URL || '').replace(/\/+$/, '');

              const payload = await r.json();

              }
              const payload = await r.json();
              return {editions: payload.editions, players: payload.players};
            })
          : Promise.reject(new Error('No SPEEDTAS_API_URL configured.'));
        tm20Promise = viaWorker
          .catch(err => {
            console.warn('TM2020 via Worker failed; trying the published sheet directly.', err);
            return fetch(tm20CsvUrl()).then(r => {if (!r.ok) throw new Error('The TM2020 sheet could not be reached.'); return r.text();}).then(parseTM20Text);
          })
          .then(d => DATA.tm20 = canonicalizeDataset(d))
          .finally(() => {tm20Promise = null;});
      }
      return tm20Promise;
    }

    /* ============ TAS EXCHANGE EVENTS ============ */
    /* The Worker's /events-index finds which tmtas.exchange event is "edition N" by reading event titles.
       EVENT_PATTERN is a regular expression matched against the event title (the title must contain "#N").
       If an edition can't be found automatically, pin it by hand: EVENT_ID_OVERRIDES.tm20 = {"5": 260}. */
    const EVENT_PATTERN = {tmnf: 'SpeedTAS Season2', tm20: 'SpeedTAS TM20'}; // titles look like "SpeedTAS TM20 #4"
    const EVENT_ID_RANGE = {tmnf: [40, 300], tm20: [200, 600]};
    const EVENT_ID_OVERRIDES = {tmnf: {}, tm20: {"1": 229, "2": 240, "3": 251, "4": 258}}; // known events always win; later ones are found automatically
    /* Hosts sometimes upload a competitor's run under their own name. Their entry is then handed to the competitor
       who has no time of their own - unless the sheet shows the host competed (then it's the host's own run). */
    const EVENT_HOSTS = {tmnf: ['Kristiano'], tm20: ['Kristiano']};
    const EVENT_INDEX = {tmnf: null, tm20: null};
    const eventPromises = {};
    const eventUrl = id => 'https://tmtas.exchange/events/' + id;
    function eventFor(game, edition) {
      const pinned = EVENT_ID_OVERRIDES[game] && EVENT_ID_OVERRIDES[game][String(edition)];
      if (pinned) return {id: pinned};
      return (EVENT_INDEX[game] || {})[String(edition).trim()] || null;
    }
    function loadEventIndex(game, onUpdate) {
      const proxyUrl = (SPEEDTAS_API_URL || '').replace(/\/+$/, '');
      if (!proxyUrl) return Promise.resolve({}).then(r => {if (onUpdate) onUpdate(); return r;});
      const cacheKey = 'speedtas_events_' + game;
      if (!eventPromises[game]) {
        let cached = null;
        try {cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');} catch (e) {}
        if (cached && cached.events && Date.now() - cached.t < 3600e3) {
          EVENT_INDEX[game] = cached.events;
          eventPromises[game] = Promise.resolve(cached.events);
        } else {
          eventPromises[game] = (async () => {
            const [from, to] = EVENT_ID_RANGE[game];
            for (let i = 0; i < 12; i++) {
              const r = await fetch(`${proxyUrl}/events-index?pattern=${encodeURIComponent(EVENT_PATTERN[game])}&from=${from}&to=${to}`);
              if (!r.ok) throw new Error('events-index ' + r.status);
              const b = await r.json();
              EVENT_INDEX[game] = b.events || {};
              if (onUpdate) onUpdate();
              if (b.complete) {try {localStorage.setItem(cacheKey, JSON.stringify({t: Date.now(), events: EVENT_INDEX[game]}));} catch (e) {} break;}
            }
            return EVENT_INDEX[game] || {};
          })().catch(err => {console.warn('TAS Exchange event lookup failed', err); delete eventPromises[game]; return EVENT_INDEX[game] || {};});
        }
      }
      return eventPromises[game].then(r => {if (onUpdate) onUpdate(); return r;});
    }
    function fillHistoryEventLinks() {
      document.querySelectorAll('.history-event[data-edition]').forEach(el => {
        const ev = eventFor(GAME, el.dataset.edition);
        if (ev && !el.firstChild) el.innerHTML = `<span class="ext-link" data-ext="${eventUrl(ev.id)}" title="Open this event on TAS Exchange">TAS Exchange ↗</span>`;
      });
    }
    document.addEventListener('click', e => {
      const x = e.target.closest && e.target.closest('[data-ext]');
      if (!x) return;
      e.preventDefault(); e.stopPropagation();
      window.open(x.dataset.ext, '_blank', 'noopener');
    }, true);
    function parseTimeSeconds(t) {
      const m = String(t || '').trim().match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
      return m ? (m[1] ? parseInt(m[1], 10) * 60 : 0) + parseFloat(m[2]) : null;
    }
    function matchEntrantsToPlayers(entrants, names, opts = {}) {
      const byKey = {};
      names.forEach(n => byKey[playerKey(n)] = n);
      const out = {}, leftovers = [];
      entrants.forEach(en => {
        const k = playerKey(en.entrant);
        let name = byKey[k];
        if (!name) {const close = Object.keys(byKey).filter(x => oneLetterApart(x, k)); if (close.length === 1) name = byKey[close[0]];}
        if (name) {if (!out[name]) out[name] = en;} else leftovers.push(en);
      });
      /* A host uploading a run for someone else shows up as the HOST's entry. If the sheet says the host did not
         compete, that entry belongs to a competitor with no time yet: the one whose sheet placement equals the
         entry's position, or the only competitor still without a time. */
      const hostKeys = (opts.hosts || []).map(playerKey);
      if (hostKeys.length && !hostKeys.some(h => byKey[h])) {
        leftovers.filter(en => hostKeys.includes(playerKey(en.entrant))).forEach(en => {
          const free = names.filter(n => !out[n]);
          let pick = opts.placements ? free.filter(n => opts.placements[n] === en.pos) : [];
          if (pick.length !== 1 && free.length === 1) pick = free;
          if (pick.length === 1) out[pick[0]] = {...en, viaHost: stripNote(en.entrant)};
        });
      }
      return out;
    }
    function attachEditionEvent(ed, seasonKey) {
      if (seasonKey === 's1') return;
      const edition = ed.edition, game = GAME;
      const stillHere = () => document.getElementById('eventLink') && document.getElementById('eventLink').dataset.edition === String(edition);
      loadEventIndex(game).then(() => {
        const ev = eventFor(game, edition);
        if (!ev || !stillHere()) return;
        const link = document.getElementById('eventLink');
        link.href = eventUrl(ev.id); link.style.display = '';
        const proxyUrl = (SPEEDTAS_API_URL || '').replace(/\/+$/, '');
        return fetch(`${proxyUrl}/event-results?id=${ev.id}`).then(r => r.ok ? r.json() : null).then(data => {
          if (!data || !data.results || !stillHere()) return;
          const matched = matchEntrantsToPlayers(data.results, Object.keys(ed.results), {placements: ed.results, hosts: EVENT_HOSTS[game]});
          const secs = Object.values(matched).map(en => parseTimeSeconds(en.time)).filter(x => x != null);
          const best = secs.length ? Math.min(...secs) : null;
          let filled = 0;
          document.querySelectorAll('.time-cell[data-player]').forEach(cell => {
            const en = matched[cell.dataset.player];
            if (!en || !en.time) return;
            const t = parseTimeSeconds(en.time), gap = (t != null && best != null && t - best > 0.0001) ? `<small>+${(t - best).toFixed(2)}</small>` : '';
            const via = en.viaHost ? `<small title="Uploaded by ${escapeHtml(en.viaHost)} on this player's behalf" style="cursor:help">ⓘ</small>` : '';
            cell.innerHTML = escapeHtml(en.time) + gap + via; filled++;
          });
          if (filled) document.querySelector('.results-table').classList.remove('no-times');
        });
      }).catch(err => console.warn('Event times unavailable', err));
    }

    /* ============ GAME CONTEXT ============ */
    function applyTheme(g) {
      document.body.classList.toggle('game-tm20', g === 'tm20');
      window.PARTICLE_COLOR = g === 'tm20' ? '#59d6fb' : '#e9fb59';
      document.title = g === 'tm20' ? 'SpeedTAS Stats · TM2020' : 'SpeedTAS Stats';
      document.querySelectorAll('#gameSwitch a').forEach(a => a.classList.toggle('active', a.dataset.game === g));
      document.querySelectorAll('#nav a[data-route]').forEach(a => {
        const r = a.dataset.route;
        a.setAttribute('href', g === 'tm20' ? '#/tm20' + (r === '/' ? '' : r) : '#' + r);
      });
    }
    function setGame(g) {
      if (g !== GAME) {
        if (GAME === 'tmnf') DATA.tmnf = RAW; // RAW always holds the active game's data
        GAME = g;
        RAW = g === 'tm20' ? DATA.tm20 : DATA.tmnf;
      }
      POINTS = g === 'tm20' ? TM20_POINTS : TMNF_POINTS;
      applyTheme(g);
    }
    /* In TM2020 mode every in-app link gets the #/tm20 prefix (also for content that renders later). */
    function prefixLinks(root) {
      if (GAME !== 'tm20') return;
      root.querySelectorAll('a[href^="#/"]').forEach(a => {
        const h = a.getAttribute('href');
        if (h === '#/tm20' || h.startsWith('#/tm20/')) return;
        a.setAttribute('href', '#/tm20' + (h === '#/' ? '' : h.slice(1)));
      });
    }

    /* ============ PARTICLES ============ */
    (function particles() {
      const c = document.getElementById('particles');
      const ctx = c.getContext('2d');
      let w, h, pts = [];
      function resize() {w = c.width = window.innerWidth; h = c.height = window.innerHeight;}
      window.addEventListener('resize', resize); resize();
      const N = Math.min(50, Math.floor(window.innerWidth / 25));
      for (let i = 0; i < N; i++) pts.push({x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * .15, vy: (Math.random() - .5) * .15, r: Math.random() * 1.6 + .4});
      function loop() {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = window.PARTICLE_COLOR || '#e9fb59';
        pts.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = w; if (p.x > w) p.x = 0; if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
          ctx.globalAlpha = 0.35;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        });
        raf = document.hidden ? 0 : requestAnimationFrame(loop);
      }
      let raf = 0;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (!reduceMotion.matches) loop();
      // The loop stops itself while the tab is hidden; restart it (once) when the tab returns
      document.addEventListener('visibilitychange', () => {if (!document.hidden && !raf && !reduceMotion.matches) loop();});
    })();

    /* ============ JSONP LOADER (avoids CORS entirely) ============
       fetch() to Google's gviz endpoint gets blocked by browsers because
       Google doesn't reliably send Access-Control-Allow-Origin headers.
       The Visualization API has a built-in JSONP callback mode
       (tqx=responseHandler:NAME) designed exactly for this: it's loaded
       via a <script> tag, which is never subject to CORS restrictions. */
    let jsonpCounter = 0;
    function fetchViaJSONP(sheetName, timeoutMs = 12000) {
      return new Promise((resolve, reject) => {
        const callbackName = `__gsheetCb_${Date.now()}_${jsonpCounter++}`;
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
          `tqx=responseHandler:${callbackName}&headers=1&sheet=${encodeURIComponent(sheetName)}`;

        let settled = false;
        const script = document.createElement('script');

        function cleanup() {
          delete window[callbackName];
          script.remove();
          clearTimeout(timer);
        }

        window[callbackName] = function (response) {
          if (settled) return;
          settled = true;
          cleanup();
          resolve(response);
        };

        script.onerror = () => {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error('Could not reach Google Sheets (network/script load error).'));
        };

        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error('Timed out waiting for Google Sheets response.'));
        }, timeoutMs);

        script.src = url;
        document.body.appendChild(script);
      });
    }

    function buildDatasetFromGrid(grid) {
      if (!grid || grid.length < 2) throw new Error('The sheet data appears to be empty.');
      const header = grid[0].map(v => String(v == null ? '' : v).trim());
      const playerNames = header.slice(1).filter(n => n.length);

      const editions = [];
      for (let r = 1; r < grid.length; r++) {
        const row = grid[r];
        const editionRaw = row[0];
        if (editionRaw === '' || editionRaw === undefined || editionRaw === null) continue;
        const editionNum = String(editionRaw).trim();
        if (!editionNum) continue;
        const results = {};
        for (let c = 1; c < header.length; c++) {
          const name = header[c];
          if (!name) continue;
          const val = row[c];
          if (val === '' || val === undefined || val === null) continue;
          const place = typeof val === 'number' ? val : parseInt(String(val).trim(), 10);
          if (!isNaN(place)) results[name] = place;
        }
        if (Object.keys(results).length === 0) continue;
        editions.push({edition: editionNum, results});
      }
      return {editions, players: playerNames};
    }

    function parseGvizResponse(response) {
      if (!response || !response.table) throw new Error('Unexpected response format from Google Sheets.');
      if (response.status === 'error') {
        const msg = (response.errors && response.errors[0] && (response.errors[0].detailed_message || response.errors[0].message)) || 'Unknown error from Google Sheets.';
        throw new Error(msg);
      }
      const table = response.table;
      const rawRows = (table.rows || []).map(r => (r.c || []).map(cell => (cell && cell.v !== undefined && cell.v !== null) ? cell.v : ''));

      // Google's API sometimes auto-detects the first row as a header and pulls
      // it OUT of table.rows into table.cols[].label — even when we ask it not
      // to. If it did that, table.rows starts at the real data (edition 1), and
      // we must reconstruct the header from cols[].label instead of rows[0],
      // or every row shifts by one (edition 1 gets read as headers, and its
      // placements get misread as player names).
      const colLabels = (table.cols || []).map(c => (c && c.label != null && c.label !== '') ? String(c.label) : '');
      const headerWasExtracted = colLabels.some(l => l.length > 0);

      let grid;
      if (headerWasExtracted) {
        grid = [colLabels, ...rawRows];
      } else {
        grid = rawRows; // no auto-detection happened; first row of rawRows IS the header
      }

      if (grid.length < 2) throw new Error('The "Editions" sheet appears to be empty.');
      return buildDatasetFromGrid(grid);
    }

    /* Parses manually pasted or uploaded delimited text (CSV or TSV — Google
       Sheets copy/paste produces tab-separated values, downloaded files are
       usually comma-separated, so we auto-detect). Used as a fallback when
       the live connection to Google Sheets can't be established. */
    function parseDelimitedText(text) {
      const firstLine = text.split(/\r?\n/)[0] || '';
      const commaCount = (firstLine.match(/,/g) || []).length;
      const tabCount = (firstLine.match(/\t/g) || []).length;
      const delimiter = tabCount > commaCount ? '\t' : ',';
      const lines = text.split(/\r?\n/).filter(l => l.trim().length);
      const grid = lines.map(line => {
        if (delimiter === ',') {
          // simple CSV parse with quote support
          const cells = []; let field = '', inQuotes = false;
          for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (inQuotes) {
              if (c === '"') {if (line[i + 1] === '"') {field += '"'; i++;} else inQuotes = false;}
              else field += c;
            } else {
              if (c === '"') inQuotes = true;
              else if (c === ',') {cells.push(field); field = '';}
              else field += c;
            }
          }
          cells.push(field);
          return cells;
        }
        return line.split('\t');
      });
      return buildDatasetFromGrid(grid);
    }

    async function loadData() {
      const proxyUrl = (SPEEDTAS_API_URL || '').replace(/\/+$/, '');
      if (proxyUrl) {
        try {
          const res = await fetch(proxyUrl + '/data?season=s2');
          if (!res.ok) {
            let msg = `Worker responded with ${res.status}`;
            try {const errBody = await res.json(); if (errBody && errBody.error) msg = errBody.error;} catch (e) {}
            throw new Error(msg);
          }
          const payload = await res.json();
          return {editions: payload.editions, players: payload.players};
        } catch (err) {
          console.warn('Season 2 via Worker failed; trying direct Google Sheets connection.', err);
        }
      }
      const response = await fetchViaJSONP(SHEET_NAME);
      return parseGvizResponse(response);
    }

    /* Retries a flaky async call a few times with a short, growing pause
       between attempts, instead of giving up after one failure. This is
       what a manual page refresh was effectively doing by hand. */
    async function retryAsync(fn, attempts = 3, delayMs = 1200) {
      let lastErr;
      for (let i = 0; i < attempts; i++) {
        try { return await fn(); }
        catch (err) { lastErr = err; if (i < attempts - 1) await new Promise(r => setTimeout(r, delayMs * (i + 1))); }
      }
      throw lastErr;
    }

    /* Cloudflare Workers on the free plan cap each invocation at 50 outgoing
       fetch() calls, so one Discord lookup per ID means the roster can't be
       sent in a single request forever. Splitting into batches keeps each
       request to the Worker safely under that limit, however large the
       roster grows — it just becomes a few more sequential requests. */
    const AVATAR_STORE_KEY = 'speedtas_discord_avatars_v1';
    let AVATAR_RETRY_IDS = [];
    function readAvatarStore() {
      try {const v = JSON.parse(localStorage.getItem(AVATAR_STORE_KEY) || 'null'); if (v && v.avatars) return v;} catch (e) {}
      return {ids: {}, avatars: {}};
    }
    function saveAvatarStore() {
      try {localStorage.setItem(AVATAR_STORE_KEY, JSON.stringify({t: Date.now(), ids: DISCORD_IDS, avatars: DISCORD_AVATARS}));} catch (e) {}
    }
    /* Pictures from the last visit appear instantly and stay if Discord/the Worker is having a bad moment. */
    function prefillAvatarsFromStore() {
      const v = readAvatarStore();
      DISCORD_IDS = {...v.ids}; DISCORD_AVATARS = {...v.avatars};
    }
    async function fetchAvatarsInBatches(proxyUrl, ids, batchSize = 20) {
      const avatars = {}, transient = new Set(), queue = [...ids];
      let calls = 0;
      while (queue.length && calls < 60) {
        const batch = queue.splice(0, batchSize); calls++;
        try {
          const data = await retryAsync(async () => {
            const res = await fetch(proxyUrl + '/avatars?ids=' + encodeURIComponent(batch.join(',')));
            if (!res.ok) throw new Error('Worker responded with ' + res.status);
            return res.json();
          });
          Object.assign(avatars, data.avatars || {});
          (data.pending || []).forEach(id => queue.push(id));            // Worker ran out of its per-request budget: ask again
          Object.keys(data.failed || {}).forEach(id => transient.add(id)); // Discord had a temporary problem: retry later
        } catch (err) {
          batch.forEach(id => transient.add(id));
          console.warn('Avatar batch failed after retries, will try again later:', err);
        }
      }
      AVATAR_RETRY_IDS = [...transient].filter(id => !avatars[id]);
      return avatars;
    }
    function scheduleAvatarRetry(proxyUrl) {
      [4000, 12000, 30000].forEach(delay => setTimeout(async () => {
        if (!AVATAR_RETRY_IDS.length) return;
        const got = await fetchAvatarsInBatches(proxyUrl, [...AVATAR_RETRY_IDS]);
        if (Object.keys(got).length) {
          Object.assign(DISCORD_AVATARS, got); saveAvatarStore();
          if (!/versus/.test(location.hash)) render(); // don't wipe a half-made head-to-head selection
        }
      }, delay));
    }

    async function loadDiscordProfiles() {
      try {
        const proxyUrl = (SPEEDTAS_API_URL || getAvatarProxyUrl() || '').replace(/\/+$/, '');
        DISCORD_IDS = {...DISCORD_IDS}; let freshRoster = 0; // keep last visit's IDs until the new roster arrives
        // The Worker fetches the Players tab so public browsers never have
        // to execute a Google JSONP script to build the avatar roster.
        let rosterLoaded = false;
        if (proxyUrl) {
          try {
            const response = await retryAsync(async () => {
              const res = await fetch(proxyUrl + '/players');
              if (!res.ok) throw new Error('Worker responded with ' + res.status);
              return res.json();
            });
            Object.entries(response.players || {}).forEach(([name, id]) => {
              if (/^\d{15,25}$/.test(String(id))) {DISCORD_IDS[playerKey(name)] = String(id); freshRoster++;}
            });
            rosterLoaded = freshRoster > 0;
          } catch (err) {console.warn('Worker Players endpoint unavailable; falling back to Google Sheets.', err);}
        }
        if (!rosterLoaded) {
          // Compatibility fallback while the Worker update is being deployed.
          const response = await retryAsync(() => fetchViaJSONP(PLAYER_SHEET_NAME));
          const table = response?.table;
          const labels = (table?.cols || []).map(c => String(c?.label || '').trim().toLowerCase());
          const nameCol = labels.findIndex(x => ['players', 'player', 'player name', 'name'].includes(x));
          const idCol = labels.findIndex(x => ['id', 'discord id', 'discordid', 'discord'].includes(x));
          if (nameCol < 0 || idCol < 0) throw new Error('Players tab needs Player and Discord ID headers.');
          (table.rows || []).forEach(row => {const cells = row.c || []; const name = String(cells[nameCol]?.v ?? '').trim(); const id = String(cells[idCol]?.f ?? cells[idCol]?.v ?? '').replace(/\s/g, ''); if (name && /^\d{15,25}$/.test(id)) DISCORD_IDS[playerKey(name)] = id;});
        }
        if (proxyUrl && Object.keys(DISCORD_IDS).length) {
          const ids = [...new Set(Object.values(DISCORD_IDS))];
          const fresh = await fetchAvatarsInBatches(proxyUrl, ids);
          DISCORD_AVATARS = {...DISCORD_AVATARS, ...fresh}; // new answers win, older known-good pictures are kept
          saveAvatarStore();
          scheduleAvatarRetry(proxyUrl);
        }
      } catch (err) {console.warn('Discord player directory unavailable:', err);}
    }

    /* ============ COMPUTE STATS ============ */
    function computeAll(data) {
      const players = {}; // name -> stats object
      data.players.forEach(name => {
        players[name] = {
          name, points: 0, wins: 0, podiums: 0, played: 0, placements: [],
          cumulative: [], history: [] // {edition, placement, points}
        };
      });

      data.editions.forEach(ed => {
        Object.entries(ed.results).forEach(([name, place]) => {
          if (!players[name]) players[name] = {name, points: 0, wins: 0, podiums: 0, played: 0, placements: [], cumulative: [], history: []};
          const pts = pointsFor(place);
          const p = players[name];
          p.points += pts;
          p.played += 1;
          if (place === 1) p.wins += 1;
          if (place <= 3) p.podiums += 1;
          p.placements.push(place);
          p.history.push({edition: ed.edition, placement: place, points: pts});
        });
      });

      // cumulative points per player aligned to edition order
      const editionOrder = data.editions.map(e => e.edition);
      Object.values(players).forEach(p => {
        let running = 0;
        const map = {};
        p.history.forEach(h => {running += h.points; map[h.edition] = running;});
        let last = 0;
        p.cumulative = editionOrder.map(e => {if (map[e] !== undefined) last = map[e]; return last;});
      });

      // derived stats
      Object.values(players).forEach(p => {
        p.avgPlacement = p.placements.length ? (p.placements.reduce((a, b) => a + b, 0) / p.placements.length) : null;
        p.best = p.placements.length ? Math.min(...p.placements) : null;
        p.worst = p.placements.length ? Math.max(...p.placements) : null;
        p.top10 = p.placements.filter(x => x <= 10).length;
        p.winRate = p.played ? p.wins / p.played : 0;
        p.podiumRate = p.played ? p.podiums / p.played : 0;
        p.avgPoints = p.played ? p.points / p.played : 0;
      });

      // Streaks — computed over the FULL edition order (not just the player's
      // played editions), because a missed edition must break a streak even
      // though it's not the same as a bad placement. E.g. win, skip, win, win
      // is a streak of 2, not 3 — a gap in participation resets the counter.
      Object.values(players).forEach(p => {p.maxWinStreak = 0; p.maxPodiumStreak = 0; p.maxTop10Streak = 0;});
      {
        const curWin = {}, curPodium = {}, curTop10 = {};
        data.editions.forEach(ed => {
          Object.values(players).forEach(p => {
            const place = ed.results[p.name];
            if (place === undefined) {
              curWin[p.name] = 0;
              curPodium[p.name] = 0;
              curTop10[p.name] = 0;
            } else {
              curWin[p.name] = (place === 1) ? (curWin[p.name] || 0) + 1 : 0;
              curPodium[p.name] = (place <= 3) ? (curPodium[p.name] || 0) + 1 : 0;
              curTop10[p.name] = (place <= 10) ? (curTop10[p.name] || 0) + 1 : 0;
              if (curTop10[p.name] > p.maxTop10Streak) p.maxTop10Streak = curTop10[p.name];
              if (curWin[p.name] > p.maxWinStreak) p.maxWinStreak = curWin[p.name];
              if (curPodium[p.name] > p.maxPodiumStreak) p.maxPodiumStreak = curPodium[p.name];
            }
          });
        });
      }

      // ranking + movement (rank now vs rank excluding last edition)
      const ranked = Object.values(players).filter(p => p.played > 0).sort((a, b) => b.points - a.points);
      ranked.forEach((p, i) => p.rank = i + 1);

      const editionsMinusLast = data.editions.slice(0, -1);
      const prevPoints = {};
      editionsMinusLast.forEach(ed => Object.entries(ed.results).forEach(([name, place]) => {
        prevPoints[name] = (prevPoints[name] || 0) + pointsFor(place);
      }));
      const prevRanked = Object.entries(prevPoints).sort((a, b) => b[1] - a[1]).map(x => x[0]);
      const prevRankMap = {}; prevRanked.forEach((name, i) => prevRankMap[name] = i + 1);
      ranked.forEach(p => {
        const prevRank = prevRankMap[p.name];
        if (prevRank === undefined) p.movement = 0;
        else p.movement = prevRank - p.rank;
      });

      // most improved: compare avg points per edition first half vs second half
      Object.values(players).forEach(p => {
        const h = p.history;
        if (h.length >= 4) {
          const mid = Math.floor(h.length / 2);
          const firstAvg = h.slice(0, mid).reduce((a, b) => a + b.points, 0) / mid;
          const secondAvg = h.slice(mid).reduce((a, b) => a + b.points, 0) / (h.length - mid);
          p.improvement = secondAvg - firstAvg;
        } else p.improvement = null;
      });

      // achievements
      Object.values(players).forEach(p => {
        const badges = [];
        if (p.wins >= 1) badges.push({icon: '🏆', label: 'Champion'});
        if (p.wins >= 3) badges.push({icon: '🥇', label: 'Multi Winner'});
        if (p.maxPodiumStreak >= 5) badges.push({icon: '🔥', label: '5 Podium Streak'});
        if (p.rank && p.rank <= 3) badges.push({icon: '⭐', label: 'Top 3 Leaderboard'});
        if (p.played >= 10) badges.push({icon: '🎯', label: '10 Editions Played'});
        if (p.points >= 100) badges.push({icon: '💯', label: '100 Points'});
        if (GAME === 'tm20' && p.top10 >= 10) badges.push({icon: '🔟', label: '10 Top-10 Finishes'});
        p.badges = badges;
      });

      return {players, editionOrder, ranked};
    }

    /* ============ CUSTOM PROFILE PICTURES ============
       Stored in the browser's localStorage (this file runs standalone, not
       inside Claude's artifact sandbox, so localStorage works normally here).
       Photos are resized client-side before saving so they stay small. */
    const AVATAR_KEY_PREFIX = 'speedtas_v1_avatar_';

    /* avatarHTML() calls getAvatarOverride() once per player row - 50+ times
       on a single Players directory render. Reading localStorage that many
       times on every render adds up, so overrides are read into memory once
       at init and kept in sync from there instead of re-reading storage on
       every single card. */
    let AVATAR_OVERRIDES_CACHE = {};
    function loadAvatarOverridesCache() {
      const cache = {};
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith(AVATAR_KEY_PREFIX) && key !== AVATAR_PROXY_KEY) {
            cache[decodeURIComponent(key.slice(AVATAR_KEY_PREFIX.length))] = localStorage.getItem(key);
          }
        }
      } catch (e) { /* localStorage unavailable - cache stays empty, falls through to Discord avatars */ }
      AVATAR_OVERRIDES_CACHE = cache;
    }

    function getAvatarOverride(name) {
      if (Object.prototype.hasOwnProperty.call(AVATAR_OVERRIDES_CACHE, name)) return AVATAR_OVERRIDES_CACHE[name];
      const id = discordIdFor(name);
      return id ? (DISCORD_AVATARS[id] || null) : null;
    }
    function saveAvatarOverride(name, dataUrl) {
      try {localStorage.setItem(AVATAR_KEY_PREFIX + encodeURIComponent(name), dataUrl); AVATAR_OVERRIDES_CACHE[name] = dataUrl; return true;}
      catch (e) {
        console.error('Could not save avatar:', e);
        alert("Couldn't save that photo — your browser's local storage may be full or restricted.");
        return false;
      }
    }
    function deleteAvatarOverride(name) {
      try {localStorage.removeItem(AVATAR_KEY_PREFIX + encodeURIComponent(name));} catch (e) { }
      delete AVATAR_OVERRIDES_CACHE[name];
    }

    /* Optional: URL of a self-hosted Discord-ID-to-avatar lookup proxy (see
       discord-avatar-worker.js). Entirely optional — only needed if the person
       sets up the free automatic-lookup Worker. */
    const AVATAR_PROXY_KEY = 'speedtas_v1_avatar_proxy_url';
    function getAvatarProxyUrl() {
      try {return localStorage.getItem(AVATAR_PROXY_KEY);} catch (e) {return null;}
    }
    function saveAvatarProxyUrl(url) {
      try {localStorage.setItem(AVATAR_PROXY_KEY, url); return true;} catch (e) {return false;}
    }

    /* Downscales an uploaded image client-side (max dimension in px) and
       returns a compressed JPEG data URL via callback, keeping storage lean. */
    function resizeImageToDataURL(file, maxDim, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > h) {if (w > maxDim) {h = Math.round(h * maxDim / w); w = maxDim;} }
          else {if (h > maxDim) {w = Math.round(w * maxDim / h); h = maxDim;} }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = () => alert("That file couldn't be read as an image.");
        img.src = e.target.result;
      };
      reader.onerror = () => alert("Couldn't read that file.");
      reader.readAsDataURL(file);
    }

    function promptAvatarUpload(name) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.style.display = 'none';
      document.body.appendChild(input);
      const cleanup = () => {if (input.parentNode) input.remove();};
      input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (file) resizeImageToDataURL(file, 300, (dataUrl) => {if (saveAvatarOverride(name, dataUrl)) render(); cleanup();});
        else cleanup();
      });
      input.addEventListener('cancel', cleanup);
      input.click();
    }
    function removeAvatarClicked(name) {
      deleteAvatarOverride(name);
      render();
    }

    /* ============ AVATAR MODAL (upload OR paste an image URL) ============
       Discord has no public, no-login API to fetch a user's avatar from just
       their numeric ID — that needs a bot token, which we won't hardcode into
       a shareable static file (anyone could view-source and steal it). The
       practical equivalent: in Discord, right-click a person's avatar → "Copy
       Avatar Link" → paste it here. Same result, no credentials involved. */
    function closeAvatarModal() {
      const el = document.getElementById('avatarModalBackdrop');
      if (el) el.remove();
    }
    function openAvatarModal(name) {
      closeAvatarModal();
      const backdrop = document.createElement('div');
      backdrop.id = 'avatarModalBackdrop';
      backdrop.className = 'avatar-modal-backdrop';
      const proxyUrl = getAvatarProxyUrl();
      backdrop.innerHTML = `
    <div class="avatar-modal" role="dialog" aria-label="Change photo for ${name}">
      <div class="avatar-modal-head">
        <b>Change photo — ${name}</b>
        <button type="button" class="avatar-modal-close" id="avatarModalClose" aria-label="Close">✕</button>
      </div>
      <button type="button" class="refresh-btn" id="avatarModalUploadBtn" style="width:100%;justify-content:center;margin-bottom:14px;">📁 Upload from device</button>
      <div style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px;">or</div>
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px;">Paste an image URL</label>
      <input type="text" id="avatarUrlInput" placeholder="https://cdn.discordapp.com/avatars/..." style="width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 12px;font-size:13px;outline:none;box-sizing:border-box;margin-bottom:8px;">
      <button type="button" class="refresh-btn" id="avatarUrlBtn" style="width:100%;justify-content:center;">Use This URL</button>

      <div style="text-align:center;color:var(--muted);font-size:12px;margin:14px 0;">or</div>
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px;">Enter Discord ID (auto-fetch)</label>
      <div style="display:flex;gap:6px;">
        <input type="text" id="avatarIdInput" placeholder="e.g. 123456789012345678" style="flex:1;min-width:0;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 12px;font-size:13px;outline:none;box-sizing:border-box;">
        <button type="button" class="refresh-btn" id="avatarIdBtn">Fetch</button>
      </div>
      <button type="button" class="avatar-remove-link" id="avatarProxySettingsBtn" style="margin-top:8px;">⚙️ ${proxyUrl ? 'Change lookup server' : 'Set up automatic lookup (one-time, free)'}</button>

      <div id="avatarModalError" style="color:#e2585b;font-size:12px;margin-top:8px;"></div>
      <div style="font-size:11px;color:var(--muted);margin-top:14px;line-height:1.6;">
        💡 <b>Have a shared server/DM with them?</b> In Discord, right-click their profile picture → <b>"Copy Avatar Link"</b> — paste it above.<br>
        🔗 <b>Only have their Discord ID?</b> Use <a href="https://www.vibebot.gg/tools/avatar-downloader" target="_blank" rel="noopener" style="color:var(--accent);">VibeBot's Avatar Downloader ↗</a>, or set up automatic lookup above.
      </div>
    </div>
  `;
      document.body.appendChild(backdrop);

      backdrop.addEventListener('click', (e) => {if (e.target === backdrop) closeAvatarModal();});
      document.getElementById('avatarModalClose').addEventListener('click', closeAvatarModal);
      document.getElementById('avatarModalUploadBtn').addEventListener('click', () => {closeAvatarModal(); promptAvatarUpload(name);});

      document.getElementById('avatarProxySettingsBtn').addEventListener('click', () => {
        const current = getAvatarProxyUrl() || '';
        const next = window.prompt(
          "Paste your Cloudflare Worker URL (see discord-avatar-worker.js for setup steps):",
          current
        );
        if (next !== null && next.trim()) {
          saveAvatarProxyUrl(next.trim().replace(/\/+$/, ''));
          openAvatarModal(name); // reopen to refresh the button label and re-bind handlers
        }
      });

      async function tryFetchById() {
        const errEl = document.getElementById('avatarModalError');
        const proxy = getAvatarProxyUrl();
        const id = document.getElementById('avatarIdInput').value.trim();
        if (!proxy) {errEl.textContent = 'Set up automatic lookup first (⚙️ above) — it takes about 5 minutes, one time only.'; return;}
        if (!/^\d{15,25}$/.test(id)) {errEl.textContent = "That doesn't look like a valid Discord ID (should be a 15–25 digit number)."; return;}
        errEl.textContent = 'Looking up…';
        try {
          const res = await fetch(proxy + '/avatar?id=' + encodeURIComponent(id));
          const data = await res.json();
          if (!res.ok || data.error) {errEl.textContent = data.error || 'Lookup failed.'; return;}
          if (saveAvatarOverride(name, data.avatarUrl)) {closeAvatarModal(); render();}
        } catch (e) {
          errEl.textContent = "Couldn't reach your lookup server. Double-check the URL in settings (⚙️ above).";
        }
      }
      document.getElementById('avatarIdBtn').addEventListener('click', tryFetchById);
      document.getElementById('avatarIdInput').addEventListener('keydown', (e) => {if (e.key === 'Enter') tryFetchById();});

      function tryUseUrl() {
        const errEl = document.getElementById('avatarModalError');
        const url = document.getElementById('avatarUrlInput').value.trim();
        if (!url) {errEl.textContent = 'Paste a URL first.'; return;}
        if (!/^https?:\/\//i.test(url)) {errEl.textContent = 'That doesn\'t look like a valid URL (should start with http:// or https://).'; return;}
        errEl.textContent = 'Checking image…';
        const testImg = new Image();
        testImg.onload = () => {if (saveAvatarOverride(name, url)) {closeAvatarModal(); render();} };
        testImg.onerror = () => {errEl.textContent = "Couldn't load an image from that URL. Double-check it's a direct image link.";};
        testImg.src = url;
      }
      document.getElementById('avatarUrlBtn').addEventListener('click', tryUseUrl);
      document.getElementById('avatarUrlInput').addEventListener('keydown', (e) => {if (e.key === 'Enter') tryUseUrl();});
      document.getElementById('avatarUrlInput').focus();
    }

    /* Delegated so it works for dynamically-rendered avatars anywhere on the page,
       and stops the click from also triggering a wrapping link (e.g. a player card). */
    document.addEventListener('click', (e) => {
      const editBtn = e.target.closest('.avatar-edit-btn');
      if (editBtn) {e.preventDefault(); e.stopPropagation(); openAvatarModal(decodeURIComponent(editBtn.dataset.player)); return;}
      const removeBtn = e.target.closest('.avatar-remove-btn');
      if (removeBtn) {e.preventDefault(); e.stopPropagation(); removeAvatarClicked(decodeURIComponent(removeBtn.dataset.player)); return;}
    });

    /* ============ COLOR HELPERS ============ */
    const PALETTE = ['#e9fb59', '#59d6fb', '#fb59c9', '#59fba0', '#fba059', '#a059fb', '#fb5959', '#59fbf0'];
    function colorForName(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return PALETTE[Math.abs(hash) % PALETTE.length];
    }
    function initials(name) {
      return name.split(/\s+/).map(s => s[0]).join('').slice(0, 2).toUpperCase();
    }
    function avatarHTML(name, size) {
      const s = size || 32;
      const photo = getAvatarOverride(name);
      if (photo) {
        return `<img src="${escapeHtml(photo)}" alt="${escapeHtml(name)}" loading="lazy" onerror="handleAvatarError(this,'${encodeURIComponent(name).replace(/'/g, '%27')}')" style="width:${s}px;height:${s}px;border-radius:50%;object-fit:cover;flex-shrink:0;display:inline-block;vertical-align:middle;">`;
      }
      const c = colorForName(name);
      return `<div class="avatar" style="background:${c};${size ? `width:${size}px;height:${size}px;font-size:${size * 0.35}px;` : ''}" role="img" aria-label="${escapeHtml(name)}">${escapeHtml(initials(name))}</div>`;
    }
    /* If a Discord CDN image 404s or is unreachable, swap it for the same
       colored-initials avatar avatarHTML() would have used anyway. */
    function handleAvatarError(img, encodedName) {
      const name = decodeURIComponent(encodedName);
      const s = img.clientWidth || img.offsetWidth || 32;
      const div = document.createElement('div');
      div.className = 'avatar';
      div.style.cssText = `background:${colorForName(name)};width:${s}px;height:${s}px;font-size:${Math.round(s * 0.35)}px;`;
      div.textContent = initials(name);
      img.replaceWith(div);
    }
    /* Same as avatarHTML but wraps it with a small always-visible edit button
       that opens the file picker — this is the "easy to change" entry point. */
    function avatarEditableHTML(name, size, btnSize) {
      const bs = btnSize || Math.max(16, Math.round((size || 32) * 0.34));
      return `<div class="avatar-wrap" style="width:${size || 32}px;height:${size || 32}px;">
    ${avatarHTML(name, size)}
    <button type="button" class="avatar-edit-btn" data-player="${encodeURIComponent(name)}" title="Change photo for ${escapeHtml(name)}" aria-label="Change photo for ${escapeHtml(name)}" style="width:${bs}px;height:${bs}px;font-size:${Math.round(bs * 0.55)}px;">📷</button>
  </div>`;
    }
    function medalFor(rank) {
      if (rank >= 1 && rank <= 3) return `<span class="medal m${rank}" role="img" aria-label="${['Gold', 'Silver', 'Bronze'][rank - 1]}"></span>`;
      return '';
    }
    function moveIcon(m) {
      if (m > 0) return `<span class="move-up">▲ ${m}</span>`;
      if (m < 0) return `<span class="move-down">▼ ${Math.abs(m)}</span>`;
      return `<span class="move-same">–</span>`;
    }

    /* ============ ROUTER ============ */
    function currentRoute() {
      const hash = location.hash.replace(/^#/, '') || '/';
      const parts = hash.split('/').filter(Boolean).map(part => {
        try { return decodeURIComponent(part); } catch (e) { return part; }
      });
      ROUTE_GAME = 'tmnf';
      if (parts[0] === 'tm20') {ROUTE_GAME = 'tm20'; parts.shift();}
      return parts;
    }
    window.addEventListener('hashchange', render);
    /* A page change starts at the top (hash links to non-anchors otherwise keep the old scroll position) */
    window.addEventListener('hashchange', () => window.scrollTo(0, 0));

    /* ============ RENDER: HOME ============ */
    function renderHome() {
      const {players, editionOrder, ranked} = computeAll(RAW);
      const totalEditions = RAW.editions.length;
      const totalPlayers = ranked.length;
      const totalPodiums = ranked.reduce((a, p) => a + p.podiums, 0);
      const avgParticipants = totalEditions ? (RAW.editions.reduce((a, e) => a + Object.keys(e.results).length, 0) / totalEditions).toFixed(1) : 0;
      const leader = ranked[0];
      let closestGap = null, closestPair = null;
      for (let i = 0; i < ranked.length - 1; i++) {
        const gap = ranked[i].points - ranked[i + 1].points;
        if (closestGap === null || gap < closestGap) {closestGap = gap; closestPair = [ranked[i], ranked[i + 1]];}
      }
      const latestEdition = RAW.editions[RAW.editions.length - 1];
      const latestEntries = latestEdition ? Object.entries(latestEdition.results).sort((a, b) => a[1] - b[1]) : [];
      const latestWinner = latestEntries.find(([, place]) => place === 1)?.[0] || '—';
      const latestPodium = latestEntries.filter(([, place]) => place <= 3);
      const beforeLatest = new Set(RAW.editions.slice(0, -1).flatMap(ed => Object.keys(ed.results)));
      const debutants = latestEntries.filter(([name]) => !beforeLatest.has(name)).map(([name]) => name);
      const climber = [...ranked].filter(p => p.movement > 0).sort((a, b) => b.movement - a.movement)[0];

      const filteredEditions = leaderboardFilter === 'all' ? RAW.editions :
        RAW.editions.slice(-parseInt(leaderboardFilter));
      const filteredData = {editions: filteredEditions, players: RAW.players};
      const filteredComputed = leaderboardFilter === 'all' ? {players, ranked} : computeAll(filteredData);
      const board = leaderboardFilter === 'all' ? ranked : filteredComputed.ranked;

      const sorted = sortBoard(board, sortState);

      const E = escapeHtml;
      const restPodium = latestPodium.filter(([, place]) => place > 1);
      main.innerHTML = `
    <section class="home-top">
      <div class="compact-page-heading"><h1>${S2L()} leaderboard</h1><p>Live standings, the latest race result, and the matchups everyone is watching.</p></div>

        <article class="result-hero" aria-label="Latest edition result">
