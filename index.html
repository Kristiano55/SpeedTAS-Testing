    /* Retries a flaky async call a few times with a short, growing pause
       between attempts, instead of giving up after one failure. This is
       what a manual page refresh was effectively doing by hand. */
    async function retryAsync(fn, attempts = 3, delayMs = 1200) {
      let lastErr;
      for (let i = 0; i < attempts; i++) {
        try { return await fn(); }
        catch (err) { lastErr = err; if (i < attempts - 1) await new Promise(r => setTimeout(r, delayMs * (i + 1))); }
      }
      throw lastErr;
    }

    /* Cloudflare Workers on the free plan cap each invocation at 50 outgoing
       fetch() calls, so one Discord lookup per ID means the roster can't be
       sent in a single request forever. Splitting into batches keeps each
       request to the Worker safely under that limit, however large the
       roster grows — it just becomes a few more sequential requests. */
    const AVATAR_STORE_KEY = 'speedtas_discord_avatars_v1';
    let AVATAR_RETRY_IDS = [];
    function readAvatarStore() {
      try {const v = JSON.parse(localStorage.getItem(AVATAR_STORE_KEY) || 'null'); if (v && v.avatars) return v;} catch (e) {}
      return {ids: {}, avatars: {}};
    }
    function saveAvatarStore() {
      try {localStorage.setItem(AVATAR_STORE_KEY, JSON.stringify({t: Date.now(), ids: DISCORD_IDS, avatars: DISCORD_AVATARS}));} catch (e) {}
    }
    /* Pictures from the last visit appear instantly and stay if Discord/the Worker is having a bad moment. */
    function prefillAvatarsFromStore() {
      const v = readAvatarStore();
      DISCORD_IDS = {...v.ids}; DISCORD_AVATARS = {...v.avatars};
    }
    async function fetchAvatarsInBatches(proxyUrl, ids, batchSize = 20) {
      const avatars = {}, transient = new Set(), queue = [...ids];
      let calls = 0;
      while (queue.length && calls < 60) {
        const batch = queue.splice(0, batchSize); calls++;
        try {
          const data = await retryAsync(async () => {
            const res = await fetch(proxyUrl + '/avatars?ids=' + encodeURIComponent(batch.join(',')));
            if (!res.ok) throw new Error('Worker responded with ' + res.status);
            return res.json();
          });
          Object.assign(avatars, data.avatars || {});
          (data.pending || []).forEach(id => queue.push(id));            // Worker ran out of its per-request budget: ask again
          Object.keys(data.failed || {}).forEach(id => transient.add(id)); // Discord had a temporary problem: retry later
        } catch (err) {
          batch.forEach(id => transient.add(id));
          console.warn('Avatar batch failed after retries, will try again later:', err);
        }
      }
      AVATAR_RETRY_IDS = [...transient].filter(id => !avatars[id]);
      return avatars;
    }
    function scheduleAvatarRetry(proxyUrl) {
      [4000, 12000, 30000].forEach(delay => setTimeout(async () => {
        if (!AVATAR_RETRY_IDS.length) return;
        const got = await fetchAvatarsInBatches(proxyUrl, [...AVATAR_RETRY_IDS]);
        if (Object.keys(got).length) {
          Object.assign(DISCORD_AVATARS, got); saveAvatarStore();
          swapInAvatars();
        }
      }, delay));
    }

    /* data/avatars.json is written by the GitHub Action ({players: {name: discordId}, avatars: {discordId: url}}),
       so a visit normally needs no Worker or Discord lookups at all. The Worker is only asked about players the
       file has no picture for, at most once a day per browser. */
    const AVATAR_CHECK_KEY = 'speedtas_avatar_check_t';
    async function loadAvatarsFromRepo(proxyUrl) {
      let file = null;
      try {const r = await fetch('data/avatars.json', {cache: 'no-cache'}); if (r.ok) file = await r.json();} catch (e) {}
      if (!file || !file.players || !Object.keys(file.players).length) return false;
      Object.entries(file.players).forEach(([name, id]) => {if (/^\d{15,25}$/.test(String(id))) DISCORD_IDS[playerKey(name)] = String(id);});
      Object.entries(file.avatars || {}).forEach(([id, url]) => {if (url) DISCORD_AVATARS[id] = url;});
      saveAvatarStore();
      const missing = [...new Set(Object.values(DISCORD_IDS))].filter(id => !DISCORD_AVATARS[id] && !(file.avatars && id in file.avatars && file.avatars[id] === null));
      let last = 0; try {last = +localStorage.getItem(AVATAR_CHECK_KEY) || 0;} catch (e) {}
      if (proxyUrl && missing.length && Date.now() - last > 864e5) {
        try {localStorage.setItem(AVATAR_CHECK_KEY, String(Date.now()));} catch (e) {}
        const fresh = await fetchAvatarsInBatches(proxyUrl, missing);
        Object.assign(DISCORD_AVATARS, fresh); saveAvatarStore();
      }
      return true;
    }
    /* A saved picture that no longer loads (the player changed it): ask the Worker for that one, once a day at most. */
    let avatarFixQueue = new Set(), avatarFixTimer = null;
    function queueAvatarRefresh(id) {
      const proxyUrl = (SPEEDTAS_API_URL || getAvatarProxyUrl() || '').replace(/\/+$/, '');
      if (!proxyUrl || !id) return;
      const key = 'speedtas_avfix_' + id;
      try {const t = +localStorage.getItem(key); if (t && Date.now() - t < 864e5) return; localStorage.setItem(key, String(Date.now()));} catch (e) {}
      avatarFixQueue.add(id);
      clearTimeout(avatarFixTimer);
      avatarFixTimer = setTimeout(async () => {
        const ids = [...avatarFixQueue]; avatarFixQueue = new Set();
        const fresh = await fetchAvatarsInBatches(proxyUrl, ids);
        const changed = ids.filter(id => fresh[id] && fresh[id] !== DISCORD_AVATARS[id]);
        if (changed.length) {Object.assign(DISCORD_AVATARS, fresh); saveAvatarStore(); swapInAvatars();}
      }, 1500);
    }
    async function loadDiscordProfiles() {
      try {
        const proxyUrl = (SPEEDTAS_API_URL || getAvatarProxyUrl() || '').replace(/\/+$/, '');
        if (await loadAvatarsFromRepo(proxyUrl)) return;
        DISCORD_IDS = {...DISCORD_IDS}; let freshRoster = 0; // keep last visit's IDs until the new roster arrives
        // The Worker fetches the Players tab so public browsers never have
        // to execute a Google JSONP script to build the avatar roster.
        let rosterLoaded = false;
        if (proxyUrl) {
          try {
            const response = await retryAsync(async () => {
              const res = await fetch(proxyUrl + '/players');
              if (!res.ok) throw new Error('Worker responded with ' + res.status);
              return res.json();
            });
            Object.entries(response.players || {}).forEach(([name, id]) => {
              if (/^\d{15,25}$/.test(String(id))) {DISCORD_IDS[playerKey(name)] = String(id); freshRoster++;}
            });
            rosterLoaded = freshRoster > 0;
          } catch (err) {console.warn('Worker Players endpoint unavailable; falling back to Google Sheets.', err);}
        }
        if (!rosterLoaded) {
          // Compatibility fallback while the Worker update is being deployed.
          const response = await retryAsync(() => fetchViaJSONP(PLAYER_SHEET_NAME));
          const table = response?.table;
          const labels = (table?.cols || []).map(c => String(c?.label || '').trim().toLowerCase());
          const nameCol = labels.findIndex(x => ['players', 'player', 'player name', 'name'].includes(x));
          const idCol = labels.findIndex(x => ['id', 'discord id', 'discordid', 'discord'].includes(x));
          if (nameCol < 0 || idCol < 0) throw new Error('Players tab needs Player and Discord ID headers.');
          (table.rows || []).forEach(row => {const cells = row.c || []; const name = String(cells[nameCol]?.v ?? '').trim(); const id = String(cells[idCol]?.f ?? cells[idCol]?.v ?? '').replace(/\s/g, ''); if (name && /^\d{15,25}$/.test(id)) DISCORD_IDS[playerKey(name)] = id;});
        }
        if (proxyUrl && Object.keys(DISCORD_IDS).length) {
          const ids = [...new Set(Object.values(DISCORD_IDS))];
          const fresh = await fetchAvatarsInBatches(proxyUrl, ids);
          DISCORD_AVATARS = {...DISCORD_AVATARS, ...fresh}; // new answers win, older known-good pictures are kept
          saveAvatarStore();
          scheduleAvatarRetry(proxyUrl);
        }
      } catch (err) {console.warn('Discord player directory unavailable:', err);}
    }

    /* ============ COMPUTE STATS ============ */
    function computeAll(data) {
      const players = {}; // name -> stats object
      data.players.forEach(name => {
        players[name] = {
          name, points: 0, wins: 0, podiums: 0, played: 0, placements: [],
          cumulative: [], history: [] // {edition, placement, points}
        };
      });

      data.editions.forEach(ed => {
        Object.entries(ed.results).forEach(([name, place]) => {
          if (!players[name]) players[name] = {name, points: 0, wins: 0, podiums: 0, played: 0, placements: [], cumulative: [], history: []};
          const pts = pointsFor(place);
          const p = players[name];
          p.points += pts;
          p.played += 1;
          if (place === 1) p.wins += 1;
          if (place <= 3) p.podiums += 1;
          p.placements.push(place);
          p.history.push({edition: ed.edition, placement: place, points: pts});
        });
      });

      /* Best-of scoring (Season 3: best 9 of 12, old F1 style). Only a player's `bestOf` highest-scoring results
         count; the others are marked dropped (lowest points first, the earliest among equals).
         p.points = counted total, p.scored = every point scored. Datasets without bestOf are untouched. */
      const bestOf = data.bestOf || null;
      const countedSum = pts => bestOf ? [...pts].sort((a, b) => b - a).slice(0, bestOf).reduce((a, b) => a + b, 0) : pts.reduce((a, b) => a + b, 0);
      if (bestOf) {
        Object.values(players).forEach(p => {
          p.scored = p.points;
          const order = p.history.map((h, i) => i).sort((a, b) => p.history[a].points - p.history[b].points || a - b);
          order.slice(0, Math.max(0, p.history.length - bestOf)).forEach(i => {p.history[i].dropped = true;});
          p.points = p.history.reduce((a, h) => a + (h.dropped ? 0 : h.points), 0);
          p.droppedPoints = p.scored - p.points;
        });
      }

      // cumulative points per player aligned to edition order
      const editionOrder = data.editions.map(e => e.edition);
      Object.values(players).forEach(p => {
        let running = 0;
        const map = {};
        if (bestOf) p.history.forEach((h, i) => {map[h.edition] = countedSum(p.history.slice(0, i + 1).map(x => x.points));});
        else p.history.forEach(h => {running += h.points; map[h.edition] = running;});
        let last = 0;
        p.cumulative = editionOrder.map(e => {if (map[e] !== undefined) last = map[e]; return last;});
      });

      // derived stats
      Object.values(players).forEach(p => {
        p.avgPlacement = p.placements.length ? (p.placements.reduce((a, b) => a + b, 0) / p.placements.length) : null;
        p.best = p.placements.length ? Math.min(...p.placements) : null;
        p.worst = p.placements.length ? Math.max(...p.placements) : null;
        p.top10 = p.placements.filter(x => x <= 10).length;
        p.winRate = p.played ? p.wins / p.played : 0;
        p.podiumRate = p.played ? p.podiums / p.played : 0;
        p.avgPoints = p.played ? (bestOf ? p.scored : p.points) / p.played : 0; // true average per race, dropped results included
      });

      // Streaks — computed over the FULL edition order (not just the player's
      // played editions), because a missed edition must break a streak even
      // though it's not the same as a bad placement. E.g. win, skip, win, win
      // is a streak of 2, not 3 — a gap in participation resets the counter.
      Object.values(players).forEach(p => {p.maxWinStreak = 0; p.maxPodiumStreak = 0; p.maxTop10Streak = 0;});
      {
        const curWin = {}, curPodium = {}, curTop10 = {};
        data.editions.forEach(ed => {
          Object.values(players).forEach(p => {
            const place = ed.results[p.name];
            if (place === undefined) {
              curWin[p.name] = 0;
              curPodium[p.name] = 0;
              curTop10[p.name] = 0;
            } else {
              curWin[p.name] = (place === 1) ? (curWin[p.name] || 0) + 1 : 0;
              curPodium[p.name] = (place <= 3) ? (curPodium[p.name] || 0) + 1 : 0;
              curTop10[p.name] = (place <= 10) ? (curTop10[p.name] || 0) + 1 : 0;
              if (curTop10[p.name] > p.maxTop10Streak) p.maxTop10Streak = curTop10[p.name];
              if (curWin[p.name] > p.maxWinStreak) p.maxWinStreak = curWin[p.name];
              if (curPodium[p.name] > p.maxPodiumStreak) p.maxPodiumStreak = curPodium[p.name];
            }
          });
        });
      }

      // ranking + movement (rank now vs rank excluding last edition)
      const ranked = Object.values(players).filter(p => p.played > 0).sort((a, b) => b.points - a.points);
      ranked.forEach((p, i) => p.rank = i + 1);

      const editionsMinusLast = data.editions.slice(0, -1);
      const prevPoints = {};
      if (bestOf) {
        const prevLists = {};
        editionsMinusLast.forEach(ed => Object.entries(ed.results).forEach(([name, place]) => {(prevLists[name] = prevLists[name] || []).push(pointsFor(place));}));
        Object.entries(prevLists).forEach(([name, pts]) => {prevPoints[name] = countedSum(pts);});
      } else editionsMinusLast.forEach(ed => Object.entries(ed.results).forEach(([name, place]) => {
        prevPoints[name] = (prevPoints[name] || 0) + pointsFor(place);
      }));
      const prevRanked = Object.entries(prevPoints).sort((a, b) => b[1] - a[1]).map(x => x[0]);
      const prevRankMap = {}; prevRanked.forEach((name, i) => prevRankMap[name] = i + 1);
      ranked.forEach(p => {
        const prevRank = prevRankMap[p.name];
        if (prevRank === undefined) p.movement = 0;
        else p.movement = prevRank - p.rank;
      });

      // most improved: compare avg points per edition first half vs second half
      Object.values(players).forEach(p => {
        const h = p.history;
        if (h.length >= 4) {
          const mid = Math.floor(h.length / 2);
          const firstAvg = h.slice(0, mid).reduce((a, b) => a + b.points, 0) / mid;
          const secondAvg = h.slice(mid).reduce((a, b) => a + b.points, 0) / (h.length - mid);
          p.improvement = secondAvg - firstAvg;
        } else p.improvement = null;
      });

      // achievements
      Object.values(players).forEach(p => {
        const badges = [];
        if (p.wins >= 1) badges.push({icon: '🏆', label: 'Champion'});
        if (p.wins >= 3) badges.push({icon: '🥇', label: 'Multi Winner'});
        if (p.maxPodiumStreak >= 5) badges.push({icon: '🔥', label: '5 Podium Streak'});
        if (p.rank && p.rank <= 3) badges.push({icon: '⭐', label: 'Top 3 Leaderboard'});
        if (p.played >= 10) badges.push({icon: '🎯', label: '10 Editions Played'});
        if (p.points >= 100) badges.push({icon: '💯', label: '100 Points'});
        if (GAME === 'tm20' && p.top10 >= 10) badges.push({icon: '🔟', label: '10 Top-10 Finishes'});
        p.badges = badges;
      });

      return {players, editionOrder, ranked};
    }

    /* ============ CUSTOM PROFILE PICTURES ============
       Stored in the browser's localStorage (this file runs standalone, not
       inside Claude's artifact sandbox, so localStorage works normally here).
       Photos are resized client-side before saving so they stay small. */
    const AVATAR_KEY_PREFIX = 'speedtas_v1_avatar_';

    /* avatarHTML() calls getAvatarOverride() once per player row - 50+ times
       on a single Players directory render. Reading localStorage that many
       times on every render adds up, so overrides are read into memory once
       at init and kept in sync from there instead of re-reading storage on
       every single card. */
    let AVATAR_OVERRIDES_CACHE = {};
    function loadAvatarOverridesCache() {
      const cache = {};
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith(AVATAR_KEY_PREFIX) && key !== AVATAR_PROXY_KEY) {
            cache[decodeURIComponent(key.slice(AVATAR_KEY_PREFIX.length))] = localStorage.getItem(key);
          }
        }
      } catch (e) { /* localStorage unavailable - cache stays empty, falls through to Discord avatars */ }
      AVATAR_OVERRIDES_CACHE = cache;
    }

    function getAvatarOverride(name) {
      if (Object.prototype.hasOwnProperty.call(AVATAR_OVERRIDES_CACHE, name)) return AVATAR_OVERRIDES_CACHE[name];
      const id = discordIdFor(name);
      return id ? (DISCORD_AVATARS[id] || null) : null;
    }
    function saveAvatarOverride(name, dataUrl) {
      try {localStorage.setItem(AVATAR_KEY_PREFIX + encodeURIComponent(name), dataUrl); AVATAR_OVERRIDES_CACHE[name] = dataUrl; return true;}
      catch (e) {
        console.error('Could not save avatar:', e);
        alert("Couldn't save that photo — your browser's local storage may be full or restricted.");
        return false;
      }
    }
    function deleteAvatarOverride(name) {
      try {localStorage.removeItem(AVATAR_KEY_PREFIX + encodeURIComponent(name));} catch (e) { }
      delete AVATAR_OVERRIDES_CACHE[name];
    }

    /* Optional: URL of a self-hosted Discord-ID-to-avatar lookup proxy (see
       discord-avatar-worker.js). Entirely optional — only needed if the person
       sets up the free automatic-lookup Worker. */
    const AVATAR_PROXY_KEY = 'speedtas_v1_avatar_proxy_url';
    function getAvatarProxyUrl() {
      try {return localStorage.getItem(AVATAR_PROXY_KEY);} catch (e) {return null;}
    }
    function saveAvatarProxyUrl(url) {
      try {localStorage.setItem(AVATAR_PROXY_KEY, url); return true;} catch (e) {return false;}
    }

    /* Downscales an uploaded image client-side (max dimension in px) and
       returns a compressed JPEG data URL via callback, keeping storage lean. */
    function resizeImageToDataURL(file, maxDim, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > h) {if (w > maxDim) {h = Math.round(h * maxDim / w); w = maxDim;} }
          else {if (h > maxDim) {w = Math.round(w * maxDim / h); h = maxDim;} }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = () => alert("That file couldn't be read as an image.");
        img.src = e.target.result;
      };
      reader.onerror = () => alert("Couldn't read that file.");
      reader.readAsDataURL(file);
    }

    function promptAvatarUpload(name) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.style.display = 'none';
      document.body.appendChild(input);
      const cleanup = () => {if (input.parentNode) input.remove();};
      input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (file) resizeImageToDataURL(file, 300, (dataUrl) => {if (saveAvatarOverride(name, dataUrl)) render(); cleanup();});
        else cleanup();
      });
      input.addEventListener('cancel', cleanup);
      input.click();
    }
    function removeAvatarClicked(name) {
      deleteAvatarOverride(name);
      render();
    }
    /* ============ SHARED VIEW HELPERS ============ */
    const enc = encodeURIComponent;
    const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');
    function seasonSeg(active, attr, options) {
      return `<div class="seg" data-tmnf-only role="group" aria-label="Season">${options.map(([key, label]) => `<button type="button" class="filter-btn ${active === key ? 'active' : ''}" data-${attr}="${key}" aria-pressed="${active === key}">${escapeHtml(label)}</button>`).join('')}</div>`;
    }
    function seasonError(err) {
      main.innerHTML = `<div class="empty-state"><b>That season is unavailable right now</b>${escapeHtml(err && err.message ? err.message : String(err))}</div>`;
    }
    /* One placement as a small square: podium colours for 1-3, brighter when it scored points. */
    function formChip(place, title, href, dropped = false) {
      const cls = (place <= 3 ? 'p' + place : (pointsFor(place) > 0 ? 'pts' : '')) + (dropped ? ' dropped' : '');
      const attrs = `class="fc ${cls}" title="${escapeHtml(title)}"`;
      return href ? `<a ${attrs} href="${href}">${place}</a>` : `<span ${attrs}>${place}</span>`;
    }
    /* Classic 2-1-3 podium. entries = [[name, place], ...]; linkPrefix is the profile route prefix. */
    function podiumHTML(entries, linkPrefix = '#/player/') {
      return `<ol class="podium">${[1, 2, 3].map(place => {
        const finisher = entries.find(([, p]) => p === place);
        const who = finisher
          ? `<a class="pod-who" href="${linkPrefix}${enc(finisher[0])}">${avatarHTML(finisher[0], place === 1 ? 72 : 54)}<span class="pod-name">${escapeHtml(finisher[0])}</span><span class="pod-pts">+${pointsFor(place)} pts</span></a>`
          : `<div class="pod-who"><span class="pod-name">No result</span></div>`;
        return `<li class="pod p${place} ${finisher ? '' : 'empty'}"><span class="sr-only">Place ${place}:</span>${who}<div class="pod-block" aria-hidden="true">${place}</div></li>`;
      }).join('')}</ol>`;
    }

    /* ============ AVATAR MODAL (upload OR paste an image URL) ============
       Discord has no public, no-login API to fetch a user's avatar from just
       their numeric ID — that needs a bot token, which we won't hardcode into
       a shareable static file. The practical equivalent: in Discord, right-click
       a person's avatar → "Copy Avatar Link" → paste it here. */
    function closeAvatarModal() {
      const el = document.getElementById('avatarModalBackdrop');
      if (el) el.remove();
    }
    function openAvatarModal(name) {
      closeAvatarModal();
      const backdrop = document.createElement('div');
      backdrop.id = 'avatarModalBackdrop';
      backdrop.className = 'avatar-modal-backdrop';
      const proxyUrl = getAvatarProxyUrl();
      const safeName = escapeHtml(name);
      backdrop.innerHTML = `
    <div class="avatar-modal" role="dialog" aria-modal="true" aria-label="Change photo for ${safeName}">
      <div class="avatar-modal-head">
        <b>Change photo · ${safeName}</b>
        <button type="button" class="link-btn" id="avatarModalClose">Close</button>
      </div>
      <button type="button" class="btn" id="avatarModalUploadBtn">Upload from device</button>
      <label for="avatarUrlInput">Or paste an image URL</label>
      <div class="form-row"><input type="text" class="field" id="avatarUrlInput" placeholder="https://cdn.discordapp.com/avatars/..."><button type="button" class="btn" id="avatarUrlBtn">Use</button></div>
      <label for="avatarIdInput">Or enter a Discord ID (automatic lookup)</label>
      <div class="form-row"><input type="text" class="field" id="avatarIdInput" inputmode="numeric" placeholder="123456789012345678"><button type="button" class="btn" id="avatarIdBtn">Fetch</button></div>
      <button type="button" class="link-btn" id="avatarProxySettingsBtn" style="margin-top:10px">${proxyUrl ? 'Change lookup server' : 'Set up automatic lookup (one-time, free)'}</button>
      <div class="form-error" id="avatarModalError" role="status"></div>
      <div class="hint">
        <b>Share a server or DM with them?</b> In Discord, right-click their profile picture, choose "Copy Avatar Link" and paste it above.<br>
        <b>Only have their Discord ID?</b> Use <a href="https://www.vibebot.gg/tools/avatar-downloader" target="_blank" rel="noopener">VibeBot's Avatar Downloader ↗</a>, or set up automatic lookup.
      </div>
    </div>
  `;
      document.body.appendChild(backdrop);

      backdrop.addEventListener('click', (e) => {if (e.target === backdrop) closeAvatarModal();});
      backdrop.addEventListener('keydown', (e) => {if (e.key === 'Escape') closeAvatarModal();});
      document.getElementById('avatarModalClose').addEventListener('click', closeAvatarModal);
      document.getElementById('avatarModalUploadBtn').addEventListener('click', () => {closeAvatarModal(); promptAvatarUpload(name);});

      document.getElementById('avatarProxySettingsBtn').addEventListener('click', () => {
        const current = getAvatarProxyUrl() || '';
        const next = window.prompt(
          "Paste your Cloudflare Worker URL (see discord-avatar-worker.js for setup steps):",
          current
        );
        if (next !== null && next.trim()) {
          saveAvatarProxyUrl(next.trim().replace(/\/+$/, ''));
          openAvatarModal(name); // reopen to refresh the button label and re-bind handlers
        }
      });

      async function tryFetchById() {
        const errEl = document.getElementById('avatarModalError');
        const proxy = getAvatarProxyUrl();
        const id = document.getElementById('avatarIdInput').value.trim();
        if (!proxy) {errEl.textContent = 'Set up automatic lookup first (link above). It takes about 5 minutes, one time only.'; return;}
        if (!/^\d{15,25}$/.test(id)) {errEl.textContent = "That doesn't look like a valid Discord ID (should be a 15–25 digit number)."; return;}
        errEl.textContent = 'Looking up…';
        try {
          const res = await fetch(proxy + '/avatar?id=' + encodeURIComponent(id));
          const data = await res.json();
          if (!res.ok || data.error) {errEl.textContent = data.error || 'Lookup failed.'; return;}
          if (saveAvatarOverride(name, data.avatarUrl)) {closeAvatarModal(); render();}
        } catch (e) {
          errEl.textContent = "Couldn't reach your lookup server. Double-check its URL in the settings link above.";
        }
      }
      document.getElementById('avatarIdBtn').addEventListener('click', tryFetchById);
      document.getElementById('avatarIdInput').addEventListener('keydown', (e) => {if (e.key === 'Enter') tryFetchById();});

      function tryUseUrl() {
        const errEl = document.getElementById('avatarModalError');
        const url = document.getElementById('avatarUrlInput').value.trim();
        if (!url) {errEl.textContent = 'Paste a URL first.'; return;}
        if (!/^https?:\/\//i.test(url)) {errEl.textContent = 'That doesn\'t look like a valid URL (should start with http:// or https://).'; return;}
        errEl.textContent = 'Checking image…';
        const testImg = new Image();
        testImg.onload = () => {if (saveAvatarOverride(name, url)) {closeAvatarModal(); render();} };
        testImg.onerror = () => {errEl.textContent = "Couldn't load an image from that URL. Double-check it's a direct image link.";};
        testImg.src = url;
      }
      document.getElementById('avatarUrlBtn').addEventListener('click', tryUseUrl);
      document.getElementById('avatarUrlInput').addEventListener('keydown', (e) => {if (e.key === 'Enter') tryUseUrl();});
      document.getElementById('avatarUrlInput').focus();
    }

    /* Delegated so it works for dynamically-rendered avatars anywhere on the page,
       and stops the click from also triggering a wrapping link (e.g. a player card). */
    document.addEventListener('click', (e) => {
      const editBtn = e.target.closest('.avatar-edit-btn');
      if (editBtn) {e.preventDefault(); e.stopPropagation(); openAvatarModal(decodeURIComponent(editBtn.dataset.player)); return;}
      const removeBtn = e.target.closest('.avatar-remove-btn');
      if (removeBtn) {e.preventDefault(); e.stopPropagation(); removeAvatarClicked(decodeURIComponent(removeBtn.dataset.player)); return;}
    });

    /* ============ COLOR HELPERS ============ */
    const PALETTE = ['#e9fb59', '#59d6fb', '#fb59c9', '#59fba0', '#fba059', '#a059fb', '#fb5959', '#59fbf0'];
    function colorForName(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return PALETTE[Math.abs(hash) % PALETTE.length];
    }
    function initials(name) {
      return name.split(/\s+/).map(s => s[0]).join('').slice(0, 2).toUpperCase();
    }
    function avatarHTML(name, size) {
      const s = size || 32;
      const photo = getAvatarOverride(name);
      if (photo) {
        return `<img src="${escapeHtml(photo)}" alt="${escapeHtml(name)}" loading="lazy" onerror="handleAvatarError(this,'${encodeURIComponent(name).replace(/'/g, '%27')}')" style="width:${s}px;height:${s}px;border-radius:50%;object-fit:cover;flex-shrink:0;display:inline-block;vertical-align:middle;">`;
      }
      const c = colorForName(name);
      return `<div class="avatar" style="background:${c};${size ? `width:${size}px;height:${size}px;font-size:${size * 0.35}px;` : ''}" role="img" aria-label="${escapeHtml(name)}">${escapeHtml(initials(name))}</div>`;
    }
    /* Pictures arrive after the page is drawn. Swap them into the initials placeholders in place, instead of
       redrawing the page, which used to reset whatever season or filter the visitor had just picked. */
    function swapInAvatars() {
      document.querySelectorAll('.avatar[role="img"][aria-label]').forEach(div => {
        const name = div.getAttribute('aria-label');
        if (!getAvatarOverride(name)) return;
        const size = parseInt(div.style.width, 10) || undefined;
        const tmp = document.createElement('div');
        tmp.innerHTML = avatarHTML(name, size);
        if (tmp.firstElementChild) div.replaceWith(tmp.firstElementChild);
      });
    }
    /* If a Discord CDN image 404s or is unreachable, swap it for the same
       colored-initials avatar avatarHTML() would have used anyway. */
    function handleAvatarError(img, encodedName) {
      const name = decodeURIComponent(encodedName);
      queueAvatarRefresh(discordIdFor(name));
      const s = img.clientWidth || img.offsetWidth || 32;
      const div = document.createElement('div');
      div.className = 'avatar';
      div.style.cssText = `background:${colorForName(name)};width:${s}px;height:${s}px;font-size:${Math.round(s * 0.35)}px;`;
      div.textContent = initials(name);
      img.replaceWith(div);
    }
    /* Same as avatarHTML but wraps it with a small always-visible edit button
       that opens the file picker — this is the "easy to change" entry point. */
    function avatarEditableHTML(name, size, btnSize) {
      const bs = btnSize || Math.max(16, Math.round((size || 32) * 0.34));
      return `<div class="avatar-wrap" style="width:${size || 32}px;height:${size || 32}px;">
    ${avatarHTML(name, size)}
    <button type="button" class="avatar-edit-btn" data-player="${encodeURIComponent(name)}" title="Change photo for ${escapeHtml(name)}" aria-label="Change photo for ${escapeHtml(name)}" style="width:${bs}px;height:${bs}px;font-size:${Math.round(bs * 0.55)}px;">📷</button>
  </div>`;
    }
    function medalFor(rank) {
      if (rank >= 1 && rank <= 3) return `<span class="medal m${rank}" role="img" aria-label="${['Gold', 'Silver', 'Bronze'][rank - 1]}"></span>`;
      return '';
    }
    function moveIcon(m) {
      if (m > 0) return `<span class="move-up">▲ ${m}</span>`;
      if (m < 0) return `<span class="move-down">▼ ${Math.abs(m)}</span>`;
      return `<span class="move-same">–</span>`;
    }

    /* ============ ROUTER ============ */
    function currentRoute() {
      const hash = location.hash.replace(/^#/, '') || '/';
      const parts = hash.split('/').filter(Boolean).map(part => {
        try { return decodeURIComponent(part); } catch (e) { return part; }
      });
      ROUTE_GAME = 'tmnf';
      if (parts[0] === 'tm20') {ROUTE_GAME = 'tm20'; parts.shift();}
      return parts;
    }
    window.addEventListener('hashchange', render);
    /* A page change starts at the top (hash links to non-anchors otherwise keep the old scroll position) */
    window.addEventListener('hashchange', () => window.scrollTo(0, 0));

    /* ============ RENDER: HOME ============ */
    let HOME_ARCHIVE = null, HOME_ARCHIVE_FAILED = false;
    function renderHome() {
      if (isOffSeason() && !HOME_ARCHIVE && !HOME_ARCHIVE_FAILED) {
        main.innerHTML = `<div class="loader"><div class="spinner"></div> Loading ${escapeHtml(SEASON_INFO[ARCHIVE_DEFAULT].label)} final standings…</div>`;
        const done = () => {if (GAME === 'tmnf' && currentRoute().length === 0) renderHome();};
        loadSeasonData(ARCHIVE_DEFAULT).then(d => {HOME_ARCHIVE = d;}).catch(err => {console.warn('Off-season archive unavailable; showing the empty current season.', err); HOME_ARCHIVE_FAILED = true;}).then(done);
        return;
      }
      const archive = isOffSeason() ? HOME_ARCHIVE : null; // Season 2 data while Season 3 has no results
      const D = archive || RAW;
      const homeKey = archive ? ARCHIVE_DEFAULT : curKey();
      const sk = archive ? ARCHIVE_DEFAULT + '/' : ''; // season prefix for player/edition links
      setSeasonTheme(archive ? ARCHIVE_DEFAULT : null);

    function sortBoard(board, state) {
      const arr = [...board];
      const keyMap = {
        rank: p => p.rank, name: p => p.name.toLowerCase(), points: p => p.points, wins: p => p.wins,
        podiums: p => p.podiums, avgPlacement: p => p.avgPlacement ?? 999, played: p => p.played, move: p => p.movement || 0
      };
      const key = keyMap[state.key] || keyMap.points;
      arr.sort((a, b) => {
        const av = key(a), bv = key(b);
        if (av < bv) return state.dir === 'asc' ? -1 : 1;
        if (av > bv) return state.dir === 'asc' ? 1 : -1;
        return 0;
      });
      return arr;
    }

    function setupSortableTable(board) {
      document.querySelectorAll('#leaderboardTable th[data-key]').forEach(th => {
        const sortBy = () => {
          if (sortState.key === th.dataset.key) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
          else {sortState.key = th.dataset.key; sortState.dir = 'desc';}
          const key = th.dataset.key;
          renderHome();
          // renderHome rebuilds the table, so hand keyboard focus back to the header that was used
          const again = document.querySelector(`#leaderboardTable th[data-key="${key}"]`); if (again) again.focus();
        };
        if (th.dataset.key === sortState.key) {
          th.classList.add('sorted');
          th.setAttribute('aria-sort', sortState.dir === 'asc' ? 'ascending' : 'descending');
        }
        // Headers are keyboard-operable: Tab to focus, Enter or Space to sort
        th.tabIndex = 0;
        th.addEventListener('click', sortBy);
        th.addEventListener('keydown', e => {if (e.key === 'Enter' || e.key === ' ') {e.preventDefault(); sortBy();}});
      });
    }

    function exportLeaderboardCSV(board) {
      const rows = [['Rank', 'Player', 'Points', 'Wins', 'Podiums', 'AvgPlacement', 'EditionsPlayed']];
      board.forEach(p => rows.push([p.rank, p.name, p.points, p.wins, p.podiums, p.avgPlacement ? p.avgPlacement.toFixed(2) : '', p.played]));
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], {type: 'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'speedtas_leaderboard.csv'; a.click();
      URL.revokeObjectURL(url);
    }

    /* ============ COUNTDOWN ============ */
    let countdownTimer = null;
    /* Real moment of a Lisbon wall-clock time (handles summer/winter time). */
    function lisbonMoment(y, m, d, hour) {
      const guess = Date.UTC(y, m - 1, d, hour, 0, 0);
      const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {timeZone: 'Europe/Lisbon', hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'}).formatToParts(new Date(guess)).map(p => [p.type, p.value]));
      const shown = Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour % 24, +parts.minute, +parts.second);
      return new Date(guess - (shown - guess));
    }
    const isoDay = t => new Date(t).toISOString().slice(0, 10);
    /* Next points edition: Saturdays at 18:00 Lisbon, skipping the breaks and anything before the season starts.
       Returns {at: Date, skipped: [break dates passed over]}. An edition counts as "next" until its hour is over. */
    function nextEditionLisbon() {
      const now = Date.now();
      const today = Object.fromEntries(new Intl.DateTimeFormat('en-US', {timeZone: 'Europe/Lisbon', year: 'numeric', month: '2-digit', day: '2-digit'}).formatToParts(new Date(now)).map(p => [p.type, p.value]));
      let day = Date.UTC(+today.year, +today.month - 1, +today.day);
      day += ((6 - new Date(day).getUTCDay() + 7) % 7) * 86400000; // this or next Saturday
      const start = SEASON_INFO[CURRENT_TMNF_SEASON].start;
      const skipped = [];
      for (let i = 0; i < 60; i++) {
        const iso = isoDay(day), [y, m, d] = iso.split('-').map(Number), at = lisbonMoment(y, m, d, EDITION_HOUR_LISBON);
        if (at.getTime() + 3600e3 <= now) {day += 7 * 86400000; continue;} // still "next" during the hour it runs
        if ((start && iso < start) || SCHEDULE_BREAKS.includes(iso)) {if (!(start && iso < start)) skipped.push(iso); day += 7 * 86400000; continue;}
        return {at, skipped, iso};
      }
      return {at: lisbonMoment(...isoDay(day).split('-').map(Number), EDITION_HOUR_LISBON), skipped, iso: isoDay(day)};
    }
    const fmtLisbonDay = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC'});
    function startCountdown() {
      if (countdownTimer) clearInterval(countdownTimer);
      function tick() {
        const target = nextEditionLisbon().at;
        const diff = target.getTime() - Date.now();
        const el = document.getElementById('countdown');
        if (!el) {clearInterval(countdownTimer); return;}
        if (diff <= 0) {el.innerHTML = '<div class="unit"><div class="num">Live</div><div class="unit-label">The edition is running now</div></div>'; return;}
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        el.innerHTML = `
      <div class="unit"><div class="num">${days}</div><div class="unit-label">Days</div></div>
      <div class="unit"><div class="num">${String(hours).padStart(2, '0')}</div><div class="unit-label">Hours</div></div>
      <div class="unit"><div class="num">${String(mins).padStart(2, '0')}</div><div class="unit-label">Minutes</div></div>
      <div class="unit"><div class="num">${String(secs).padStart(2, '0')}</div><div class="unit-label">Seconds</div></div>
    `;
      }
      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    /* ============ CHARTS ============ */
    const accentHex = () => getComputedStyle(document.body).getPropertyValue('--accent').trim() || (GAME === 'tm20' ? '#59d6fb' : '#b388ff');
    /* Series colours for the top-six chart: the game accent leads, the rest stay clearly apart from it. */
    const seriesColors = () => GAME === 'tm20' ? [accentHex(), '#ff4f79', '#4d8dff', '#ffb347', '#b08bff', '#e9fb59'] : [accentHex(), '#ff4f79', '#4d8dff', '#ffb347', document.body.classList.contains('season-legacy') ? '#b388ff' : '#e9fb59', '#59d6fb'];
    function chartOptions(extra = {}) {
      const tick = {color: '#9094a0', font: {family: "'JetBrains Mono', monospace", size: 11}};
      const grid = {color: '#1c1f25'};
      return {
        responsive: true, maintainAspectRatio: false,
        interaction: {mode: 'index', intersect: false},
        plugins: {
          legend: {display: false},
          tooltip: {backgroundColor: '#14161a', borderColor: '#363b45', borderWidth: 1, titleColor: accentHex(), bodyColor: '#eef0ea', padding: 10, cornerRadius: 5, usePointStyle: true, boxPadding: 4}
        },
        scales: {x: {ticks: tick, grid, border: {color: '#23262d'}}, y: {ticks: {...tick, precision: 0}, grid, border: {color: '#23262d'}}},
        ...extra
      };
    }
    let progressChartInstance = null;
    function renderProgressChart(players, editionOrder, ranked) {
      const top6 = ranked.slice(0, 6);
      const ctx = document.getElementById('progressChart');
      if (!ctx) return;
      if (!window.Chart) {whenChart(() => {if (document.body.contains(ctx)) renderProgressChart(players, editionOrder, ranked);}); return;}
      if (progressChartInstance) progressChartInstance.destroy();
      const colors = seriesColors();
      const opts = chartOptions();
      opts.plugins.legend = {display: true, position: 'bottom', labels: {color: '#eef0ea', usePointStyle: true, pointStyle: 'rectRounded', boxWidth: 10, boxHeight: 10, padding: 18, font: {family: "'Barlow', sans-serif", size: 13, weight: 600}}};
      opts.scales.x.title = {display: true, text: 'Edition', color: '#5f636e'};
      progressChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: editionOrder,
          datasets: top6.map((p, i) => ({
            label: p.name,
            data: p.cumulative,
            borderColor: colors[i],
            backgroundColor: colors[i],
            tension: 0.25,
            pointRadius: 0,
            pointHoverRadius: 5,
            borderWidth: i === 0 ? 3 : 2
          }))
        },
        options: opts
      });
    }

    /* ============ RENDER: PLAYERS DIRECTORY ============ */
    function renderPlayers(seasonKey = viewKey(), seasonData = null) {
      setSeasonTheme(seasonKey);
      if (seasonKey !== curKey() && !seasonData) {
        main.innerHTML = `<div class="loader"><div class="spinner"></div> Loading player directory…</div>`;
        (seasonKey === 'both' ? loadAllTmnfSeasons() : loadSeasonData(seasonKey)).then(data => renderPlayers(seasonKey, data)).catch(seasonError);
        return;
      }
      let ranked, label;
      if (seasonKey === 'both') {
        /* seasonData = [[key, data], ...]: each season's own championship points, added up */
        const rows = comparisonRows(...seasonData.map(([key, data]) => seasonStats(key === curKey() ? RAW : data)));
        ranked = rows.map(r => ({name: r.name, points: r.total, played: r.played, wins: r.wins, podiums: r.podiums})).sort((a, b) => b.points - a.points || b.wins - a.wins).map((p, i) => ({...p, rank: i + 1})); label = 'All seasons';
      } else {ranked = seasonStats(seasonKey === curKey() ? RAW : seasonData); label = labelFor(seasonKey);}
      const linkSeason = seasonKey === 'both' ? 'all' : seasonKey;
      const E = escapeHtml;
      main.innerHTML = `
    <header class="page-head"><div class="kicker">${E(label)} · ${plural(ranked.length, 'player')}</div><h1>Player <em>directory</em></h1><p>Everyone who has entered a SpeedTAS edition, in championship order.</p></header>

    <div class="directory" id="directoryGrid">${ranked.map(p => `<a href="#/player/${linkSeason}/${enc(p.name)}" class="player-card-link" data-name="${E(p.name.toLowerCase())}"><div class="player-card ${p.rank <= 3 ? 'top r' + p.rank : ''}">${avatarHTML(p.name, 44)}<div><div class="pname">${E(p.name)}</div><div class="pmeta"><b>${p.points}</b> pts · ${plural(p.played, 'race')}</div></div><span class="prank" aria-label="Rank ${p.rank}">${p.rank}</span></div></a>`).join('')}</div>
    <div class="empty-state" id="dirEmpty" hidden>No player matches that filter.</div>
    ${ranked.length ? '' : `<div class="empty-state"><b>No players yet</b>Players appear here after their first ${E(label)} edition.</div>`}`;
      main.querySelectorAll('[data-directory-season]').forEach(btn => btn.addEventListener('click', () => renderPlayers(btn.dataset.directorySeason)));
      document.getElementById('dirSearch').addEventListener('input', e => {
        const q = e.target.value.trim().toLowerCase(); let shown = 0;

        document.getElementById('dirEmpty').hidden = shown > 0;
      });

    /* ============ RENDER: PLAYER PROFILE ============ */

    /* ============ RENDER: VERSUS ============ */
    function h2hAvatarHTML(name, color) {

    /* Every TMNF season as one dataset. seasons = [[key, data], ...] oldest first (see loadAllTmnfSeasons).

    function combinedSeasonData(seasons) {

      const preferred = {}, players = [];
      list.forEach(([, data]) => data.players.forEach(name => {const key = playerKey(name); preferred[key] = name;}));
      Object.values(preferred).forEach(name => players.push(name));

        Object.entries(ed.results).forEach(([name, place]) => {results[preferred[playerKey(name)]] = place;});

      });
      return {players, editions: list.flatMap(([key, data]) => convert(data, `${SEASON_INFO[key].short} ·`))};

    function renderVersus(p1name, p2name, seasonKey = viewKey(), suppliedData = null) {

      function fmtPct(x) {return (x * 100).toFixed(0) + '%';}
      function fmtNum(x, d = 0) {return (x === null || x === undefined || isNaN(x)) ? '—' : x.toFixed(d);}

      /* Renders one comparison row. higherIsBetter: true = bigger number wins,

         Returns {html, winner} so the board can count category wins. */
      function statRow(label, rawA, rawB, displayA, displayB, higherIsBetter) {
        const valid = v => v !== null && v !== undefined && !isNaN(v);
        let winner = null;
        if (higherIsBetter !== null && valid(rawA) && valid(rawB)) {
          if (rawA === rawB) winner = 'even';
          else winner = (higherIsBetter ? rawA > rawB : rawA < rawB) ? 'a' : 'b';
        }
        /* Split bar: relative share of each side. For lower-is-better stats (rank,

        let bar = '';

          const vb = higherIsBetter ? rawB : (rawB > 0 ? 1 / rawB : 0);

            const pa = Math.round(va / (va + vb) * 100);

          }

      function draw() {
        const pa = players[document.getElementById('selA').value];

        const colorA = 'var(--side-a)', colorB = 'var(--side-b)';
        const E = escapeHtml, nA = E(pa.name), nB = E(pb.name);

        const commonEditions = pa.history.filter(h => pb.history.find(h2 => h2.edition === h.edition));

        commonEditions.forEach(h => {

        const avgGap = commonEditions.length ? (commonEditions.reduce((sum, h) => sum + Math.abs(h.placement - (pb.history.find(h2 => h2.edition === h.edition)?.placement || h.placement)), 0) / commonEditions.length).toFixed(1) : '—';

        const rows = [
          statRow('Current Rank', pa.rank ?? null, pb.rank ?? null, pa.rank ? ('#' + pa.rank) : '—', pb.rank ? ('#' + pb.rank) : '—', false),

          statRow('Wins', pa.wins, pb.wins, pa.wins, pb.wins, true),
          statRow('Podiums', pa.podiums, pb.podiums, pa.podiums, pb.podiums, true),
          statRow('Win Rate', pa.winRate, pb.winRate, fmtPct(pa.winRate), fmtPct(pb.winRate), true),
          statRow('Podium Rate', pa.podiumRate, pb.podiumRate, fmtPct(pa.podiumRate), fmtPct(pb.podiumRate), true),
          statRow('Avg Placement', pa.avgPlacement, pb.avgPlacement, fmtNum(pa.avgPlacement, 2), fmtNum(pb.avgPlacement, 2), false),

          statRow('Editions Played', pa.played, pb.played, pa.played, pb.played, true),
        ];
        const catA = rows.filter(r => r.winner === 'a').length, catB = rows.filter(r => r.winner === 'b').length, catEven = rows.filter(r => r.winner === 'even').length;
        const rowsHTML = rows.map(r => r.html).join('');
        const decided = aH2H + bH2H + ties;
        const shA = decided ? Math.round(aH2H / decided * 100) : 0, shB = decided ? Math.round(bH2H / decided * 100) : 0, shT = decided ? 100 - shA - shB : 0;

        document.getElementById('versusResult').innerHTML = `

        </div>
        <div class="h2h-share">${decided ? `<div class="rv-bar" role="img" aria-label="Head-to-head share: ${nA} ${shA}%, ties ${shT}%, ${nB} ${shB}%"><span class="a" style="width:${shA}%"></span>${shT ? `<span class="t" style="width:${shT}%"></span>` : ''}<span class="b" style="width:${shB}%"></span></div><div class="rv-bar-legend"><span class="a">${shA}%</span><span>Head-to-head share</span><span class="b">${shB}%</span></div>` : `<div class="rv-bar-legend" style="justify-content:center"><span>No shared editions yet</span></div>`}</div>
        <div class="match-meta"><div>Shared editions<b>${commonEditions.length}</b></div><div>Average gap<b>${avgGap}</b></div><div>Ties<b>${ties}</b></div></div>
        <div class="vs-edge"><span>Category edge</span><span class="chip a">${nA} ${catA}</span><span class="chip">Even ${catEven}</span><span class="chip b">${nB} ${catB}</span></div>

        <div class="h2h-matchups"><div class="h2h-matchups-head"><b>Latest shared editions</b><span>${avgA !== null ? `Avg placement: ${nA} ${avgA.toFixed(2)} · ${nB} ${avgB.toFixed(2)}` : 'No shared editions yet'}</span></div>${recentMatchups.length ? `<div class="table-wrap"><table><thead><tr><th>Edition</th><th>${nA}</th><th>${nB}</th><th>Edge</th></tr></thead><tbody>${recentMatchups.map(m => `<tr><td>${E(m.edition)}</td><td class="${m.result === 'A' ? 'cell-win-a' : ''}">P${m.a}</td><td class="${m.result === 'B' ? 'cell-win-b' : ''}">P${m.b}</td><td><span class="edge-badge ${m.result === 'A' ? 'a' : m.result === 'B' ? 'b' : ''}">${m.result === 'A' ? nA : m.result === 'B' ? nB : 'Tie'}</span></td></tr>`).join('')}</tbody></table></div>` : '<p>These players have not raced the same edition yet.</p>'}</div>
      </div>
    `;
      }
      document.getElementById('selA').addEventListener('change', draw);
      document.getElementById('selB').addEventListener('change', draw);
      main.querySelectorAll('[data-h2h-season]').forEach(btn => btn.addEventListener('click', () => renderVersus(undefined, undefined, btn.dataset.h2hSeason)));
      document.getElementById('swapH2H').addEventListener('click', () => {
        const selA = document.getElementById('selA'), selB = document.getElementById('selB');

    /* ============ RECORDS & RIVALRIES ============ */
    function seasonSource(key) {return loadSeasonData(key);}

    function recordDefinitions(ranked) {
      const eligible = ranked.filter(p => p.played > 0);
      /* Everyone who shares the best value (ties included). zeroIsNothing: a best of 0 is not a record. */
      const top = (field, direction = 'desc', minPlayed = 0, zeroIsNothing = true) => {
        const list = eligible.filter(p => p.played >= minPlayed && p[field] != null);
        if (!list.length) return [];
        const best = list.reduce((m, p) => direction === 'asc' ? Math.min(m, p[field]) : Math.max(m, p[field]), direction === 'asc' ? Infinity : -Infinity);
        if (zeroIsNothing && best <= 0) return [];
        return list.filter(p => Math.abs(p[field] - best) < 1e-9);
      };
      const rec = (icon, label, field, holders, value, note) => ({icon, label, field, holders, player: holders[0], value, note});
      return [
        rec('🏆', 'Most wins', 'wins', top('wins'), p => p.wins + (p.wins === 1 ? ' win' : ' wins'), 'Race victories this season'),
        rec('🔥', 'Longest win streak', 'maxWinStreak', top('maxWinStreak'), p => p.maxWinStreak + ' in a row', 'Consecutive editions won'),
        rec('✨', 'Longest podium streak', 'maxPodiumStreak', top('maxPodiumStreak'), p => p.maxPodiumStreak + ' in a row', 'Consecutive top-three finishes'),
        rec('🥉', 'Most podiums', 'podiums', top('podiums'), p => p.podiums + (p.podiums === 1 ? ' podium' : ' podiums'), 'Top-three finishes'),
        rec('🎯', 'Best average placement', 'avgPlacement', top('avgPlacement', 'asc', 3, false), p => p.avgPlacement.toFixed(2), 'Minimum 3 editions played · lower is better'),
        rec('⚡', 'Highest win rate', 'winRate', top('winRate', 'desc', 3), p => Math.round(p.winRate * 100) + '%', 'Minimum 3 editions played'),
        rec('📈', 'Most points', 'points', top('points'), p => p.points + ' pts', 'Total points earned'),
        rec('🎮', 'Most appearances', 'played', top('played'), p => p.played + ' editions', 'Most races entered')
      ].concat(GAME === 'tm20' ? [
        rec('🔟', 'Most top-10 finishes', 'top10', top('top10'), p => p.top10 + (p.top10 === 1 ? ' finish' : ' finishes'), 'Scoring positions (1st-10th)'),
        rec('🧱', 'Longest top-10 streak', 'maxTop10Streak', top('maxTop10Streak'), p => p.maxTop10Streak + ' in a row', 'Consecutive editions in the top 10')
      ] : []);
    }

    function recordCard(record) {
      const E = escapeHtml;
      const holders = record.holders || (record.player ? [record.player] : []);
      const head = `<div class="record-label">${E(record.label)}</div>`;
      if (!holders.length) return `<div class="record-card">${head}<div class="record-value">—</div><div class="record-note">Not enough results yet</div></div>`;
      const p = holders[0];
      /* "5 wins" -> big figure + small unit */
      const parts = String(record.value(p)).match(/^(\S+)\s*(.*)$/);
      const value = `<div class="record-value">${E(parts[1])}${parts[2] ? `<small>${E(parts[2])}</small>` : ''}</div>`;
      if (holders.length === 1) {
        return `<a class="record-card" href="#/player/${enc(p.name)}">${head}${value}<div class="record-holder">${avatarHTML(p.name, 30)} <span>${E(p.name)}</span></div><div class="record-note">${E(record.note)}</div></a>`;
      }
      const MAX = 6;
      const chips = holders.slice(0, MAX).map(h => `<a class="record-chip" href="#/player/${enc(h.name)}">${avatarHTML(h.name, 24)}<span>${E(h.name)}</span></a>`).join('');
      const more = holders.length > MAX ? `<span class="record-chip more">+${holders.length - MAX} more</span>` : '';
      return `<div class="record-card shared">${head}${value}<div class="record-shared">Shared by ${holders.length} players</div><div class="record-holders">${chips}${more}</div><div class="record-note">${E(record.note)}</div></div>`;
    }

      setSeasonTheme(season);
      main.innerHTML = `

    <div id="recordContent" class="record-grid"><div class="loader"><div class="spinner"></div> Opening the record book…</div></div>`;
      main.querySelectorAll('[data-record-season]').forEach(b => b.addEventListener('click', () => renderRecords(b.dataset.recordSeason)));
      seasonSource(season).then(data => {
