            <div class="result-winner">${latestWinner !== '—' ? avatarHTML(latestWinner, 64) : ''}<div><div class="result-name">${E(latestWinner)}</div><div class="result-pts">${latestEdition ? 'Winner · ' + pointsFor(1) + ' points earned' : ''}</div></div></div>
            <ol class="result-podium">${restPodium.map(([name, place]) => `<li><span class="place">${place === 2 ? '2nd' : '3rd'}</span>${avatarHTML(name, 28)}<span>${E(name)}</span></li>`).join('') || '<li class="recap-detail">Results pending</li>'}</ol>
          </div>
          ${latestEdition ? `<a class="result-link" href="#/edition/${encodeURIComponent(latestEdition.edition)}">View full results →</a>` : ''}
        </article>
        ${GAME === 'tm20' ? '' : `<aside class="next-up" aria-label="Next edition">
          <div class="countdown-title">Next SpeedTAS starts in</div>
          <div class="countdown" id="countdown"></div>
        </aside>`}
      </div>
      <div class="recap-grid">
        <div class="recap-card"><div class="recap-kicker">Biggest climber</div>${climber ? `<div class="recap-move"><strong>▲ ${climber.movement}</strong><span>places gained</span></div><div class="recap-title" style="margin-top:6px">${E(climber.name)}</div><div class="recap-detail">Best rank movement after Edition ${E(latestEdition?.edition || '—')}.</div>` : '<div class="recap-title">No movement yet</div><div class="recap-detail">Rank shifts appear after another edition.</div>'}</div>
        <div class="recap-card"><div class="recap-kicker">First-timers</div>${debutants.length ? `<div class="recap-debuts">${debutants.slice(0, 4).map(name => avatarHTML(name, 28)).join('')}<span class="recap-title" style="font-size:var(--fs-md)">${debutants.map(E).join(', ')}</span></div><div class="recap-detail">Welcome to the SpeedTAS grid.</div>` : '<div class="recap-title">No debuts</div><div class="recap-detail">Every racer had already competed before.</div>'}</div>
      </div>
      <div class="stat-strip" role="list">
        <div class="stat" role="listitem"><div class="label">Editions</div><div class="value">${totalEditions}</div></div>
        <div class="stat" role="listitem"><div class="label">Players</div><div class="value">${totalPlayers}</div></div>
        <div class="stat" role="listitem"><div class="label">Podium finishes</div><div class="value">${totalPodiums}</div></div>
        <div class="stat" role="listitem"><div class="label">Avg participants</div><div class="value">${avgParticipants}</div></div>
        <div class="stat" role="listitem"><div class="label">Current leader</div><div class="value text">${leader ? E(leader.name) : '—'}</div><div class="sub">${leader ? leader.points + ' pts' : ''}</div></div>
        <div class="stat" role="listitem"><div class="label">Closest battle</div><div class="value text">${closestPair ? E(closestPair[0].name) + ' vs ' + E(closestPair[1].name) : '—'}</div><div class="sub">${closestPair ? closestGap + ' pt gap' : ''}</div></div>
      </div>
    </section>

    <section>
      <h2 class="section-title">Overall leaderboard</h2>
      <div class="lb-toolbar">
        <div class="filters" role="group" aria-label="Leaderboard range">
          <button type="button" class="filter-btn ${leaderboardFilter === 'all' ? 'active' : ''}" data-filter="all" aria-pressed="${leaderboardFilter === 'all'}">All time</button>
          <button type="button" class="filter-btn ${leaderboardFilter === '10' ? 'active' : ''}" data-filter="10" aria-pressed="${leaderboardFilter === '10'}">Last 10</button>
          <button type="button" class="filter-btn ${leaderboardFilter === '25' ? 'active' : ''}" data-filter="25" aria-pressed="${leaderboardFilter === '25'}">Last 25</button>
        </div>
        <div class="table-actions"><button type="button" class="export-btn" id="exportCsv">Export CSV</button></div>
      </div>
      <div class="panel lb-panel">
        <div class="lb-scroll">
          <table id="leaderboardTable">

    function sortBoard(board, state) {
      const arr = [...board];
      const keyMap = {
        rank: p => p.rank, name: p => p.name.toLowerCase(), points: p => p.points, wins: p => p.wins,
        podiums: p => p.podiums, avgPlacement: p => p.avgPlacement ?? 999, played: p => p.played, move: p => p.movement || 0
      };
      const key = keyMap[state.key] || keyMap.points;
      arr.sort((a, b) => {
        const av = key(a), bv = key(b);
        if (av < bv) return state.dir === 'asc' ? -1 : 1;
        if (av > bv) return state.dir === 'asc' ? 1 : -1;
        return 0;
      });
      return arr;
    }

          const again = document.querySelector(`#leaderboardTable th[data-key="${key}"]`); if (again) again.focus();

    /* ============ COUNTDOWN ============ */
    let countdownTimer = null;
    function nextSaturday18Lisbon() {
      const now = new Date();
      // Get current time components in Europe/Lisbon
      const fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Europe/Lisbon', hour12: false,
        year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short'
      });
      const parts = fmt.formatToParts(now);
      const map = {}; parts.forEach(p => map[p.type] = p.value);
      const weekdayMap = {Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6};
      const curDow = weekdayMap[map.weekday];
      let daysUntil = (6 - curDow + 7) % 7;
      const curHour = parseInt(map.hour), curMin = parseInt(map.minute), curSec = parseInt(map.second);
      if (daysUntil === 0 && (curHour > 18 || (curHour === 18 && (curMin > 0 || curSec > 0)))) daysUntil = 7;

      // Build target date string in Lisbon local time, then convert properly
      const target = new Date(now.getTime());
      target.setUTCDate(target.getUTCDate()); // placeholder
      // Simplify: construct via Lisbon offset estimate using Intl
      const y = parseInt(map.year), mo = parseInt(map.month), d = parseInt(map.day);
      const baseLocal = new Date(Date.UTC(y, mo - 1, d, curHour, curMin, curSec));
      const targetLocalMidnightOffset = daysUntil * 24 * 3600 * 1000;
      // offset between "now" real UTC and the Lisbon wall-clock reading
      const wallClockUTC = Date.UTC(y, mo - 1, d, curHour, curMin, curSec);
      const offsetMs = now.getTime() - wallClockUTC; // Lisbon local -> real UTC offset
      const targetWallClockUTC = Date.UTC(y, mo - 1, d, 18, 0, 0) + targetLocalMidnightOffset;
      return new Date(targetWallClockUTC + offsetMs);
    }
    function startCountdown() {
      if (countdownTimer) clearInterval(countdownTimer);
      function tick() {
        const target = nextSaturday18Lisbon();
        const diff = target.getTime() - Date.now();
        const el = document.getElementById('countdown');
        if (!el) {clearInterval(countdownTimer); return;}
        if (diff <= 0) {el.innerHTML = '<div class="unit"><div class="num">Live</div><div class="unit-label">The edition is running now</div></div>'; return;}
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        el.innerHTML = `
      <div class="unit"><div class="num">${days}</div><div class="unit-label">Days</div></div>
      <div class="unit"><div class="num">${String(hours).padStart(2, '0')}</div><div class="unit-label">Hours</div></div>
      <div class="unit"><div class="num">${String(mins).padStart(2, '0')}</div><div class="unit-label">Minutes</div></div>
      <div class="unit"><div class="num">${String(secs).padStart(2, '0')}</div><div class="unit-label">Seconds</div></div>
    `;
      }
      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    <div class="stat-grid"><div class="card"><div class="label">Total Points</div><div class="value">${p.points}</div></div><div class="card"><div class="label">Editions Played</div><div class="value">${p.played}</div></div><div class="card profile-stat-emphasis"><div class="label">Podiums</div><div class="value">${p.podiums}</div></div><div class="card"><div class="label">Wins</div><div class="value">${p.wins}</div></div><div class="card"><div class="label">Avg Placement</div><div class="value">${p.avgPlacement.toFixed(2)}</div></div><div class="card"><div class="label">Best / Worst</div><div class="value" style="font-size:20px;">${p.best} / ${p.worst}</div></div><div class="card"><div class="label">Win Rate</div><div class="value">${(p.winRate * 100).toFixed(0)}%</div></div><div class="card"><div class="label">Podium Rate</div><div class="value">${(p.podiumRate * 100).toFixed(0)}%</div></div></div>
    <section><h2 class="section-title">Performance</h2><div class="grid" style="grid-template-columns:1fr;gap:16px;"><div class="panel"><div style="font-size:13px;color:var(--muted);margin-bottom:8px;">Placement over time</div><div class="chart-box" style="height:250px;"><canvas id="chartPlacement"></canvas></div></div><div class="panel"><div style="font-size:13px;color:var(--muted);margin-bottom:8px;">Cumulative points</div><div class="chart-box" style="height:250px;"><canvas id="chartCumulative"></canvas></div></div></div></section>
    <section><h2 class="section-title">Placement History</h2><div class="panel" style="overflow:auto;"><table><thead><tr><th>Edition</th><th>Placement</th><th>Points</th></tr></thead><tbody>${history.map(h => `<tr><td>${h.edition}</td><td>${h.placement <= 3 ? medalFor(h.placement) : ''}${h.placement}</td><td style="color:var(--accent);font-weight:700">${h.points}</td></tr>`).join('')}</tbody></table></div></section>`;
      main.querySelectorAll('[data-profile-season]').forEach(btn => btn.addEventListener('click', () => renderPlayerProfileEnhanced(decoded, btn.dataset.profileSeason, season1Data)));
      profileCharts.forEach(c => c.destroy()); profileCharts = [];
      const labels = history.map(h => h.edition), placements = history.map(h => h.placement), cumulative = []; let running = 0; history.forEach(h => {running += h.points; cumulative.push(running)});
      const options = {responsive: true, maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {x: {ticks: {color: '#8a8a94'}, grid: {color: '#1c1c22'}}, y: {ticks: {color: '#8a8a94'}, grid: {color: '#1c1c22'}}}};
      profileCharts.push(new Chart(document.getElementById('chartPlacement'), {type: 'line', data: {labels, datasets: [{data: placements, borderColor: color, backgroundColor: color + '33', tension: .3, pointRadius: 3}]}, options: {...options, scales: {...options.scales, y: {...options.scales.y, reverse: true, title: {display: true, text: 'Placement (lower is better)', color: '#8a8a94'}}}}}));
      profileCharts.push(new Chart(document.getElementById('chartCumulative'), {type: 'line', data: {labels, datasets: [{data: cumulative, borderColor: color, backgroundColor: color + '33', fill: true, tension: .3, pointRadius: 3}]}, options}));
    }
    function renderHistory(seasonKey = 's2') {
      main.innerHTML = `<div class="loader"><div class="spinner"></div> Loading ${seasonKey === 's1' ? 'Season 1' : S2L()} editions…</div>`;
      const dataPromise = seasonKey === 's1' ? loadSeason1() : Promise.resolve(RAW);
      dataPromise.then(data => {
        const editionsDesc = [...data.editions].reverse();
        const seasonLabel = seasonKey === 's1' ? 'Season 1' : S2L();
        main.innerHTML = `
    <section>
      <div class="history-header"><div class="compact-page-heading" style="margin:0"><h1>Competition history</h1><p>Browse every SpeedTAS edition and its full results.</p></div><span class="history-count">${seasonLabel} · ${data.editions.length} editions</span></div>
      ${seasonTabs(seasonKey, 'history')}
      <div class="history-grid">
        ${editionsDesc.map((ed, i) => {
          const entries = Object.entries(ed.results).sort((a, b) => a[1] - b[1]);
          const winner = entries.find(e => e[1] === 1);
          const podiumCount = entries.filter(([, place]) => place <= 3).length;
          return `
          <a href="#/edition/${seasonKey}/${encodeURIComponent(ed.edition)}">
            <div class="history-card" style="animation-delay:${i * 0.015}s">
              <div class="history-card-top"><span>${i === 0 ? 'Latest result' : seasonLabel}</span><span>↗</span></div>
              <div class="history-edition">Edition ${ed.edition}</div>
              <div class="history-winner">${winner ? avatarHTML(winner[0], 30) : ''}<div><div class="history-winner-label">🏆 Winner</div><div class="history-winner-name">${winner ? winner[0] : 'Result pending'}</div></div></div>
              <div class="history-stats"><span>Racers<b>${entries.length}</b></span><span>Podium spots<b>${podiumCount}</b></span></div>
              ${seasonKey !== 's1' ? `<div class="history-event" data-edition="${escapeHtml(ed.edition)}"></div>` : ''}<span class="history-open">View results →</span>
            </div>
          </a>`;
        }).join('')}
      </div>
    </section>
  `;
        main.querySelectorAll('[data-history-season]').forEach(btn => btn.addEventListener('click', () => renderHistory(btn.dataset.historySeason)));
        if (seasonKey !== 's1') loadEventIndex(GAME, fillHistoryEventLinks);
      }).catch(err => {main.innerHTML = `<div class="panel"><h2 class="section-title">Season 1 unavailable</h2><p style="color:var(--muted)">${err.message}</p></div>`;});
    }

    function renderEditionDetail(editionId, seasonKey = 's2', data = RAW) {
      if (seasonKey === 's1' && data === RAW) {main.innerHTML = `<div class="loader"><div class="spinner"></div> Loading Season 1 edition…</div>`; loadSeason1().then(s1 => renderEditionDetail(editionId, 's1', s1)).catch(err => {main.innerHTML = `<div class="panel"><h2 class="section-title">Season 1 unavailable</h2><p style="color:var(--muted)">${err.message}</p></div>`;}); return;}
      const decoded = decodeURIComponent(editionId);
      const ed = data.editions.find(e => String(e.edition) === decoded);
      if (!ed) {main.innerHTML = `<div class="empty-state">Edition ${decoded} not found.</div>`; return;}
      const entries = Object.entries(ed.results).sort((a, b) => a[1] - b[1]);
      const podium = entries.filter(([, place]) => place <= 3).slice(0, 3);
      main.innerHTML = `
    <div class="breadcrumb"><a href="#/history">History</a> / ${seasonKey === 's1' ? 'Season 1' : S2L()} / Edition ${ed.edition}</div>
    <div class="race-header"><div class="race-heading"><div class="race-edition-mark">#${ed.edition}</div><div><h1>${seasonKey === 's1' ? 'Season 1' : S2L()} · Edition ${ed.edition}</h1><p>${entries.length} racers competed in this edition</p></div></div><div style="display:flex;gap:8px;flex-wrap:wrap">${seasonKey !== 's1' ? `<a class="filter-btn" id="eventLink" data-edition="${escapeHtml(ed.edition)}" target="_blank" rel="noopener" style="display:none">TAS Exchange ↗</a>` : ''}<a class="filter-btn" href="#/history">← All editions</a></div></div>
    <div class="race-podium">${[1, 2, 3].map(place => {const finisher = podium.find(([, p]) => p === place); const label = ['🥇 First place', '🥈 Second place', '🥉 Third place'][place - 1]; const cls = ['gold', 'silver', 'bronze'][place - 1]; return `<div class="race-podium-place ${cls}"><div class="race-place-label">${label}</div><div class="race-podium-player">${finisher ? avatarHTML(finisher[0], 34) : ''}<span>${finisher ? finisher[0] : '—'}</span></div><div class="race-podium-points">${finisher ? pointsFor(place) + ' points' : 'No result'}</div></div>`;}).join('')}</div>
    <div class="panel results-panel"><div class="results-panel-head"><b>Full results</b><span>Placement points awarded</span></div>
      <table class="results-table no-times">
        <thead><tr><th>Placement</th><th>Player</th><th>Points</th><th class="time-th">Time</th></tr></thead>
        <tbody>
          ${entries.map(([name, place], i) => `
            <tr class="row-anim" style="animation-delay:${i * 0.02}s">
              <td>${place <= 3 ? medalFor(place) : ''}${place}</td>
              <td><a href="#/player/${seasonKey}/${encodeURIComponent(name)}"><div class="player-cell">${avatarHTML(name)}<b>${name}</b></div></a></td>
              <td style="color:var(--accent);font-weight:700;">${pointsFor(place)}</td>
              <td class="time-cell" data-player="${escapeHtml(name)}"></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
      attachEditionEvent(ed, seasonKey);
    }

    /* ============ RENDER: VERSUS ============ */
    function h2hAvatarHTML(name, color) {
      const photo = getAvatarOverride(name);
      if (photo) return `<img src="${photo}" alt="${name}" class="h2h-avatar-big" style="object-fit:cover;--glow:${color};">`;
      return `<div class="h2h-avatar-big" style="background:${color};--glow:${color};">${initials(name)}</div>`;
    }

    function combinedSeasonData(s1) {
      const preferred = {}, players = [];
      [...s1.players, ...RAW.players].forEach(name => {const key = playerKey(name); preferred[key] = name;});
      Object.values(preferred).forEach(name => players.push(name));
      const convert = (data, prefix) => data.editions.map(ed => {
        const results = {};
        Object.entries(ed.results).forEach(([name, place]) => {results[preferred[playerKey(name)]] = place;});
        return {edition: `${prefix} ${ed.edition}`, results};
      });
      return {players, editions: [...convert(s1, 'S1 ·'), ...convert(RAW, 'S2 ·')]};
    }

    function renderVersus(p1name, p2name, seasonKey = 's2', suppliedData = null) {
      if ((seasonKey === 's1' || seasonKey === 'both') && !suppliedData) {
        main.innerHTML = `<div class="loader"><div class="spinner"></div> Loading Season 1 Head-to-Head…</div>`;
        loadSeason1().then(data => renderVersus(p1name, p2name, seasonKey, data)).catch(err => {main.innerHTML = `<div class="panel"><h2 class="section-title">Season 1 unavailable</h2><p style="color:var(--muted)">${err.message}</p></div>`;});
        return;
      }
      const activeData = seasonKey === 'both' ? combinedSeasonData(suppliedData) : (suppliedData || RAW);
      const {players, ranked} = computeAll(activeData);
      const names = ranked.map(p => p.name);
      const a = p1name || names[0];
      const b = p2name || names[1] || names[0];

      main.innerHTML = `
    <section>
      <div class="compact-page-heading"><h1>Head-to-head</h1><p>Choose two racers and compare their shared editions, form, and results.</p></div>
      <div class="versus-controls"><div class="season-picker"><button data-h2h-season="s2" class="${seasonKey === 's2' ? 'active' : ''}">${S2L()}</button><button data-h2h-season="s1" class="${seasonKey === 's1' ? 'active' : ''}">Season 1</button><button data-h2h-season="both" class="${seasonKey === 'both' ? 'active' : ''}">Both</button></div><div class="versus-selectors"><select id="selA">${names.map(n => `<option value="${n}" ${n === a ? 'selected' : ''}>${n}</option>`).join('')}</select><span class="versus-vs">VS</span><select id="selB">${names.map(n => `<option value="${n}" ${n === b ? 'selected' : ''}>${n}</option>`).join('')}</select><button class="h2h-swap" id="swapH2H" type="button">⇄</button></div></div>
      <div id="versusResult"></div>
    </section>
  `;

      function fmtPct(x) {return (x * 100).toFixed(0) + '%';}
      function fmtNum(x, d = 0) {return (x === null || x === undefined || isNaN(x)) ? '—' : x.toFixed(d);}

      /* Renders one comparison row. higherIsBetter: true = bigger number wins,
         false = smaller number wins, null = purely informational (no highlight). */
      function statRow(label, rawA, rawB, displayA, displayB, higherIsBetter, colorA, colorB) {
        let aWins = false, bWins = false;
        if (higherIsBetter !== null && rawA !== null && rawB !== null && !isNaN(rawA) && !isNaN(rawB) && rawA !== rawB) {
          if (higherIsBetter) {aWins = rawA > rawB; bWins = rawB > rawA;}
          else {aWins = rawA < rawB; bWins = rawB < rawA;}
        }
        const leftHTML = aWins ? `<span class="h2h-pill" style="background:${colorA}">${displayA}</span>` : displayA;
        const rightHTML = bWins ? `<span class="h2h-pill" style="background:${colorB}">${displayB}</span>` : displayB;
        return `
      <div class="h2h-row">
        <div class="h2h-val side-left">${leftHTML}</div>
        <div class="h2h-label">${label}</div>
        <div class="h2h-val side-right">${rightHTML}</div>
      </div>`;
      }

      function draw() {
        const pa = players[document.getElementById('selA').value];
        const pb = players[document.getElementById('selB').value];
        const colorA = colorForName(pa.name), colorB = colorForName(pb.name);

        const commonEditions = pa.history.filter(h => pb.history.find(h2 => h2.edition === h.edition));
        let aH2H = 0, bH2H = 0, ties = 0;
        commonEditions.forEach(h => {
          const other = pb.history.find(h2 => h2.edition === h.edition);
          if (h.placement < other.placement) aH2H++;
          else if (h.placement > other.placement) bH2H++;
          else ties++;
        });
        const recentMatchups = commonEditions.map(h => {
          const other = pb.history.find(h2 => h2.edition === h.edition);
          const result = h.placement < other.placement ? 'A' : h.placement > other.placement ? 'B' : 'T';
          return {edition: h.edition, a: h.placement, b: other.placement, result};
        }).sort((x, y) => Number(y.edition) - Number(x.edition)).slice(0, 8);
        const avgA = commonEditions.length ? commonEditions.reduce((sum, h) => sum + h.placement, 0) / commonEditions.length : null;
        const avgB = commonEditions.length ? commonEditions.reduce((sum, h) => sum + (pb.history.find(h2 => h2.edition === h.edition)?.placement || 0), 0) / commonEditions.length : null;
        const avgGap = commonEditions.length ? (commonEditions.reduce((sum, h) => sum + Math.abs(h.placement - (pb.history.find(h2 => h2.edition === h.edition)?.placement || h.placement)), 0) / commonEditions.length).toFixed(1) : '—';

        const rows = [
          statRow('Current Rank', pa.rank ?? null, pb.rank ?? null, pa.rank ? ('#' + pa.rank) : '—', pb.rank ? ('#' + pb.rank) : '—', false, colorA, colorB),
          statRow('Head-to-Head Wins', aH2H, bH2H, aH2H, bH2H, true, colorA, colorB),
          statRow('Total Points', pa.points, pb.points, pa.points, pb.points, true, colorA, colorB),
          statRow('Avg Points / Edition', pa.avgPoints, pb.avgPoints, fmtNum(pa.avgPoints, 2), fmtNum(pb.avgPoints, 2), true, colorA, colorB),
          statRow('Wins', pa.wins, pb.wins, pa.wins, pb.wins, true, colorA, colorB),
          statRow('Podiums', pa.podiums, pb.podiums, pa.podiums, pb.podiums, true, colorA, colorB),
          statRow('Win Rate', pa.winRate, pb.winRate, fmtPct(pa.winRate), fmtPct(pb.winRate), true, colorA, colorB),
          statRow('Podium Rate', pa.podiumRate, pb.podiumRate, fmtPct(pa.podiumRate), fmtPct(pb.podiumRate), true, colorA, colorB),
          statRow('Avg Placement', pa.avgPlacement, pb.avgPlacement, fmtNum(pa.avgPlacement, 2), fmtNum(pb.avgPlacement, 2), false, colorA, colorB),
          statRow('Best Placement', pa.best, pb.best, pa.best ?? '—', pb.best ?? '—', false, colorA, colorB),
          statRow('Longest Win Streak', pa.maxWinStreak, pb.maxWinStreak, pa.maxWinStreak, pb.maxWinStreak, true, colorA, colorB),
          statRow('Longest Podium Streak', pa.maxPodiumStreak, pb.maxPodiumStreak, pa.maxPodiumStreak, pb.maxPodiumStreak, true, colorA, colorB),
          statRow('Editions Played', pa.played, pb.played, pa.played, pb.played, true, colorA, colorB),
        ].join('');

        document.getElementById('versusResult').innerHTML = `
      <div class="panel matchup-board">
        <div class="fighter-stage">
          <div class="fighter">${h2hAvatarHTML(pa.name, colorA)}<div><div class="fighter-name">${pa.name}</div><div class="fighter-sub">Rank #${pa.rank ?? '—'} · ${pa.points} pts</div></div></div>
          <div class="match-score"><div class="score">${aH2H}<span style="color:var(--muted)">–</span>${bH2H}</div><div class="caption">Head-to-head</div></div>
          <div class="fighter right"><div><div class="fighter-name">${pb.name}</div><div class="fighter-sub">Rank #${pb.rank ?? '—'} · ${pb.points} pts</div></div>${h2hAvatarHTML(pb.name, colorB)}</div>
        </div>
        <div class="match-meta"><div>Shared editions<b>${commonEditions.length}</b></div><div>Average gap<b>${avgGap}</b></div><div>Ties<b>${ties}</b></div></div>
        <div class="h2h-stats">${rows}</div>
        <div class="h2h-matchups"><div class="h2h-matchups-head"><b>Latest shared editions</b><span>${avgA !== null ? `Avg placement: ${pa.name} ${avgA.toFixed(2)} · ${pb.name} ${avgB.toFixed(2)}` : 'No shared editions yet'}</span></div>${recentMatchups.length ? `<div style="overflow:auto;"><table><thead><tr><th>Edition</th><th>${pa.name}</th><th>${pb.name}</th><th>Edge</th></tr></thead><tbody>${recentMatchups.map(m => `<tr><td>${m.edition}</td><td>${m.a}</td><td>${m.b}</td><td style="color:${m.result === 'A' ? colorA : m.result === 'B' ? colorB : 'var(--muted)'};font-weight:700">${m.result === 'A' ? pa.name : m.result === 'B' ? pb.name : 'Tie'}</td></tr>`).join('')}</tbody></table></div>` : '<div style="color:var(--muted);font-size:13px;">These players have not raced the same edition yet.</div>'}</div>
      </div>
    `;
      }
      document.getElementById('selA').addEventListener('change', draw);
      document.getElementById('selB').addEventListener('change', draw);
      main.querySelectorAll('[data-h2h-season]').forEach(btn => btn.addEventListener('click', () => renderVersus(undefined, undefined, btn.dataset.h2hSeason, suppliedData)));
      document.getElementById('swapH2H').addEventListener('click', () => {
        const selA = document.getElementById('selA'), selB = document.getElementById('selB');
        const oldA = selA.value; selA.value = selB.value; selB.value = oldA; draw();
      });
      draw();
    }

    /* ============ RECORDS & RIVALRIES ============ */
    function seasonSource(key) {
      if (key === 's2') return Promise.resolve(RAW);
      return loadSeason1().then(s1 => key === 'both' ? combinedSeasonData(s1) : s1);
    }

    function recordDefinitions(ranked) {
      const eligible = ranked.filter(p => p.played > 0);
      /* Everyone who shares the best value (ties included). zeroIsNothing: a best of 0 is not a record. */
      const top = (field, direction = 'desc', minPlayed = 0, zeroIsNothing = true) => {
        const list = eligible.filter(p => p.played >= minPlayed && p[field] != null);
        if (!list.length) return [];
        const best = list.reduce((m, p) => direction === 'asc' ? Math.min(m, p[field]) : Math.max(m, p[field]), direction === 'asc' ? Infinity : -Infinity);
        if (zeroIsNothing && best <= 0) return [];
        return list.filter(p => Math.abs(p[field] - best) < 1e-9);
      };
      const rec = (icon, label, field, holders, value, note) => ({icon, label, field, holders, player: holders[0], value, note});
      return [
        rec('🏆', 'Most wins', 'wins', top('wins'), p => p.wins + (p.wins === 1 ? ' win' : ' wins'), 'Race victories this season'),
        rec('🔥', 'Longest win streak', 'maxWinStreak', top('maxWinStreak'), p => p.maxWinStreak + ' in a row', 'Consecutive editions won'),
        rec('✨', 'Longest podium streak', 'maxPodiumStreak', top('maxPodiumStreak'), p => p.maxPodiumStreak + ' in a row', 'Consecutive top-three finishes'),
        rec('🥉', 'Most podiums', 'podiums', top('podiums'), p => p.podiums + (p.podiums === 1 ? ' podium' : ' podiums'), 'Top-three finishes'),
        rec('🎯', 'Best average placement', 'avgPlacement', top('avgPlacement', 'asc', 3, false), p => p.avgPlacement.toFixed(2), 'Minimum 3 editions played · lower is better'),
        rec('⚡', 'Highest win rate', 'winRate', top('winRate', 'desc', 3), p => Math.round(p.winRate * 100) + '%', 'Minimum 3 editions played'),
        rec('📈', 'Most points', 'points', top('points'), p => p.points + ' pts', 'Total points earned'),
        rec('🎮', 'Most appearances', 'played', top('played'), p => p.played + ' editions', 'Most races entered')
      ].concat(GAME === 'tm20' ? [
        rec('🔟', 'Most top-10 finishes', 'top10', top('top10'), p => p.top10 + (p.top10 === 1 ? ' finish' : ' finishes'), 'Scoring positions (1st-10th)'),
        rec('🧱', 'Longest top-10 streak', 'maxTop10Streak', top('maxTop10Streak'), p => p.maxTop10Streak + ' in a row', 'Consecutive editions in the top 10')
      ] : []);
    }

    function recordCard(record) {
      const holders = record.holders || (record.player ? [record.player] : []);
      const head = `<div class="record-icon">${record.icon}</div><div class="record-label">${record.label}</div>`;
      if (!holders.length) return `<div class="record-card">${head}<div class="record-value">—</div><div class="record-note">Not enough results yet</div></div>`;
      const p = holders[0];
      if (holders.length === 1) {
        return `<a class="record-card" href="#/player/${encodeURIComponent(p.name)}">${head}<div class="record-value">${record.value(p)}</div><div class="record-holder">${avatarHTML(p.name, 28)} <span>${p.name}</span></div><div class="record-note">${record.note}</div></a>`;
      }
      const MAX = 6;
      const chips = holders.slice(0, MAX).map(h => `<a class="record-chip" href="#/player/${encodeURIComponent(h.name)}">${avatarHTML(h.name, 24)}<span>${escapeHtml(h.name)}</span></a>`).join('');
      const more = holders.length > MAX ? `<span class="record-chip more">+${holders.length - MAX} more</span>` : '';
      return `<div class="record-card shared">${head}<div class="record-value">${record.value(p)}</div><div class="record-shared-badge">🤝 Shared record · ${holders.length} players</div><div class="record-holders">${chips}${more}</div><div class="record-note">${record.note}</div></div>`;
    }

    function renderRecords(season = 's2') {
      main.innerHTML = `<div class="compact-page-heading"><h1>Records</h1><p>Season leaders for wins, consistency, streaks, and more.</p></div><div class="toolbar"><span class="toolbar-label">Season</span><div class="season-picker"><button data-record-season="s2" class="${season === 's2' ? 'active' : ''}">${S2L()}</button><button data-record-season="s1" class="${season === 's1' ? 'active' : ''}">Season 1</button><button data-record-season="both" class="${season === 'both' ? 'active' : ''}">Both</button></div></div><div id="recordContent" class="record-grid"><div class="loader"><div class="spinner"></div> Opening the record book…</div></div>`;
      main.querySelectorAll('[data-record-season]').forEach(b => b.addEventListener('click', () => renderRecords(b.dataset.recordSeason)));
      seasonSource(season).then(data => {
        const host = document.getElementById('recordContent'); if (!host) return;
        host.innerHTML = recordDefinitions(computeAll(data).ranked).map(recordCard).join('');

    function rivalryRows(data, minShared = 3) {
      const pairs = new Map();
      data.editions.forEach(ed => {
        const entries = Object.entries(ed.results).sort((a,b) => a[0].localeCompare(b[0]));
        for (let i = 0; i < entries.length; i++) for (let j = i + 1; j < entries.length; j++) {
          const [a, pa] = entries[i], [b, pb] = entries[j], key = a + '\u0000' + b;
          if (!pairs.has(key)) pairs.set(key, {a,b,aWins:0,bWins:0,ties:0,shared:0,totalGap:0});
          const r = pairs.get(key); r.shared++; r.totalGap += Math.abs(pa - pb);
          if (pa < pb) r.aWins++; else if (pb < pa) r.bWins++; else r.ties++;
        }
      });
      return [...pairs.values()].filter(r => r.shared >= minShared).map(r => ({...r, avgGap:r.totalGap / r.shared, balance:Math.abs(r.aWins - r.bWins)})).sort((x,y) => x.balance - y.balance || y.shared - x.shared || x.avgGap - y.avgGap);
    }

    function renderRivalries(season = 's2', minShared = 3, selectedPlayer = '') {

      }).catch(err => { const host = document.getElementById('rivalryContent'); if (host) host.innerHTML = `<div class="empty-state">Couldn’t load this season’s rivalries.<br><small>${escapeHtml(err.message)}</small></div>`; });

    const YT_CHANNEL_ID = 'UCSLm9iD-GUV_HhMEc1ee3tA';

    const YT_CACHE_TTL_MS = 30 * 60 * 1000; // 30 min — avoids re-fetching on every tab visit

    function getCachedVideos() {
      try {
        const raw = localStorage.getItem(YT_CACHE_KEY);
        if (!raw) return null;

        return parsed.videos;

          const proxyUrl = SPEEDTAS_API_URL.replace(/\/+$/, '') + '/videos?channelId=' + encodeURIComponent(YT_CHANNEL_ID);
          const res = await fetch(proxyUrl);
          const data = await res.json();
          if (res.ok && Array.isArray(data.videos)) return data.videos;
          console.warn('Worker video proxy returned an error, falling back to the RSS feed:', data.error);
        } catch (err) {
          console.warn('Worker video proxy unreachable, falling back to the RSS feed:', err);
        }

      const res = await fetch(YT_RSS2JSON_URL);

      if (data.status !== 'ok' || !Array.isArray(data.items)) {
        throw new Error(data.message || 'Could not read the channel feed.');
      }

    /* ============ SEASON COMPARISON ============ */
    /* Different spellings of the same person -> one identity key. Left side = the spelling with
       everything except letters/digits removed and lowercased. Add new ones here. */
    const PLAYER_ALIASES = {
      lildemo: 'demo', caster: 'c4ster', elliot: 'eliot',
      elliott: 'eliot', qqkewkew: 'qq', midnighteuphoria: 'midnight'
    };
    /* A trailing "(late upload)" etc. from TAS Exchange entrant names is not part of the name. */
    const stripNote = name => String(name == null ? '' : name).replace(/\s*\([^)]*\)\s*$/, '').trim();
    const playerKey = name => {
      const base = stripNote(name).toLowerCase().replace(/[^a-z0-9]/g, '');
      return PLAYER_ALIASES[base] || base;
    };
    /* Preferred spelling shown for a merged player in TM2020 when the TMNF data doesn't already settle it. */
    const TM20_DISPLAY_NAMES = {eliot: 'Elliot', qq: 'QQ', vogtek: 'Vogtek', midnight: 'Midnight'};
    function canonicalizeDataset(d) {
      const known = {};
      const addKnown = list => (list || []).forEach(n => {const k = playerKey(n); if (!known[k]) known[k] = n;});
      const tmnf = GAME === 'tmnf' ? RAW : DATA.tmnf;
      if (tmnf) addKnown(tmnf.players);
      if (typeof SEASON_1 !== 'undefined' && SEASON_1) addKnown(SEASON_1.players);
      const display = {};
      const nameFor = n => {
        const k = playerKey(n);
        if (!display[k]) display[k] = TM20_DISPLAY_NAMES[k] || known[k] || stripNote(n);
        return display[k];
      };
      const players = [];
      (d.players || []).forEach(n => {const c = nameFor(n); if (!players.includes(c)) players.push(c);});
      const editions = (d.editions || []).map(e => {
        const results = {};
        Object.entries(e.results).forEach(([n, place]) => {const c = nameFor(n); if (results[c] == null || place < results[c]) results[c] = place;});
        return {...e, results};
      });
      return {editions, players};
    }
    function discordIdFor(name) {
      const key = playerKey(name);
      if (DISCORD_IDS[key]) return DISCORD_IDS[key];
      // Keep avatar matching consistent with the S1↔S2 identity rule for a
      // one-character rename, while avoiding a match when it is ambiguous.
      const close = Object.keys(DISCORD_IDS).filter(candidate => oneLetterApart(candidate, key));
      return close.length === 1 ? DISCORD_IDS[close[0]] : null;
    }
    function oneLetterApart(a, b) {
      if (a === b) return true;
      if (Math.abs(a.length - b.length) > 1) return false;
      let i = 0, j = 0, edits = 0;
      while (i < a.length && j < b.length) {if (a[i] === b[j]) {i++; j++;} else if (++edits > 1) return false; else if (a.length > b.length) i++; else if (b.length > a.length) j++; else {i++; j++;} }
      return true;
    }
    function seasonStats(data) {return computeAll(data).ranked;}
    function rankMap(ranked, knownKeys = []) {const map = {}; ranked.forEach((p, i) => {let key = playerKey(p.name); if (!knownKeys.includes(key)) {const close = knownKeys.find(k => oneLetterApart(k, key)); if (close) key = close;} map[key] = {...p, rank: i + 1};}); return map;}
    function statCard(label, value, sub = '') {return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;}
    function comparisonRows(s1Ranked, s2Ranked) {
      const a = rankMap(s1Ranked), b = rankMap(s2Ranked, Object.keys(a)), keys = [...new Set([...Object.keys(a), ...Object.keys(b)])];
      return keys.map(k => {
        const x = a[k], y = b[k];
        return {
          key: k, name: (y || x).name, s1: x, s2: y, delta: x && y ? x.rank - y.rank : null,
          total: (x ? x.points : 0) + (y ? y.points : 0), played: (x ? x.played : 0) + (y ? y.played : 0),
          wins: (x ? x.wins : 0) + (y ? y.wins : 0), podiums: (x ? x.podiums : 0) + (y ? y.podiums : 0)
        };
      }).sort((x, y) => y.total - x.total || y.played - x.played);
    }
    function metric(p, key, fallback = '—') {return p ? (key === 'avgPlacement' ? p[key].toFixed(2) : p[key]) : fallback;}
    const COMPARISON_COLUMNS = [
      ['name', 'Player'], ['s1Rank', 'S1 rank'], ['s1Points', 'S1 pts'], ['s1Played', 'S1 played'],
      ['s2Rank', 'S2 rank'], ['s2Points', 'S2 pts'], ['s2Played', 'S2 played'], ['delta', 'Rank change']
    ];
    function comparisonValue(row, key) {
      if (key === 'name') return row.name.toLowerCase();
      if (key === 's1Rank') return row.s1?.rank;
      if (key === 's1Points') return row.s1?.points;
      if (key === 's1Played') return row.s1?.played;
      if (key === 's2Rank') return row.s2?.rank;
      if (key === 's2Points') return row.s2?.points;
      if (key === 's2Played') return row.s2?.played;
      return row.delta;
    }
    function renderComparisonTable(rows) {
      const host = document.getElementById('comparisonTable');
      let state = {key: 's2Rank', dir: 'asc'};
      const cell = (r, key) => {
        if (key === 'name') return `<b class="player-name">${r.name}</b>`;
        if (key === 's1Rank') return r.s1 ? '#' + r.s1.rank : '—';
        if (key === 's1Points') return metric(r.s1, 'points');
        if (key === 's1Played') return metric(r.s1, 'played');
        if (key === 's2Rank') return r.s2 ? '#' + r.s2.rank : '—';
        if (key === 's2Points') return metric(r.s2, 'points');
        if (key === 's2Played') return metric(r.s2, 'played');
        return `<span style="color:${r.delta > 0 ? 'var(--accent)' : r.delta < 0 ? '#fb5959' : 'var(--muted)'}">${r.delta === null ? '—' : r.delta > 0 ? '▲ ' + r.delta : r.delta < 0 ? '▼ ' + Math.abs(r.delta) : '—'}</span>`;
      };
      function draw() {
        const sorted = [...rows].sort((a, b) => {
          const av = comparisonValue(a, state.key), bv = comparisonValue(b, state.key);

    function renderSeasonCompare() {

      <section><div class="season-intro"><h2 class="section-title">Season 1 ↔ Season 2</h2><p>Two seasons, one evolving field. Compare player results, participation and rank movement side by side.</p></div>
      <div class="compare-spotlight"><div class="compare-spotlight-card"><div class="kicker">Season leaders</div><b><strong>S1</strong> ${s1Leader?.name || '—'} <span style="color:var(--muted);font-size:13px;font-weight:500">${s1Leader?.points || 0} pts</span></b><b><strong>S2</strong> ${s2Leader?.name || '—'} <span style="color:var(--muted);font-size:13px;font-weight:500">${s2Leader?.points || 0} pts</span></b></div><div class="compare-spotlight-card compact"><div class="kicker">Returning</div><b>${shared.length}</b><span style="color:var(--muted);font-size:12px">players raced both</span></div></div>
      <div class="grid cards">${statCard('Season 1', s1.editions.length, `editions · ${s1.players.length} registered players`)}${statCard(S2L(), s2.editions.length, `editions · ${two.length} active players`)}${statCard('Biggest rank gain', biggest ? biggest.name : '—', biggest ? `▲ ${biggest.delta} · #${biggest.s1.rank} → #${biggest.s2.rank}` : 'No matched players')}</div></section>
      <section class="panel"><h2 class="section-title">Player comparison</h2><p class="compare-hint">↑ Ascending · ↓ Descending · blank entries always remain at the bottom.</p><div id="comparisonTable"></div></section>`;
        renderComparisonTable(rows);
      }).catch(err => {main.innerHTML = `<div class="panel"><h2 class="section-title">Season 1 unavailable</h2><p style="color:var(--muted)">${err.message} Check that the Season 1 sheet remains published as CSV.</p></div>`;});
    }
    function renderAllTime() {
      main.innerHTML = `<div class="loader"><div class="spinner"></div> Building all-time standings…</div>`;
      loadSeason1().then(s1 => {
        const s1Ranked = seasonStats(s1), s2Ranked = seasonStats(RAW), rows = comparisonRows(s1Ranked, s2Ranked), s1Board = s1Ranked.slice(0, 25), s2Board = s2Ranked.slice(0, 25);
        const mixedBoard = rows.map(r => ({name: r.name, points: r.total, played: r.played, wins: r.wins, podiums: r.podiums})).sort((a, b) => b.points - a.points || b.wins - a.wins).slice(0, 25);
        const table = (board, label) => `<section class="panel"><h2 class="section-title">${label}</h2><div style="overflow:auto"><table class="data-table"><thead><tr><th>#</th><th>Player</th><th>Points</th><th>Played</th><th>Wins</th><th>Podiums</th></tr></thead><tbody>${board.map((p, i) => `<tr><td>${i + 1}</td><td><b>${escapeHtml(p.name)}</b></td><td style="color:var(--accent);font-weight:800">${p.points}</td><td>${p.played}</td><td>${p.wins}</td><td>${p.podiums}</td></tr>`).join('')}</tbody></table></div></section>`;
        main.innerHTML = `<section><h2 class="section-title">Season standings</h2><p style="color:var(--muted);margin:-4px 0 18px;">Season leaderboards remain separate. The all-time table adds both seasons after alias and one-letter name matching.</p><div class="grid cards">${statCard('Season 1', s1.editions.length, 'editions')}${statCard(S2L(), RAW.editions.length, 'editions')}${statCard('Players in both', rows.filter(r => r.s1 && r.s2).length, 'after alias matching')}</div></section><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));">${table(s1Board, 'Season 1 leaderboard')}${table(s2Board, 'Season 2 leaderboard')}${table(mixedBoard, 'All-time overall')}</div>`;
      }).catch(err => {main.innerHTML = `<div class="panel"><h2 class="section-title">All-time view unavailable</h2><p style="color:var(--muted)">${err.message}</p></div>`;});
    }



    /* Wrapper keeps the nav's aria-current in step with its .active class after every route render */
    function render() {
      renderRoute();
      document.querySelectorAll('#nav a').forEach(a => {
        if (a.classList.contains('active')) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
      });
    }
    function renderRoute() {
      document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
      const route = currentRoute();
      if (ROUTE_GAME === 'tm20' && !DATA.tm20) {
        applyTheme('tm20');
        main.innerHTML = `<div class="loader"><div class="spinner"></div> Loading TM2020 data...</div>`;
        loadTM20().then(() => render()).catch(err => {
          main.innerHTML = `<div class="panel" style="max-width:640px;margin:20px auto;"><h2 class="section-title">TM2020 data unavailable</h2><p style="color:var(--muted)">${escapeHtml(err.message)}</p><button class="refresh-btn" id="tm20Retry">↻ Try again</button></div>`;
          document.getElementById('tm20Retry').addEventListener('click', () => render());
        });
        return;
      }
      setGame(ROUTE_GAME);
      if (GAME === 'tm20') {
        if (['season-compare', 'all-time', 'videos'].includes(route[0])) {location.hash = '#/tm20'; return;}
        if (!RAW.editions.length) {
          const active = document.querySelector(`nav a[data-route="/${route[0] || ''}"]`); if (active) active.classList.add('active');
          main.innerHTML = `<div class="empty-state" style="padding:60px 20px;"><div style="font-size:42px;margin-bottom:10px">🏁</div><b style="font-size:18px;color:var(--text)">No TM2020 results yet</b><br>The first edition will appear here as soon as results are added to the TM2020 sheet.</div>`;
          return;
        }
      }
      if (route.length === 0) {
        document.querySelector('nav a[data-route="/"]').classList.add('active');
        renderHome();
      } else if (route[0] === 'players') {
        document.querySelector('nav a[data-route="/players"]').classList.add('active');
        renderPlayers();
      } else if (route[0] === 'player' && route[1]) {
        if ((route[1] === 's1' || route[1] === 's2' || route[1] === 'all') && route[2]) renderPlayerProfileEnhanced(route[2], route[1]);
        else renderPlayerProfileEnhanced(route[1]);
      } else if (route[0] === 'history') {
        document.querySelector('nav a[data-route="/history"]').classList.add('active');
        renderHistory();
      } else if (route[0] === 'records') {
        document.querySelector('nav a[data-route="/records"]').classList.add('active');
        renderRecords();
      } else if (route[0] === 'rivalries') {
        document.querySelector('nav a[data-route="/rivalries"]').classList.add('active');
        renderRivalries();
      } else if (route[0] === 'season-compare') {
        document.querySelector('nav a[data-route="/season-compare"]').classList.add('active');
        renderSeasonCompare();
      } else if (route[0] === 'all-time') {
        document.querySelector('nav a[data-route="/all-time"]').classList.add('active');
        renderAllTime();
      } else if (route[0] === 'edition' && route[1]) {
        if ((route[1] === 's1' || route[1] === 's2') && route[2]) renderEditionDetail(route[2], route[1]);
        else renderEditionDetail(route[1]);
      } else if (route[0] === 'versus') {
        document.querySelector('nav a[data-route="/versus"]').classList.add('active');
        if ((route[1] === 's1' || route[1] === 's2' || route[1] === 'both') && route[2] && route[3]) renderVersus(route[2], route[3], route[1]);
        else renderVersus(route[1], route[2]);
      } else if (route[0] === 'videos') {
        document.querySelector('nav a[data-route="/videos"]').classList.add('active');
        renderVideos();
      } else {
        renderHome();
      }
    }

    /* ============ GLOBAL SEARCH ============ */
    const searchInput = document.getElementById('globalSearch');
    const searchResults = document.getElementById('searchResults');
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      if (!q || !RAW) {searchResults.style.display = 'none'; return;}

      // SEASON_1 may not have finished its background preload yet - search
      // just covers Season 2 until it has, then quietly starts covering both.
      const s2Keys = new Set(RAW.players.map(playerKey));
      const s1Keys = SEASON_1 && GAME !== 'tm20' ? new Set(SEASON_1.players.map(playerKey)) : new Set();
      const nameByKey = {};
      RAW.players.forEach(n => nameByKey[playerKey(n)] = n);
      if (SEASON_1 && GAME !== 'tm20') SEASON_1.players.forEach(n => {if (!(playerKey(n) in nameByKey)) nameByKey[playerKey(n)] = n;});

      const playerMatches = [...new Set([...s2Keys, ...s1Keys])]
        .map(k => nameByKey[k])
        .filter(n => n.toLowerCase().includes(q))
        .slice(0, 6);

      const editionMatches = [
        ...RAW.editions.filter(e => String(e.edition).toLowerCase().includes(q)).map(e => ({edition: e.edition, season: 's2'})),
        ...(SEASON_1 && GAME !== 'tm20' ? SEASON_1.editions.filter(e => String(e.edition).toLowerCase().includes(q)).map(e => ({edition: e.edition, season: 's1'})) : [])
      ].slice(0, 4);

      const items = [
        ...playerMatches.map(n => {
          const key = playerKey(n);
          const season = s2Keys.has(key) && s1Keys.has(key) ? 'all' : (s1Keys.has(key) ? 's1' : 's2');
          return {label: `Player · ${n}`, href: `${GAME === 'tm20' ? '#/tm20' : '#'}/player/${season}/${encodeURIComponent(n)}`};
        }),
        ...editionMatches.map(e => ({label: `Edition ${e.edition} (${e.season === 's1' ? 'S1' : (GAME === 'tm20' ? 'TM20' : 'S2')})`, href: `${GAME === 'tm20' ? '#/tm20' : '#'}/edition/${e.season}/${encodeURIComponent(e.edition)}`}))
      ];
      if (!items.length) {searchResults.style.display = 'none'; return;}
      // Real links: keyboard reachable (Tab / Enter), open with the normal hash navigation
      searchResults.innerHTML = items.map(it => `<a href="${it.href}">${escapeHtml(it.label)}</a>`).join('');
      searchResults.style.display = 'block';
      searchResults.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', () => {searchResults.style.display = 'none'; searchInput.value = '';});
      });
    });
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Escape') {searchResults.style.display = 'none';}
      else if (e.key === 'ArrowDown') {const first = searchResults.querySelector('a'); if (first && searchResults.style.display !== 'none') {e.preventDefault(); first.focus();}}
    });
    searchResults.addEventListener('keydown', e => {
      const links = [...searchResults.querySelectorAll('a')], i = links.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' && i < links.length - 1) {e.preventDefault(); links[i + 1].focus();}
      else if (e.key === 'ArrowUp') {e.preventDefault(); (i > 0 ? links[i - 1] : searchInput).focus();}
      else if (e.key === 'Escape') {searchResults.style.display = 'none'; searchInput.focus();}
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.search-wrap')) searchResults.style.display = 'none';
    });

    /* ============ REFRESH ============ */
    document.getElementById('refreshBtn').addEventListener('click', init);

    /* ============ DATA SOURCE STATUS BANNER ============ */
    let dataSourceStatus = 'live'; // 'live' | 'fallback' | 'manual'

    function renderStatusBanner() {
      const existing = document.getElementById('statusBanner');
      if (existing) existing.remove();
      if (dataSourceStatus === 'live') return;

      const banner = document.createElement('div');
      banner.id = 'statusBanner';
      banner.style.cssText = `
    max-width:1200px;margin:0 auto 20px;padding:12px 18px;border-radius:12px;
    background:rgba(var(--accent-rgb),.08);border:1px solid rgba(var(--accent-rgb),.3);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--text);
  `;
      const label = dataSourceStatus === 'fallback'
        ? "⚠️ Couldn't reach the live sheet — showing a saved snapshot (may be out of date)."
        : "📋 Showing manually loaded data.";
      banner.innerHTML = `
    <span>${label}</span>
    <button class="refresh-btn" id="bannerRetry" style="padding:5px 10px;">↻ Retry Live</button>
    <button class="refresh-btn" id="bannerManual" style="padding:5px 10px;">Load Newer Data</button>
    <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:html&sheet=${encodeURIComponent(SHEET_NAME)}" target="_blank" rel="noopener" style="color:var(--accent);margin-left:auto;">Check raw sheet ↗</a>
  `;
      main.parentNode.insertBefore(banner, main);
      document.getElementById('bannerRetry').addEventListener('click', init);
      document.getElementById('bannerManual').addEventListener('click', () => renderManualPanel());
    }

    function renderManualPanel() {
      main.innerHTML = `
    <div class="panel" style="max-width:640px;margin:20px auto;">
      <b style="color:var(--text);font-size:14px;">Load data manually</b>
      <p style="color:var(--muted);font-size:13px;">Select all data in the "Editions" tab and copy it (Ctrl/Cmd+C), then paste below. Or download the tab as .csv and upload it.</p>
      <textarea id="manualPaste" placeholder="Paste sheet data here..." style="width:100%;min-height:100px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px;font-size:12px;font-family:monospace;margin-bottom:10px;"></textarea>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <button class="refresh-btn" id="usePasteBtn">Use Pasted Data</button>
        <span style="color:var(--muted);font-size:12px;">or</span>
        <label class="refresh-btn" style="cursor:pointer;">
          Upload CSV File
          <input type="file" id="csvUpload" accept=".csv,.tsv,text/csv,text/tab-separated-values" style="display:none;">
        </label>
        <button class="export-btn" id="cancelManual">Cancel</button>
      </div>
      <div id="manualError" style="color:#e2585b;font-size:12px;margin-top:8px;"></div>
    </div>
  `;
      document.getElementById('cancelManual').addEventListener('click', () => {render(); renderStatusBanner();});
      document.getElementById('usePasteBtn').addEventListener('click', () => {
        const text = document.getElementById('manualPaste').value;
        const errEl = document.getElementById('manualError');
        try {
          if (!text.trim()) throw new Error('Paste some data first.');
          RAW = parseDelimitedText(text);
          dataSourceStatus = 'manual';
          render(); renderStatusBanner();
        } catch (e) {errEl.textContent = e.message;}
      });
      document.getElementById('csvUpload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            RAW = parseDelimitedText(reader.result);
            dataSourceStatus = 'manual';
            render(); renderStatusBanner();
          } catch (err2) {document.getElementById('manualError').textContent = err2.message;}
        };
        reader.onerror = () => {document.getElementById('manualError').textContent = 'Could not read file.';};
        reader.readAsText(file);
      });
    }

    /* ============ INIT ============ */
    async function init() {
      loadAvatarOverridesCache();
      prefillAvatarsFromStore();
      GAME = 'tmnf'; DATA.tm20 = null; // RAW below is always the TMNF data; TM2020 reloads on demand
      main.innerHTML = `<div class="loader"><div class="spinner"></div> Loading SpeedTAS data...</div>`;
      const existingBanner = document.getElementById('statusBanner');
      if (existingBanner) existingBanner.remove();
      try {
        RAW = await loadData();
        dataSourceStatus = 'live';
        render();
        // Progressive enhancement, not blocking: avatarHTML() already has a
        // colored-initials fallback, so there's no reason the leaderboard
        // sits on a loading spinner for the whole (deliberately sequential,
        // see fetchAvatarsInBatches) avatar fetch. Re-render whatever route
        // is current once real avatars are in.
        loadDiscordProfiles().then(() => render());
        // Also warm the Season 1 cache in the background so it's likely
        // ready by the time someone uses global search or visits a
        // Season-1-aware page - loadSeason1() already caches its own result,
        // so this costs nothing extra later.
        loadSeason1().catch(err => console.warn('Background Season 1 preload failed (will retry when a page needs it):', err));
      } catch (err) {
        console.error('Live connection failed, using fallback snapshot:', err);
        try {
          RAW = parseDelimitedText(FALLBACK_CSV_TEXT);
          dataSourceStatus = 'fallback';
          render();
          renderStatusBanner();
          loadDiscordProfiles().then(() => render()); // pictures don't depend on the sheet being live
        } catch (err2) {
          console.error(err2);
          renderManualPanel();
        }
      }
    }
    new MutationObserver(() => prefixLinks(main)).observe(main, {childList: true, subtree: true});
    init();
  </script>

</body>

</html>
