<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeedTAS Stats</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    :root {
      --accent: #e9fb59;
      --bg: #0a0a0c;
      --bg2: #121216;
      --card: #17171c;
      --card-hover: #1e1e25;
      --border: #26262e;
      --text: #f2f2f0;
      --muted: #8a8a94;
      --gold: #ffd700;
      --silver: #c8c8d0;
      --bronze: #cd7f32;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: .5;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(10, 10, 12, .85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .logo {
      font-weight: 800;
      font-size: 20px;
      letter-spacing: .5px;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(233, 251, 89, .4);
    }

    .discord-icon-link {
      color: #5865F2;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .2s;
      flex: 0 0 32px;
      line-height: 0;
      padding: 3px;
    }

    .discord-icon-link svg {
      display: block;
      width: 27px;
      height: 27px;
      aspect-ratio: 1/1;
      flex: none;
    }

    .discord-icon-link:hover {
      filter: brightness(1.3);
      transform: scale(1.12);
    }

    nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    nav a {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      transition: .2s;
    }

    nav a:hover,
    nav a.active {
      background: var(--card);
      color: var(--accent);
    }

    .search-wrap {
      margin-left: auto;
      position: relative;
      min-width: 200px;
    }

    .search-wrap input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: .2s;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(233, 251, 89, .15);
    }

    .search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      max-height: 300px;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
      z-index: 30;
    }

    .search-results div {
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
    }

    .search-results div:last-child {
      border-bottom: none;
    }

    .search-results div:hover {
      background: var(--card-hover);
      color: var(--accent);
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .cards {
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      margin-bottom: 28px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      transition: .25s;
      animation: fadeUp .5s ease both;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(233, 251, 89, .3);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
    }

    .card .label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 8px;
    }

    .card .value {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent);
    }

    .card .sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pop {
      0% {
        transform: scale(.9);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    h2.section-title {
      font-size: 18px;
      margin: 0 0 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h2.section-title::before {
      content: '';
      width: 4px;
      height: 18px;
      background: var(--accent);
      border-radius: 2px;
      display: inline-block;
    }

    section {
      margin-bottom: 34px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      text-align: left;
      padding: 10px 12px;
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .4px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th:hover {
      color: var(--accent);
    }

    th.sorted {
      color: var(--accent);
    }

    td {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      white-space: nowrap;
    }

    tr.row-anim {
      animation: fadeUp .4s ease both;
    }

    tbody tr:hover {
      background: rgba(233, 251, 89, .05);
    }

    .player-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      color: #0a0a0c;
      flex-shrink: 0;
    }

    .medal {
      font-size: 16px;
      margin-right: 4px;
    }

    .avatar-wrap {
      position: relative;
      display: inline-block;
      flex-shrink: 0;
    }

    .avatar-edit-btn {
      position: absolute;
      bottom: -2px;
      right: -2px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .4);
    }

    .avatar-edit-btn:hover {
      transform: scale(1.1);
    }

    .avatar-remove-link {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    .avatar-remove-link:hover {
      color: var(--accent);
    }

    .avatar-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeUp .2s ease both;
    }

    .avatar-modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    }

    .avatar-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .avatar-modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
    }

    .avatar-modal-close:hover {
      color: var(--accent);
    }

    .move-up {
      color: #5be27f;
    }

    .move-down {
      color: #e2585b;
    }

    .move-same {
      color: var(--muted);
    }

    .countdown {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 0%, rgba(233, 251, 89, .08), transparent 70%);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .countdown .unit {
      text-align: center;
      min-width: 70px;
    }

    .countdown .num {
      font-size: 34px;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .countdown .unit-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .countdown-title {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 6px;
    }

    .chart-box {
      position: relative;
      height: 340px;
    }

    .badge-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      animation: pop .3s ease both;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      transition: .2s;
    }

    .filter-btn:hover {
      border-color: var(--accent);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #0a0a0c;
      font-weight: 700;
      border-color: var(--accent);
    }

    .directory {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .player-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: .2s;
      animation: fadeUp .4s ease both;
    }

    .player-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
    }

    .player-card .avatar {
      width: 48px;
      height: 48px;
      font-size: 16px;
      margin: 0 auto 10px;
    }

    .player-card .pname {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .player-card .pmeta {
      font-size: 12px;
      color: var(--muted);
    }

    .edition-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .video-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: .2s;
      animation: fadeUp .4s ease both;
    }

    .video-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
    }

    .video-card.expanded {
      grid-column: 1 / -1;
      cursor: default;
      animation: none;
    }

    .video-card.expanded:hover {
      transform: none;
      border-color: var(--border);
    }

    .video-thumb-wrap {
      position: relative;
      aspect-ratio: 16/9;
      background: var(--bg2);
      overflow: hidden;
    }

    .video-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      background: rgba(0, 0, 0, .25);
      opacity: 0;
      transition: .2s;
    }

    .video-card:hover .video-play-overlay {
      opacity: 1;
      background: rgba(0, 0, 0, .4);
    }

    .video-card-title {
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-expanded-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      font-size: 14px;
    }

    .video-expanded-head b {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .video-collapse-hint {
      color: var(--muted);
      font-size: 12px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .video-collapse-hint:hover {
      color: var(--accent);
    }

    .video-watch-link {
      display: block;
      padding: 10px 16px 14px;
      color: var(--accent);
      font-size: 12px;
    }

    .edition-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: .2s;
      animation: fadeUp .4s ease both;
    }

    .edition-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
    }

    .edition-card .enum {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .edition-card .erow {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .edition-card .erow b {
      color: var(--text);
      font-weight: 600;
    }

    .breadcrumb {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .breadcrumb a:hover {
      color: var(--accent);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .profile-header .avatar {
      width: 72px;
      height: 72px;
      font-size: 26px;
    }

    .profile-header h1 {
      margin: 0;
      font-size: 26px;
    }

    .profile-header .rank-tag {
      font-size: 13px;
      color: var(--muted);
    }

    .profile-hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(120deg, rgba(233, 251, 89, .12), rgba(89, 214, 251, .06) 52%, var(--card));
      border: 1px solid rgba(233, 251, 89, .25);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 18px;
    }

    .profile-hero::after {
      content: '';
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      right: -100px;
      top: -130px;
      background: radial-gradient(circle, rgba(233, 251, 89, .15), transparent 68%);
      pointer-events: none;
    }

    .profile-hero .profile-header {
      position: relative;
      z-index: 1;
      margin-bottom: 0;
    }

    .profile-season-tabs {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .podium-banner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      padding: 12px 14px;
      background: rgba(10, 10, 12, .46);
      border: 1px solid rgba(255, 215, 0, .25);
      border-radius: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .podium-banner strong {
      display: block;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 2px;
    }

    .podium-icon {
      font-size: 24px;
      line-height: 1;
    }

    .profile-stat-emphasis .value {
      color: var(--gold);
    }

    .edition-podium-banner {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin: 0 0 18px;
    }

    .edition-podium-place {
      background: var(--card);
      padding: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    .edition-podium-place b {
      display: block;
      color: var(--text);
      font-size: 15px;
      margin: 5px 0 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .edition-podium-place.gold {
      box-shadow: inset 0 3px 0 var(--gold);
    }

    .edition-podium-place.silver {
      box-shadow: inset 0 3px 0 var(--silver);
    }

    .edition-podium-place.bronze {
      box-shadow: inset 0 3px 0 var(--bronze);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    select,
    input.h2h-select {
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
    }

    .h2h-select-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .h2h-select-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .h2h-select-side select {
      min-width: 160px;
      text-align: center;
      font-weight: 600;
    }

    .h2h-vs-badge {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .h2h-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 24px 20px;
      border-radius: var(--radius);
      margin-bottom: 4px;
      position: relative;
      overflow: hidden;
    }

    .h2h-header-bg {
      position: absolute;
      inset: 0;
      opacity: .12;
      z-index: 0;
    }

    .h2h-side-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
      z-index: 1;
    }

    .h2h-side-header.side-a {
      align-items: flex-end;
      text-align: right;
    }

    .h2h-side-header.side-b {
      align-items: flex-start;
      text-align: left;
    }

    .h2h-avatar-big {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      color: #0a0a0c;
      box-shadow: 0 0 0 3px var(--bg), 0 0 24px -4px var(--glow, transparent);
    }

    .h2h-side-name {
      font-weight: 800;
      font-size: 16px;
    }

    .h2h-side-rank {
      font-size: 12px;
      color: var(--muted);
    }

    .h2h-center-label {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .6px;
      position: relative;
      z-index: 1;
      font-weight: 700;
      padding-top: 4px;
    }

    .h2h-shared {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin: 14px 0 6px;
    }

    .h2h-stats {
      display: flex;
      flex-direction: column;
    }

    .h2h-row {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      align-items: center;
      gap: 10px;
      padding: 13px 8px;
      border-top: 1px solid var(--border);
      animation: fadeUp .35s ease both;
    }

    .h2h-row:first-child {
      border-top: none;
    }

    .h2h-row .h2h-val {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .h2h-row .h2h-val.side-left {
      text-align: right;
    }

    .h2h-row .h2h-val.side-right {
      text-align: left;
    }

    .h2h-row .h2h-label {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .h2h-pill {

    /* ============ PARTICLES ============ */
    (function particles() {

      let w, h, pts = [];
      function resize() {w = c.width = window.innerWidth; h = c.height = window.innerHeight;}
      window.addEventListener('resize', resize); resize();
      const N = Math.min(50, Math.floor(window.innerWidth / 25));
      for (let i = 0; i < N; i++) pts.push({x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * .15, vy: (Math.random() - .5) * .15, r: Math.random() * 1.6 + .4});
      function loop() {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#e9fb59';
        pts.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = w; if (p.x > w) p.x = 0; if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;

          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();

    let jsonpCounter = 0;
    function fetchViaJSONP(sheetName, timeoutMs = 12000) {
      return new Promise((resolve, reject) => {
        const callbackName = `__gsheetCb_${Date.now()}_${jsonpCounter++}`;
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
          `tqx=responseHandler:${callbackName}&headers=1&sheet=${encodeURIComponent(sheetName)}`;

        const script = document.createElement('script');

        function cleanup() {
          delete window[callbackName];
          script.remove();
          clearTimeout(timer);
        }

        window[callbackName] = function (response) {
          if (settled) return;
          settled = true;
          cleanup();
          resolve(response);

        script.onerror = () => {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error('Could not reach Google Sheets (network/script load error).'));

        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error('Timed out waiting for Google Sheets response.'));
        }, timeoutMs);

        script.src = url;
        document.body.appendChild(script);
      });

    function buildDatasetFromGrid(grid) {
      if (!grid || grid.length < 2) throw new Error('The sheet data appears to be empty.');
      const header = grid[0].map(v => String(v == null ? '' : v).trim());
      const playerNames = header.slice(1).filter(n => n.length);

      const editions = [];
      for (let r = 1; r < grid.length; r++) {
        const row = grid[r];
        const editionRaw = row[0];
        if (editionRaw === '' || editionRaw === undefined || editionRaw === null) continue;
        const editionNum = String(editionRaw).trim();
        if (!editionNum) continue;
        const results = {};
        for (let c = 1; c < header.length; c++) {
          const name = header[c];
          if (!name) continue;
          const val = row[c];
          if (val === '' || val === undefined || val === null) continue;
          const place = typeof val === 'number' ? val : parseInt(String(val).trim(), 10);
          if (!isNaN(place)) results[name] = place;
        }
        if (Object.keys(results).length === 0) continue;
        editions.push({edition: editionNum, results});
      }
      return {editions, players: playerNames};

      if (!response || !response.table) throw new Error('Unexpected response format from Google Sheets.');
      if (response.status === 'error') {
        const msg = (response.errors && response.errors[0] && (response.errors[0].detailed_message || response.errors[0].message)) || 'Unknown error from Google Sheets.';
        throw new Error(msg);
      }
      const table = response.table;
      const rawRows = (table.rows || []).map(r => (r.c || []).map(cell => (cell && cell.v !== undefined && cell.v !== null) ? cell.v : ''));

      // Google's API sometimes auto-detects the first row as a header and pulls
      // it OUT of table.rows into table.cols[].label — even when we ask it not
      // to. If it did that, table.rows starts at the real data (edition 1), and
      // we must reconstruct the header from cols[].label instead of rows[0],
      // or every row shifts by one (edition 1 gets read as headers, and its
      // placements get misread as player names).
      const colLabels = (table.cols || []).map(c => (c && c.label != null && c.label !== '') ? String(c.label) : '');
      const headerWasExtracted = colLabels.some(l => l.length > 0);

      let grid;
      if (headerWasExtracted) {
        grid = [colLabels, ...rawRows];
      } else {
        grid = rawRows; // no auto-detection happened; first row of rawRows IS the header
      }

      if (grid.length < 2) throw new Error('The "Editions" sheet appears to be empty.');
      return buildDatasetFromGrid(grid);
    }

    /* Parses manually pasted or uploaded delimited text (CSV or TSV — Google
       Sheets copy/paste produces tab-separated values, downloaded files are
       usually comma-separated, so we auto-detect). Used as a fallback when
       the live connection to Google Sheets can't be established. */
    function parseDelimitedText(text) {
      const firstLine = text.split(/\r?\n/)[0] || '';
      const commaCount = (firstLine.match(/,/g) || []).length;
      const tabCount = (firstLine.match(/\t/g) || []).length;
      const delimiter = tabCount > commaCount ? '\t' : ',';
      const lines = text.split(/\r?\n/).filter(l => l.trim().length);
      const grid = lines.map(line => {
        if (delimiter === ',') {
          // simple CSV parse with quote support
          const cells = []; let field = '', inQuotes = false;
          for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (inQuotes) {
              if (c === '"') {if (line[i + 1] === '"') {field += '"'; i++;} else inQuotes = false;}
              else field += c;
            } else {
              if (c === '"') inQuotes = true;
              else if (c === ',') {cells.push(field); field = '';}
              else field += c;
            }
          }
          cells.push(field);
          return cells;
        }
        return line.split('\t');
      });
      return buildDatasetFromGrid(grid);
    }

    async function loadData() {
      const proxyUrl = (SPEEDTAS_API_URL || '').replace(/\/+$/, '');
      if (proxyUrl) {
        try {
          const res = await fetch(proxyUrl + '/data?season=s2');
          if (!res.ok) {
            let msg = `Worker responded with ${res.status}`;
            try {const errBody = await res.json(); if (errBody && errBody.error) msg = errBody.error;} catch (e) {}
            throw new Error(msg);
          }
          const payload = await res.json();
          return {editions: payload.editions, players: payload.players};
        } catch (err) {
          console.warn('Season 2 via Worker failed; trying direct Google Sheets connection.', err);
        }
      }
      const response = await fetchViaJSONP(SHEET_NAME);
      return parseGvizResponse(response);
    }

    /* Retries a flaky async call a few times with a short, growing pause
       between attempts, instead of giving up after one failure. This is
       what a manual page refresh was effectively doing by hand. */
    async function retryAsync(fn, attempts = 3, delayMs = 1200) {
      let lastErr;
      for (let i = 0; i < attempts; i++) {
        try { return await fn(); }
        catch (err) { lastErr = err; if (i < attempts - 1) await new Promise(r => setTimeout(r, delayMs * (i + 1))); }
      }
      throw lastErr;
    }

    /* Cloudflare Workers on the free plan cap each invocation at 50 outgoing
       fetch() calls, so one Discord lookup per ID means the roster can't be
       sent in a single request forever. Splitting into batches keeps each
       request to the Worker safely under that limit, however large the
       roster grows — it just becomes a few more sequential requests. */
    async function fetchAvatarsInBatches(proxyUrl, ids, batchSize = 20) {
      const avatars = {};
      for (let i = 0; i < ids.length; i += batchSize) {
        const batch = ids.slice(i, i + batchSize);
        try {
          const data = await retryAsync(async () => {
            const res = await fetch(proxyUrl + '/avatars?ids=' + encodeURIComponent(batch.join(',')));
            if (!res.ok) throw new Error('Worker responded with ' + res.status);
            return res.json();
          });
          Object.assign(avatars, data.avatars || {});
        } catch (err) {console.warn('Avatar batch failed after retries, continuing with the rest:', err);}
      }
      return avatars;
    }

    async function loadDiscordProfiles() {
      try {
        const response = await retryAsync(() => fetchViaJSONP(PLAYER_SHEET_NAME));
        const table = response?.table;
        const labels = (table?.cols || []).map(c => String(c?.label || '').trim().toLowerCase());
        // Accepts the real sheet headers ("Players" / "Id") as well as the
        // older, more verbose variants, so nothing breaks if either is renamed.
        const nameCol = labels.findIndex(x => x === 'players' || x === 'player' || x === 'player name' || x === 'name');
        const idCol = labels.findIndex(x => x === 'id' || x === 'discord id' || x === 'discordid' || x === 'discord');
        if (nameCol < 0 || idCol < 0) throw new Error('Players tab needs a name column ("Players") and an ID column ("Id").');
        (table.rows || []).forEach(row => {const cells = (row.c || []).map(c => String(c?.v ?? '').trim()); const name = cells[nameCol], id = cells[idCol]; if (name && /^\d{15,25}$/.test(id)) DISCORD_IDS[playerKey(name)] = id;});
        // Every player's ID is pulled from the sheet above in one pass — nobody
        // has to enter IDs one at a time. This just needs a proxy URL to turn
        // those IDs into images: either hardcode your deployed Worker's URL
        // into SPEEDTAS_API_URL above, or set it once via the ⚙️ button on any
        // player card (saved locally) — either source works here.
        const proxyUrl = (SPEEDTAS_API_URL || getAvatarProxyUrl() || '').replace(/\/+$/, '');
        if (proxyUrl && Object.keys(DISCORD_IDS).length) {
          const ids = [...new Set(Object.values(DISCORD_IDS))];
          DISCORD_AVATARS = await fetchAvatarsInBatches(proxyUrl, ids);
        }
      } catch (err) {console.warn('Discord player directory unavailable:', err);}
    }

    /* ============ COMPUTE STATS ============ */
    function computeAll(data) {
      const players = {}; // name -> stats object
      data.players.forEach(name => {
        players[name] = {
          name, points: 0, wins: 0, podiums: 0, played: 0, placements: [],
          cumulative: [], history: [] // {edition, placement, points}
        };
      });

      data.editions.forEach(ed => {
        Object.entries(ed.results).forEach(([name, place]) => {
          if (!players[name]) players[name] = {name, points: 0, wins: 0, podiums: 0, played: 0, placements: [], cumulative: [], history: []};
          const pts = pointsFor(place);
          const p = players[name];
          p.points += pts;
          p.played += 1;
          if (place === 1) p.wins += 1;
          if (place <= 3) p.podiums += 1;
          p.placements.push(place);
          p.history.push({edition: ed.edition, placement: place, points: pts});
        });
      });

      // cumulative points per player aligned to edition order
      const editionOrder = data.editions.map(e => e.edition);
      Object.values(players).forEach(p => {
        let running = 0;
        const map = {};
        p.history.forEach(h => {running += h.points; map[h.edition] = running;});
        let last = 0;
        p.cumulative = editionOrder.map(e => {if (map[e] !== undefined) last = map[e]; return last;});
      });

      // derived stats
      Object.values(players).forEach(p => {
        p.avgPlacement = p.placements.length ? (p.placements.reduce((a, b) => a + b, 0) / p.placements.length) : null;
        p.best = p.placements.length ? Math.min(...p.placements) : null;
        p.worst = p.placements.length ? Math.max(...p.placements) : null;
        p.winRate = p.played ? p.wins / p.played : 0;
        p.podiumRate = p.played ? p.podiums / p.played : 0;
        p.avgPoints = p.played ? p.points / p.played : 0;
      });

      // Streaks — computed over the FULL edition order (not just the player's
      // played editions), because a missed edition must break a streak even
      // though it's not the same as a bad placement. E.g. win, skip, win, win
      // is a streak of 2, not 3 — a gap in participation resets the counter.
      Object.values(players).forEach(p => {p.maxWinStreak = 0; p.maxPodiumStreak = 0;});
      {
        const curWin = {}, curPodium = {};
        data.editions.forEach(ed => {
          Object.values(players).forEach(p => {
            const place = ed.results[p.name];
            if (place === undefined) {
              curWin[p.name] = 0;
              curPodium[p.name] = 0;
            } else {
              curWin[p.name] = (place === 1) ? (curWin[p.name] || 0) + 1 : 0;
              curPodium[p.name] = (place <= 3) ? (curPodium[p.name] || 0) + 1 : 0;
              if (curWin[p.name] > p.maxWinStreak) p.maxWinStreak = curWin[p.name];
              if (curPodium[p.name] > p.maxPodiumStreak) p.maxPodiumStreak = curPodium[p.name];
            }
          });
        });
      }

      // ranking + movement (rank now vs rank excluding last edition)
      const ranked = Object.values(players).filter(p => p.played > 0).sort((a, b) => b.points - a.points);
      ranked.forEach((p, i) => p.rank = i + 1);

      const editionsMinusLast = data.editions.slice(0, -1);
      const prevPoints = {};
      editionsMinusLast.forEach(ed => Object.entries(ed.results).forEach(([name, place]) => {
        prevPoints[name] = (prevPoints[name] || 0) + pointsFor(place);
      }));
      const prevRanked = Object.entries(prevPoints).sort((a, b) => b[1] - a[1]).map(x => x[0]);
      const prevRankMap = {}; prevRanked.forEach((name, i) => prevRankMap[name] = i + 1);
      ranked.forEach(p => {
        const prevRank = prevRankMap[p.name];
        if (prevRank === undefined) p.movement = 0;
        else p.movement = prevRank - p.rank;
      });

      // most improved: compare avg points per edition first half vs second half
      Object.values(players).forEach(p => {
        const h = p.history;
        if (h.length >= 4) {
          const mid = Math.floor(h.length / 2);
          const firstAvg = h.slice(0, mid).reduce((a, b) => a + b.points, 0) / mid;
          const secondAvg = h.slice(mid).reduce((a, b) => a + b.points, 0) / (h.length - mid);
          p.improvement = secondAvg - firstAvg;
        } else p.improvement = null;
      });

      // achievements
      Object.values(players).forEach(p => {
        const badges = [];
        if (p.wins >= 1) badges.push({icon: '🏆', label: 'Champion'});
        if (p.wins >= 3) badges.push({icon: '🥇', label: 'Multi Winner'});
        if (p.maxPodiumStreak >= 5) badges.push({icon: '🔥', label: '5 Podium Streak'});
        if (p.rank && p.rank <= 3) badges.push({icon: '⭐', label: 'Top 3 Leaderboard'});
        if (p.played >= 10) badges.push({icon: '🎯', label: '10 Editions Played'});
        if (p.points >= 100) badges.push({icon: '💯', label: '100 Points'});
        p.badges = badges;
      });

      return {players, editionOrder, ranked};
    }

    /* ============ CUSTOM PROFILE PICTURES ============
       Stored in the browser's localStorage (this file runs standalone, not
       inside Claude's artifact sandbox, so localStorage works normally here).
       Photos are resized client-side before saving so they stay small. */
    const AVATAR_KEY_PREFIX = 'speedtas_v1_avatar_';

    function getAvatarOverride(name) {
      try {const manual = localStorage.getItem(AVATAR_KEY_PREFIX + encodeURIComponent(name)); if (manual) return manual;} catch (e) { }
      const key = playerKey(name);
      return DISCORD_AVATARS[DISCORD_IDS[key]] || null;
    }
    function saveAvatarOverride(name, dataUrl) {
      try {localStorage.setItem(AVATAR_KEY_PREFIX + encodeURIComponent(name), dataUrl); return true;}
      catch (e) {
        console.error('Could not save avatar:', e);
        alert("Couldn't save that photo — your browser's local storage may be full or restricted.");
        return false;
      }
    }
    function deleteAvatarOverride(name) {
      try {localStorage.removeItem(AVATAR_KEY_PREFIX + encodeURIComponent(name));} catch (e) { }
    }

    /* Optional: URL of a self-hosted Discord-ID-to-avatar lookup proxy (see
       discord-avatar-worker.js). Entirely optional — only needed if the person
       sets up the free automatic-lookup Worker. */
    const AVATAR_PROXY_KEY = 'speedtas_v1_avatar_proxy_url';
    function getAvatarProxyUrl() {
      try {return localStorage.getItem(AVATAR_PROXY_KEY);} catch (e) {return null;}
    }
    function saveAvatarProxyUrl(url) {
      try {localStorage.setItem(AVATAR_PROXY_KEY, url); return true;} catch (e) {return false;}
    }

    /* Downscales an uploaded image client-side (max dimension in px) and
       returns a compressed JPEG data URL via callback, keeping storage lean. */
    function resizeImageToDataURL(file, maxDim, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > h) {if (w > maxDim) {h = Math.round(h * maxDim / w); w = maxDim;} }
          else {if (h > maxDim) {w = Math.round(w * maxDim / h); h = maxDim;} }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = () => alert("That file couldn't be read as an image.");
        img.src = e.target.result;
      };
      reader.onerror = () => alert("Couldn't read that file.");
      reader.readAsDataURL(file);
    }

    function promptAvatarUpload(name) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.style.display = 'none';
      document.body.appendChild(input);
      const cleanup = () => {if (input.parentNode) input.remove();};
      input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (file) resizeImageToDataURL(file, 300, (dataUrl) => {if (saveAvatarOverride(name, dataUrl)) render(); cleanup();});
        else cleanup();
      });
      input.addEventListener('cancel', cleanup);
      input.click();
    }
    function removeAvatarClicked(name) {
      deleteAvatarOverride(name);
      render();
    }

    /* ============ AVATAR MODAL (upload OR paste an image URL) ============
       Discord has no public, no-login API to fetch a user's avatar from just
       their numeric ID — that needs a bot token, which we won't hardcode into
       a shareable static file (anyone could view-source and steal it). The
       practical equivalent: in Discord, right-click a person's avatar → "Copy
       Avatar Link" → paste it here. Same result, no credentials involved. */
    function closeAvatarModal() {
      const el = document.getElementById('avatarModalBackdrop');
      if (el) el.remove();
    }
    function openAvatarModal(name) {
      closeAvatarModal();
      const backdrop = document.createElement('div');
      backdrop.id = 'avatarModalBackdrop';
      backdrop.className = 'avatar-modal-backdrop';
      const proxyUrl = getAvatarProxyUrl();
      backdrop.innerHTML = `
    <div class="avatar-modal" role="dialog" aria-label="Change photo for ${name}">
      <div class="avatar-modal-head">
        <b>Change photo — ${name}</b>
        <button type="button" class="avatar-modal-close" id="avatarModalClose" aria-label="Close">✕</button>
      </div>
      <button type="button" class="refresh-btn" id="avatarModalUploadBtn" style="width:100%;justify-content:center;margin-bottom:14px;">📁 Upload from device</button>
      <div style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px;">or</div>
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px;">Paste an image URL</label>
      <input type="text" id="avatarUrlInput" placeholder="https://cdn.discordapp.com/avatars/..." style="width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 12px;font-size:13px;outline:none;box-sizing:border-box;margin-bottom:8px;">
      <button type="button" class="refresh-btn" id="avatarUrlBtn" style="width:100%;justify-content:center;">Use This URL</button>

      <div style="text-align:center;color:var(--muted);font-size:12px;margin:14px 0;">or</div>
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px;">Enter Discord ID (auto-fetch)</label>
      <div style="display:flex;gap:6px;">
        <input type="text" id="avatarIdInput" placeholder="e.g. 123456789012345678" style="flex:1;min-width:0;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 12px;font-size:13px;outline:none;box-sizing:border-box;">
        <button type="button" class="refresh-btn" id="avatarIdBtn">Fetch</button>
      </div>
      <button type="button" class="avatar-remove-link" id="avatarProxySettingsBtn" style="margin-top:8px;">⚙️ ${proxyUrl ? 'Change lookup server' : 'Set up automatic lookup (one-time, free)'}</button>

      <div id="avatarModalError" style="color:#e2585b;font-size:12px;margin-top:8px;"></div>
      <div style="font-size:11px;color:var(--muted);margin-top:14px;line-height:1.6;">
        💡 <b>Have a shared server/DM with them?</b> In Discord, right-click their profile picture → <b>"Copy Avatar Link"</b> — paste it above.<br>
        🔗 <b>Only have their Discord ID?</b> Use <a href="https://www.vibebot.gg/tools/avatar-downloader" target="_blank" rel="noopener" style="color:var(--accent);">VibeBot's Avatar Downloader ↗</a>, or set up automatic lookup above.
      </div>
    </div>
  `;
      document.body.appendChild(backdrop);

      backdrop.addEventListener('click', (e) => {if (e.target === backdrop) closeAvatarModal();});
      document.getElementById('avatarModalClose').addEventListener('click', closeAvatarModal);
      document.getElementById('avatarModalUploadBtn').addEventListener('click', () => {closeAvatarModal(); promptAvatarUpload(name);});

      document.getElementById('avatarProxySettingsBtn').addEventListener('click', () => {
        const current = getAvatarProxyUrl() || '';
        const next = window.prompt(
          "Paste your Cloudflare Worker URL (see discord-avatar-worker.js for setup steps):",
          current
        );
        if (next !== null && next.trim()) {
          saveAvatarProxyUrl(next.trim().replace(/\/+$/, ''));
          openAvatarModal(name); // reopen to refresh the button label and re-bind handlers
        }
      });

      async function tryFetchById() {
        const errEl = document.getElementById('avatarModalError');
        const proxy = getAvatarProxyUrl();
        const id = document.getElementById('avatarIdInput').value.trim();
        if (!proxy) {errEl.textContent = 'Set up automatic lookup first (⚙️ above) — it takes about 5 minutes, one time only.'; return;}
        if (!/^\d{15,25}$/.test(id)) {errEl.textContent = "That doesn't look like a valid Discord ID (should be a 15–25 digit number)."; return;}
        errEl.textContent = 'Looking up…';
        try {
          const res = await fetch(proxy + '/avatar?id=' + encodeURIComponent(id));
          const data = await res.json();
          if (!res.ok || data.error) {errEl.textContent = data.error || 'Lookup failed.'; return;}
          if (saveAvatarOverride(name, data.avatarUrl)) {closeAvatarModal(); render();}
        } catch (e) {
          errEl.textContent = "Couldn't reach your lookup server. Double-check the URL in settings (⚙️ above).";
        }
      }
      document.getElementById('avatarIdBtn').addEventListener('click', tryFetchById);
      document.getElementById('avatarIdInput').addEventListener('keydown', (e) => {if (e.key === 'Enter') tryFetchById();});

      function tryUseUrl() {
        const errEl = document.getElementById('avatarModalError');
        const url = document.getElementById('avatarUrlInput').value.trim();
        if (!url) {errEl.textContent = 'Paste a URL first.'; return;}
        if (!/^https?:\/\//i.test(url)) {errEl.textContent = 'That doesn\'t look like a valid URL (should start with http:// or https://).'; return;}
        errEl.textContent = 'Checking image…';
        const testImg = new Image();
        testImg.onload = () => {if (saveAvatarOverride(name, url)) {closeAvatarModal(); render();} };
        testImg.onerror = () => {errEl.textContent = "Couldn't load an image from that URL. Double-check it's a direct image link.";};
        testImg.src = url;
      }
      document.getElementById('avatarUrlBtn').addEventListener('click', tryUseUrl);
      document.getElementById('avatarUrlInput').addEventListener('keydown', (e) => {if (e.key === 'Enter') tryUseUrl();});
      document.getElementById('avatarUrlInput').focus();
    }

    /* Delegated so it works for dynamically-rendered avatars anywhere on the page,
       and stops the click from also triggering a wrapping link (e.g. a player card). */
    document.addEventListener('click', (e) => {
      const editBtn = e.target.closest('.avatar-edit-btn');
      if (editBtn) {e.preventDefault(); e.stopPropagation(); openAvatarModal(decodeURIComponent(editBtn.dataset.player)); return;}
      const removeBtn = e.target.closest('.avatar-remove-btn');
      if (removeBtn) {e.preventDefault(); e.stopPropagation(); removeAvatarClicked(decodeURIComponent(removeBtn.dataset.player)); return;}
    });

    /* ============ COLOR HELPERS ============ */
    const PALETTE = ['#e9fb59', '#59d6fb', '#fb59c9', '#59fba0', '#fba059', '#a059fb', '#fb5959', '#59fbf0'];
    function colorForName(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return PALETTE[Math.abs(hash) % PALETTE.length];
    }
    function initials(name) {
      return name.split(/\s+/).map(s => s[0]).join('').slice(0, 2).toUpperCase();
    }
    function avatarHTML(name, size) {
      const s = size || 32;
      const photo = getAvatarOverride(name) || DISCORD_AVATARS[playerKey(name)];
      if (photo) {
        return `<img src="${photo}" alt="${name}" loading="lazy" onerror="handleAvatarError(this,'${encodeURIComponent(name)}')" style="width:${s}px;height:${s}px;border-radius:50%;object-fit:cover;flex-shrink:0;display:inline-block;vertical-align:middle;">`;
      }
      const c = colorForName(name);
      return `<div class="avatar" style="background:${c};${size ? `width:${size}px;height:${size}px;font-size:${size * 0.35}px;` : ''}">${initials(name)}</div>`;
    }
    /* If a Discord CDN image 404s or is unreachable, swap it for the same
       colored-initials avatar avatarHTML() would have used anyway. */
    function handleAvatarError(img, encodedName) {
      const name = decodeURIComponent(encodedName);
      const s = img.clientWidth || img.offsetWidth || 32;
      const div = document.createElement('div');
      div.className = 'avatar';
      div.style.cssText = `background:${colorForName(name)};width:${s}px;height:${s}px;font-size:${Math.round(s * 0.35)}px;`;
      div.textContent = initials(name);
      img.replaceWith(div);
    }
    /* Same as avatarHTML but wraps it with a small always-visible edit button
       that opens the file picker — this is the "easy to change" entry point. */
    function avatarEditableHTML(name, size, btnSize) {
      const bs = btnSize || Math.max(16, Math.round((size || 32) * 0.34));
      return `<div class="avatar-wrap" style="width:${size || 32}px;height:${size || 32}px;">
    ${avatarHTML(name, size)}
    <button type="button" class="avatar-edit-btn" data-player="${encodeURIComponent(name)}" title="Change photo for ${name}" aria-label="Change photo for ${name}" style="width:${bs}px;height:${bs}px;font-size:${Math.round(bs * 0.55)}px;">📷</button>
  </div>`;
    }
    function medalFor(rank) {
      if (rank === 1) return '<span class="medal">🥇</span>';
      if (rank === 2) return '<span class="medal">🥈</span>';

    function nextSaturday18Lisbon() {
      const now = new Date();
      // Get current time components in Europe/Lisbon
      const fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Europe/Lisbon', hour12: false,
        year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short'
      });
      const parts = fmt.formatToParts(now);
      const map = {}; parts.forEach(p => map[p.type] = p.value);
      const weekdayMap = {Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6};
      const curDow = weekdayMap[map.weekday];
      let daysUntil = (6 - curDow + 7) % 7;
      const curHour = parseInt(map.hour), curMin = parseInt(map.minute), curSec = parseInt(map.second);
      if (daysUntil === 0 && (curHour > 18 || (curHour === 18 && (curMin > 0 || curSec > 0)))) daysUntil = 7;

      // Build target date string in Lisbon local time, then convert properly
      const target = new Date(now.getTime());
      target.setUTCDate(target.getUTCDate()); // placeholder
      // Simplify: construct via Lisbon offset estimate using Intl
      const y = parseInt(map.year), mo = parseInt(map.month), d = parseInt(map.day);
      const baseLocal = new Date(Date.UTC(y, mo - 1, d, curHour, curMin, curSec));
      const targetLocalMidnightOffset = daysUntil * 24 * 3600 * 1000;
      // offset between "now" real UTC and the Lisbon wall-clock reading
      const wallClockUTC = Date.UTC(y, mo - 1, d, curHour, curMin, curSec);
      const offsetMs = now.getTime() - wallClockUTC; // Lisbon local -> real UTC offset
      const targetWallClockUTC = Date.UTC(y, mo - 1, d, 18, 0, 0) + targetLocalMidnightOffset;
      return new Date(targetWallClockUTC + offsetMs);
    }
    function startCountdown() {
      if (countdownTimer) clearInterval(countdownTimer);
      function tick() {
        const target = nextSaturday18Lisbon();
        const diff = target.getTime() - Date.now();
        const el = document.getElementById('countdown');
        if (!el) {clearInterval(countdownTimer); return;}
        if (diff <= 0) {el.innerHTML = '<div class="unit"><div class="num">🎉</div><div class="unit-label">Live now!</div></div>'; return;}
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        el.innerHTML = `
      <div class="unit"><div class="num">${days}</div><div class="unit-label">Days</div></div>
      <div class="unit"><div class="num">${String(hours).padStart(2, '0')}</div><div class="unit-label">Hours</div></div>
      <div class="unit"><div class="num">${String(mins).padStart(2, '0')}</div><div class="unit-label">Minutes</div></div>
      <div class="unit"><div class="num">${String(secs).padStart(2, '0')}</div><div class="unit-label">Seconds</div></div>
    `;
      }
      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    function getCachedVideos() {
      try {
        const raw = localStorage.getItem(YT_CACHE_KEY);
        if (!raw) return null;

          const res = await fetch(proxyUrl);

        } catch (err) {
          console.warn('Worker video proxy unreachable, falling back to the RSS feed:', err);
        }

      const res = await fetch(YT_RSS2JSON_URL);

      </p>
      <div id="videosContent"></div>
    </section>
  `;

      document.getElementById('ytRefreshBtn').addEventListener('click', () => {
        videosCache = null;
        try {localStorage.removeItem(YT_CACHE_KEY);} catch (e) { }
        renderVideos();
      });

      const contentEl = document.getElementById('videosContent');
      if (videosCache) {renderVideoGrid(videosCache); return;}
      const cached = getCachedVideos();
      if (cached) {videosCache = cached; renderVideoGrid(cached); return;}

      contentEl.innerHTML = `<div class="loader"><div class="spinner"></div> Loading videos…</div>`;
      fetchChannelVideos().then(videos => {
        videosCache = videos;
        setCachedVideos(videos);
        renderVideoGrid(videos);
      }).catch(err => {
        contentEl.innerHTML = `
      <div class="empty-state">
        ⚠️ Couldn't load the video feed right now.<br><small>${escapeHtml(err.message)}</small><br><br>
        <button class="refresh-btn" id="ytRetryBtn">↻ Try Again</button>
      </div>`;
        const retryBtn = document.getElementById('ytRetryBtn');
        if (retryBtn) retryBtn.addEventListener('click', () => {videosCache = null; renderVideos();});
      });
    }

    function renderVideoGrid(videos) {
      const contentEl = document.getElementById('videosContent');
      if (!contentEl) return;
      if (!videos.length) {
        contentEl.innerHTML = `<div class="empty-state">No videos found on the channel yet.</div>`;
        return;
      }
      contentEl.innerHTML = `<div class="video-grid" id="videoGrid">${videos.map((v, i) => videoCardHTML(v, i)).join('')}</div>`;
      document.querySelectorAll('.video-card').forEach(card => {
        card.addEventListener('click', () => toggleVideoCard(card));
      });
    }

    function videoCardCollapsedInner(v) {
      return `
    <div class="video-thumb-wrap">
      <img src="${v.thumbnail}" alt="${escapeHtml(v.title)}" loading="lazy">
      <div class="video-play-overlay">▶</div>
    </div>
    <div class="video-card-title">${escapeHtml(v.title)}</div>
  `;
    }
    function videoCardHTML(v, i) {
      return `<div class="video-card" data-video-id="${v.id}" style="animation-delay:${Math.min(i * 0.02, 0.4)}s">${videoCardCollapsedInner(v)}</div>`;
    }

    function toggleVideoCard(card) {
      const grid = document.getElementById('videoGrid');
      const wasExpanded = card.classList.contains('expanded');
      grid.querySelectorAll('.video-card.expanded').forEach(c => {if (c !== card) collapseCard(c);});
      if (wasExpanded) collapseCard(card); else expandCard(card);
    }

    function expandCard(card) {
      const videoId = card.dataset.videoId;
      const v = (videosCache || []).find(x => x.id === videoId);
      const title = v ? v.title : '';
      card.classList.add('expanded');
      card.innerHTML = `
    <div class="video-expanded-head">
      <b>${escapeHtml(title)}</b>
      <span class="video-collapse-hint">✕ Close</span>
    </div>
    <div style="position:relative;padding-top:56.25%;">
      <iframe
        src="https://www.youtube.com/embed/${videoId}?autoplay=1"
        title="${escapeHtml(title)}"
        style="position:absolute;inset:0;width:100%;height:100%;border:0;"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
    </div>
    <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" rel="noopener" class="video-watch-link">Watch on YouTube ↗</a>
  `;
      const watchLink = card.querySelector('.video-watch-link');
      if (watchLink) watchLink.addEventListener('click', (e) => e.stopPropagation());
    }

    function collapseCard(card) {
      const videoId = card.dataset.videoId;
      const v = (videosCache || []).find(x => x.id === videoId);
      card.classList.remove('expanded');
      if (v) card.innerHTML = videoCardCollapsedInner(v);
    }

    /* ============ SEASON COMPARISON ============ */
    const PLAYER_ALIASES = {lildemo: 'demo', caster: 'c4ster', elliot: 'eliot'};
    const playerKey = name => PLAYER_ALIASES[name.toLowerCase().replace(/[^a-z0-9]/g, '')] || name.toLowerCase().replace(/[^a-z0-9]/g, '');
    function oneLetterApart(a, b) {
      if (a === b) return true;
      if (Math.abs(a.length - b.length) > 1) return false;
      let i = 0, j = 0, edits = 0;
      while (i < a.length && j < b.length) {if (a[i] === b[j]) {i++; j++;} else if (++edits > 1) return false; else if (a.length > b.length) i++; else if (b.length > a.length) j++; else {i++; j++;} }
      return true;
    }
    function seasonStats(data) {return computeAll(data).ranked;}
    function rankMap(data, knownKeys = []) {const map = {}; seasonStats(data).forEach((p, i) => {let key = playerKey(p.name); if (!knownKeys.includes(key)) {const close = knownKeys.find(k => oneLetterApart(k, key)); if (close) key = close;} map[key] = {...p, rank: i + 1};}); return map;}
    function statCard(label, value, sub = '') {return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;}
    function comparisonRows(s1, s2) {
      const a = rankMap(s1), b = rankMap(s2, Object.keys(a)), keys = [...new Set([...Object.keys(a), ...Object.keys(b)])];
      return keys.map(k => {
        const x = a[k], y = b[k];
        return {
          key: k, name: (y || x).name, s1: x, s2: y, delta: x && y ? x.rank - y.rank : null,
          total: (x ? x.points : 0) + (y ? y.points : 0), played: (x ? x.played : 0) + (y ? y.played : 0),
          wins: (x ? x.wins : 0) + (y ? y.wins : 0), podiums: (x ? x.podiums : 0) + (y ? y.podiums : 0)
        };
      }).sort((x, y) => y.total - x.total || y.played - x.played);
    }
    function metric(p, key, fallback = '—') {return p ? (key === 'avgPlacement' ? p[key].toFixed(2) : p[key]) : fallback;}
    const COMPARISON_COLUMNS = [
      ['name', 'Player'], ['s1Rank', 'S1 rank'], ['s1Points', 'S1 pts'], ['s1Played', 'S1 played'],
      ['s2Rank', 'S2 rank'], ['s2Points', 'S2 pts'], ['s2Played', 'S2 played'], ['delta', 'Rank change']
    ];
    function comparisonValue(row, key) {
      if (key === 'name') return row.name.toLowerCase();
      if (key === 's1Rank') return row.s1?.rank;
      if (key === 's1Points') return row.s1?.points;
      if (key === 's1Played') return row.s1?.played;
      if (key === 's2Rank') return row.s2?.rank;
      if (key === 's2Points') return row.s2?.points;
      if (key === 's2Played') return row.s2?.played;
      return row.delta;
    }
    function renderComparisonTable(rows) {
      const host = document.getElementById('comparisonTable');
      let state = {key: 's2Rank', dir: 'asc'};
      const cell = (r, key) => {
        if (key === 'name') return `<b class="player-name">${r.name}</b>`;
        if (key === 's1Rank') return r.s1 ? '#' + r.s1.rank : '—';
        if (key === 's1Points') return metric(r.s1, 'points');
        if (key === 's1Played') return metric(r.s1, 'played');
        if (key === 's2Rank') return r.s2 ? '#' + r.s2.rank : '—';
        if (key === 's2Points') return metric(r.s2, 'points');
        if (key === 's2Played') return metric(r.s2, 'played');
        return `<span style="color:${r.delta > 0 ? 'var(--accent)' : r.delta < 0 ? '#fb5959' : 'var(--muted)'}">${r.delta === null ? '—' : r.delta > 0 ? '▲ ' + r.delta : r.delta < 0 ? '▼ ' + Math.abs(r.delta) : '—'}</span>`;
      };
      function draw() {
        const sorted = [...rows].sort((a, b) => {
          const av = comparisonValue(a, state.key), bv = comparisonValue(b, state.key);
          if (av === undefined || av === null) return 1; if (bv === undefined || bv === null) return -1;
          const result = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
          return state.dir === 'asc' ? result : -result;
        });
        host.innerHTML = `<div class="compare-table-wrap"><table><thead><tr>${COMPARISON_COLUMNS.map(([key, label]) => `<th data-compare-sort="${key}" class="${state.key === key ? 'sorted' : ''}" data-arrow="${state.dir === 'asc' ? '↑' : '↓'}">${label}</th>`).join('')}</tr></thead><tbody>${sorted.map(r => `<tr>${COMPARISON_COLUMNS.map(([key]) => `<td>${cell(r, key)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
        host.querySelectorAll('[data-compare-sort]').forEach(th => th.addEventListener('click', () => {const key = th.dataset.compareSort; state = {key, dir: state.key === key && state.dir === 'asc' ? 'desc' : 'asc'}; draw();}));
      }
      draw();
    }
    function renderSeasonCompare() {
      main.innerHTML = `<div class="loader"><div class="spinner"></div> Loading Season 1 comparison…</div>`;
      loadSeason1().then(s1 => {
        const s2 = RAW, one = seasonStats(s1), two = seasonStats(s2), rows = comparisonRows(s1, s2);
        const shared = rows.filter(r => r.s1 && r.s2), newcomers = rows.filter(r => !r.s1 && r.s2), departed = rows.filter(r => r.s1 && !r.s2);
        const biggest = [...shared].sort((a, b) => (b.delta || 0) - (a.delta || 0))[0];
        const s1Leader = one[0], s2Leader = two[0];
        main.innerHTML = `
      <section><div class="season-intro"><h2 class="section-title">Season 1 ↔ Season 2</h2><p>Two seasons, one evolving field. Compare player results, participation and rank movement side by side.</p></div>
      <div class="compare-spotlight"><div class="compare-spotlight-card"><div class="kicker">Season leaders</div><b><strong>S1</strong> ${s1Leader?.name || '—'} <span style="color:var(--muted);font-size:13px;font-weight:500">${s1Leader?.points || 0} pts</span></b><b><strong>S2</strong> ${s2Leader?.name || '—'} <span style="color:var(--muted);font-size:13px;font-weight:500">${s2Leader?.points || 0} pts</span></b></div><div class="compare-spotlight-card compact"><div class="kicker">Returning</div><b>${shared.length}</b><span style="color:var(--muted);font-size:12px">players raced both</span></div></div>
      <div class="grid cards">${statCard('Season 1', '67', 'editions · 56 registered players')}${statCard('Season 2', s2.editions.length, `editions · ${two.length} active players`)}${statCard('Biggest rank gain', biggest ? biggest.name : '—', biggest ? `▲ ${biggest.delta} · #${biggest.s1.rank} → #${biggest.s2.rank}` : 'No matched players')}</div></section>
      <section class="panel"><h2 class="section-title">Player comparison</h2><p class="compare-hint">↑ Ascending · ↓ Descending · blank entries always remain at the bottom.</p><div id="comparisonTable"></div></section>`;
        renderComparisonTable(rows);
      }).catch(err => {main.innerHTML = `<div class="panel"><h2 class="section-title">Season 1 unavailable</h2><p style="color:var(--muted)">${err.message} Check that the Season 1 sheet remains published as CSV.</p></div>`;});
    }
    function renderAllTime() {
      main.innerHTML = `<div class="loader"><div class="spinner"></div> Building all-time standings…</div>`;
      loadSeason1().then(s1 => {
        const rows = comparisonRows(s1, RAW), s1Board = seasonStats(s1).slice(0, 25), s2Board = seasonStats(RAW).slice(0, 25);
        const mixedBoard = rows.map(r => ({name: r.name, points: r.total, played: r.played, wins: r.wins, podiums: r.podiums})).sort((a, b) => b.points - a.points || b.wins - a.wins).slice(0, 25);
        const table = (board, label) => `<section class="panel"><h2 class="section-title">${label}</h2><div style="overflow:auto"><table class="data-table"><thead><tr><th>#</th><th>Player</th><th>Points</th><th>Played</th><th>Wins</th><th>Podiums</th></tr></thead><tbody>${board.map((p, i) => `<tr><td>${i + 1}</td><td><b>${p.name}</b></td><td style="color:var(--accent);font-weight:800">${p.points}</td><td>${p.played}</td><td>${p.wins}</td><td>${p.podiums}</td></tr>`).join('')}</tbody></table></div></section>`;
        main.innerHTML = `<section><h2 class="section-title">Season standings</h2><p style="color:var(--muted);margin:-4px 0 18px;">Season leaderboards remain separate. The all-time table adds both seasons after alias and one-letter name matching.</p><div class="grid cards">${statCard('Season 1', s1.editions.length, 'editions')}${statCard('Season 2', RAW.editions.length, 'editions')}${statCard('Players in both', rows.filter(r => r.s1 && r.s2).length, 'after alias matching')}</div></section><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(420px,1fr));">${table(s1Board, 'Season 1 leaderboard')}${table(s2Board, 'Season 2 leaderboard')}${table(mixedBoard, 'All-time overall')}</div>`;
      }).catch(err => {main.innerHTML = `<div class="panel"><h2 class="section-title">All-time view unavailable</h2><p style="color:var(--muted)">${err.message}</p></div>`;});
    }



    function render() {
      document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
      const route = currentRoute();
      if (route.length === 0) {
        document.querySelector('nav a[data-route="/"]').classList.add('active');
        renderHome();
      } else if (route[0] === 'players') {
        document.querySelector('nav a[data-route="/players"]').classList.add('active');
        renderPlayers();
      } else if (route[0] === 'player' && route[1]) {
        if ((route[1] === 's1' || route[1] === 's2' || route[1] === 'all') && route[2]) renderPlayerProfileEnhanced(route[2], route[1]);
        else renderPlayerProfileEnhanced(route[1]);
      } else if (route[0] === 'history') {
        document.querySelector('nav a[data-route="/history"]').classList.add('active');
        renderHistory();
      } else if (route[0] === 'season-compare') {
        document.querySelector('nav a[data-route="/season-compare"]').classList.add('active');
        renderSeasonCompare();
      } else if (route[0] === 'all-time') {
        document.querySelector('nav a[data-route="/all-time"]').classList.add('active');
        renderAllTime();
      } else if (route[0] === 'edition' && route[1]) {
        if ((route[1] === 's1' || route[1] === 's2') && route[2]) renderEditionDetail(route[2], route[1]);
        else renderEditionDetail(route[1]);
      } else if (route[0] === 'versus') {
        document.querySelector('nav a[data-route="/versus"]').classList.add('active');
        renderVersus(route[1], route[2]);
      } else if (route[0] === 'videos') {
        document.querySelector('nav a[data-route="/videos"]').classList.add('active');
        renderVideos();
      } else {
        renderHome();
      }
    }

    /* ============ GLOBAL SEARCH ============ */
    const searchInput = document.getElementById('globalSearch');
    const searchResults = document.getElementById('searchResults');
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      if (!q || !RAW) {searchResults.style.display = 'none'; return;}
      const playerMatches = RAW.players.filter(n => n.toLowerCase().includes(q)).slice(0, 6);
      const editionMatches = RAW.editions.filter(e => String(e.edition).toLowerCase().includes(q)).slice(0, 4);
      const items = [
        ...playerMatches.map(n => ({label: `👤 ${n}`, href: `#/player/${encodeURIComponent(n)}`})),
        ...editionMatches.map(e => ({label: `🏁 Edition ${e.edition}`, href: `#/edition/${encodeURIComponent(e.edition)}`}))
      ];
      if (!items.length) {searchResults.style.display = 'none'; return;}
      searchResults.innerHTML = items.map(it => `<div data-href="${it.href}">${it.label}</div>`).join('');
      searchResults.style.display = 'block';
      searchResults.querySelectorAll('div').forEach(d => {
        d.addEventListener('click', () => {location.hash = d.dataset.href.slice(1); searchResults.style.display = 'none'; searchInput.value = '';});
      });
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.search-wrap')) searchResults.style.display = 'none';
    });

    /* ============ REFRESH ============ */
    document.getElementById('refreshBtn').addEventListener('click', init);

    /* ============ DATA SOURCE STATUS BANNER ============ */
    let dataSourceStatus = 'live'; // 'live' | 'fallback' | 'manual'

    function renderStatusBanner() {
      const existing = document.getElementById('statusBanner');
      if (existing) existing.remove();
      if (dataSourceStatus === 'live') return;

      const banner = document.createElement('div');
      banner.id = 'statusBanner';
      banner.style.cssText = `
    max-width:1200px;margin:0 auto 20px;padding:12px 18px;border-radius:12px;
    background:rgba(233,251,89,.08);border:1px solid rgba(233,251,89,.3);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--text);
  `;
      const label = dataSourceStatus === 'fallback'
        ? "⚠️ Couldn't reach the live sheet — showing a saved snapshot (may be out of date)."
        : "📋 Showing manually loaded data.";
      banner.innerHTML = `
    <span>${label}</span>
    <button class="refresh-btn" id="bannerRetry" style="padding:5px 10px;">↻ Retry Live</button>
    <button class="refresh-btn" id="bannerManual" style="padding:5px 10px;">Load Newer Data</button>
    <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:html&sheet=${encodeURIComponent(SHEET_NAME)}" target="_blank" rel="noopener" style="color:var(--accent);margin-left:auto;">Check raw sheet ↗</a>
  `;
      main.parentNode.insertBefore(banner, main);
      document.getElementById('bannerRetry').addEventListener('click', init);
      document.getElementById('bannerManual').addEventListener('click', () => renderManualPanel());
    }

    function renderManualPanel() {
      main.innerHTML = `
    <div class="panel" style="max-width:640px;margin:20px auto;">
      <b style="color:var(--text);font-size:14px;">Load data manually</b>
      <p style="color:var(--muted);font-size:13px;">Select all data in the "Editions" tab and copy it (Ctrl/Cmd+C), then paste below. Or download the tab as .csv and upload it.</p>
      <textarea id="manualPaste" placeholder="Paste sheet data here..." style="width:100%;min-height:100px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px;font-size:12px;font-family:monospace;margin-bottom:10px;"></textarea>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <button class="refresh-btn" id="usePasteBtn">Use Pasted Data</button>
        <span style="color:var(--muted);font-size:12px;">or</span>
        <label class="refresh-btn" style="cursor:pointer;">
          Upload CSV File
          <input type="file" id="csvUpload" accept=".csv,.tsv,text/csv,text/tab-separated-values" style="display:none;">
        </label>
        <button class="export-btn" id="cancelManual">Cancel</button>
      </div>
      <div id="manualError" style="color:#e2585b;font-size:12px;margin-top:8px;"></div>
    </div>
  `;
      document.getElementById('cancelManual').addEventListener('click', () => {render(); renderStatusBanner();});
      document.getElementById('usePasteBtn').addEventListener('click', () => {
        const text = document.getElementById('manualPaste').value;
        const errEl = document.getElementById('manualError');
        try {
          if (!text.trim()) throw new Error('Paste some data first.');
          RAW = parseDelimitedText(text);
          dataSourceStatus = 'manual';
          render(); renderStatusBanner();
        } catch (e) {errEl.textContent = e.message;}
      });
      document.getElementById('csvUpload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            RAW = parseDelimitedText(reader.result);
            dataSourceStatus = 'manual';
            render(); renderStatusBanner();
          } catch (err2) {document.getElementById('manualError').textContent = err2.message;}
        };
        reader.onerror = () => {document.getElementById('manualError').textContent = 'Could not read file.';};
        reader.readAsText(file);
      });
    }

    /* ============ INIT ============ */
    async function init() {
      main.innerHTML = `<div class="loader"><div class="spinner"></div> Loading SpeedTAS data...</div>`;
      const existingBanner = document.getElementById('statusBanner');
      if (existingBanner) existingBanner.remove();
      try {
        RAW = await loadData();
        await loadDiscordProfiles();
        dataSourceStatus = 'live';
        render();
      } catch (err) {
        console.error('Live connection failed, using fallback snapshot:', err);
        try {
          RAW = parseDelimitedText(FALLBACK_CSV_TEXT);
          dataSourceStatus = 'fallback';
          render();
          renderStatusBanner();
        } catch (err2) {
          console.error(err2);
          renderManualPanel();
        }
      }
    }
    init();
  </script>

</body>
